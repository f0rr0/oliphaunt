$schema: "https://moonrepo.dev/schemas/project.json"

id: "release-tools"
language: "javascript"
layer: "tool"
stack: "infrastructure"
tags: ["tools", "release"]
dependsOn:
  - id: "postgres18"
    scope: "build"
  - id: "source-toolchains"
    scope: "build"
  - id: "third-party-shared"
    scope: "build"
  - id: "third-party-native"
    scope: "build"
  - id: "third-party-wasix"
    scope: "build"
  - id: "extensions"
    scope: "build"
  - id: "liboliphaunt-native"
    scope: "build"
  - id: "liboliphaunt-wasix"
    scope: "build"
  - id: "oliphaunt-rust"
    scope: "build"
  - id: "oliphaunt-broker"
    scope: "build"
  - id: "oliphaunt-node-direct"
    scope: "build"
  - id: "oliphaunt-swift"
    scope: "build"
  - id: "oliphaunt-kotlin"
    scope: "build"
  - id: "oliphaunt-react-native"
    scope: "build"
  - id: "oliphaunt-js"
    scope: "build"
  - id: "oliphaunt-wasix-rust"
    scope: "build"

project:
  title: "Release Tools"
  description: "Release-please identity, product-local metadata, packaging gates, and release workflow helpers."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  # Planner-only source edge for the fail-closed validation that runs after
  # both iOS carrier producers and before either artifact upload.
  ios-carrier-validation-trigger:
    tags: ["release", "planner"]
    command: "true"
    inputs:
      - "/tools/release/portable-archive.mjs"
      - "/tools/release/validate-ios-carrier-zips.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
  check:
    tags: ["policy", "assertion", "quality", "static"]
    command: "tools/dev/bun.sh tools/release/release-check.mjs"
    inputs:
      # Release planning and mutation tests query Moon and CI selection code.
      - "/.moon/workspace.yml"
      - "/.moon/toolchains.yml"
      - "/.github/**/*"
      - "/benchmarks/moon.yml"
      - "/Cargo.lock"
      - "/Cargo.toml"
      - "/coverage/baseline.toml"
      - "/examples/moon.yml"
      - "/moon.yml"
      - "/README.md"
      - "/docs/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/release-please-config.json"
      - "/.release-please-manifest.json"
      - "/src/**/*"
      - "!/src/**/node_modules"
      - "!/src/**/node_modules/**"
      - "!/src/**/.build"
      - "!/src/**/.build/**"
      - "!/src/**/.gradle/**"
      - "!/src/**/.cxx/**"
      - "!/src/**/.next/**"
      - "!/src/**/.source/**"
      - "!/src/**/build/**"
      - "!/src/**/out/**"
      - "!/src/**/Pods/**"
      - "!/src/**/DerivedData/**"
      - "/tools/**/moon.yml"
      - "/tools/graph/**/*"
      - "/tools/policy/**/*"
      - "/tools/release/**/*"
      - "/tools/test/create-broker-release-fixture.mjs"
      - "/tools/test/create-liboliphaunt-release-fixture.mjs"
      - "/tools/test/release-fixture-utils.mjs"
    options:
      # Release planning observes live Git and Moon state.
      cache: false
      runFromWorkspaceRoot: true
  broker-dependency-license-audit:
    tags: ["policy", "assertion", "quality", "static", "ci-rust"]
    command: "tools/dev/bun.sh tools/release/broker-dependency-license-contract.mjs audit-contract"
    inputs:
      - "/Cargo.lock"
      - "/Cargo.toml"
      - "/rust-toolchain.toml"
      - "/benchmarks/**/Cargo.toml"
      - "/examples/**/Cargo.toml"
      - "/src/**/Cargo.toml"
      - "/tools/**/Cargo.toml"
      - "/src/runtimes/broker/dependency-licenses.json"
      - "/src/runtimes/broker/dependency-license-blobs/**/*"
      - "/tools/dev/capture-command-output.mjs"
      - "/tools/release/broker-dependency-license-contract.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
  release-check:
    tags: ["release", "package"]
    command: "true"
    deps:
      - "release-tools:check"
    options:
      cache: true
      runFromWorkspaceRoot: true
