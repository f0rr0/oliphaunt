$schema: https://moonrepo.dev/schemas/project.json
id: release-tools
language: typescript
layer: tool
stack: infrastructure
tags:
  - javascript-quality
  - tools
  - release
dependsOn:
  - id: shared-test-fixtures
    scope: development
  - id: extension-runtime-contract
    scope: build
  - id: extensions
    scope: build
  - id: extension-artifacts-wasix
    scope: build
  - id: extension-artifacts-native
    scope: build
  - id: liboliphaunt-native
    scope: build
  - id: liboliphaunt-wasix
    scope: build
  - oliphaunt-broker
  - oliphaunt-js
  - oliphaunt-kotlin
  - oliphaunt-node-direct
  - oliphaunt-react-native
  - oliphaunt-rust
  - oliphaunt-query
  - liboliphaunt-native-bindings
  - oliphaunt-query-ts
  - oliphaunt-swift
  - oliphaunt-wasix-rust
  - oliphaunt-wasix-ts
  - oliphaunt-wasix-tools-ts
  - oliphaunt-wasix-napi
project:
  title: Release Tools
  description: "Release-please identity, product-local metadata, packaging gates, and release workflow helpers."
  owner: oliphaunt
owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*":
      - "@oliphaunt/core"
fileGroups:
  source:
    - "*.{mts,sh}"
    - "!*.test.mts"
tasks:
  metadata:
    tags:
      - policy
      - assertion
      - quality
      - static
    command: bash tools/release/release-metadata-check.sh
    inputs:
      - /tools/packaging/**/*
      - /database-resources/contracts/**/*
      - /tools/release/**/*
      - /.moon/workspace.yml
      - /.moon/toolchains.yml
      - /.github/workflows/ci.yml
      - /.github/workflows/release.yml
      - /.release-please-manifest.json
      - /benchmarks/moon.yml
      - /Cargo.lock
      - /Cargo.toml
      - /examples/moon.yml
      - /examples/**/Cargo.toml
      - /moon.yml
      - /Package.swift
      - "@group(bun-workspace)"
      - /release-please-config.json
      - /**/CHANGELOG.md
      - /**/Cargo.toml
      - /**/LIBOLIPHAUNT_VERSION
      - /**/Package.swift
      - /**/VERSION
      - /**/gradle.properties
      - /**/moon.yml
      - /**/package.json
      - /**/release.toml
      - /**/targets/**/*.toml
      - /extensions/catalog/**/*
      - /extensions/contrib/*.toml
      - /extensions/evidence/**/*.toml
      - /extensions/external/**/recipe.toml
      - /extensions/external/**/source.toml
      - /extensions/external/**/tools/**/*
      - /extensions/external/**/upstream-license-data.json
      - /extensions/generated/**/*
      - /extensions/model/**/*
      - /extensions/schemas/**/*
      - /extensions/tools/**/*
      - /third-party/postgres/source.toml
      - "@group(upstream-licenses)"
      - /sdks/ts-wasix/node-addon/tools/build-native.sh
      - project: shared-test-fixtures
        group: fixtures
      - /third-party/**/source.toml
      - /runtimes/*/sources/*.toml
      - /runtimes/*/toolchain.toml
      - /tools/dev/*.toml
      - /tools/release/npm-publisher.toml
      - /tools/**/moon.yml
      - /tools/ci/**/*
      - "**/*"
      - "!/tools/release/**/*.test.{mjs,mts}"
      - "!/tools/release/**/*.md"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: true
  test:
    tags:
      - quality
      - unit
      - requires-rust
    command: bash tools/release/release-check.sh --mutation-tests-only
    inputs:
      - /runtimes/liboliphaunt-wasix/tools/download-assets.sh
      - /runtimes/liboliphaunt-wasix/tools/wasix-cargo-artifact-contract.mts
      - /tools/packaging/**/*
      - /database-resources/contracts/**/*
      - /tools/release/**/*
      - /.github/scripts/bootstrap-registry-*
      - /.github/scripts/download-bootstrap-*
      - /.github/scripts/download-completed-bootstrap*
      - /.github/scripts/download-build-artifacts*
      - /.github/scripts/download-wasix-runtime-*
      - /.github/scripts/manage-release-*
      - /.github/scripts/merge-checksum-*
      - /.github/scripts/normalize-release-*
      - /.github/scripts/registry-bootstrap-*
      - "/.github/scripts/*release*.{mts,sh}"
      - /.github/scripts/require-workflow-success*
      - /.github/scripts/workflow-run-metadata.mts
      - /.github/scripts/setup-native-build-tools*
      - /.github/scripts/verify-github-oidc-*
      - /tools/ci/with-projects.sh
      - /.prototools
      - /tools/dev/bun.sh
      - /sdks/kotlin/tools/kotlin-maven-staging.mts
      - "**/*"
      - "!/tools/release/**/*.md"
    options:
      cache: false
      runFromWorkspaceRoot: true
  graph-unit:
    tags:
      - quality
      - unit
    inputs:
      - /.moon/tasks/**/*
      - /.moon/toolchains.yml
      - /.moon/workspace.yml
      - /benchmarks/moon.yml
      - /examples/moon.yml
      - /moon.yml
      - /.release-please-manifest.json
      - /Cargo.toml
      - /Package.swift
      - /package.json
      - /release-please-config.json
      - /**/release.toml
      - /**/targets/**/*.toml
      - /**/moon.yml
      - /tools/ci/**/*
      - /tools/**/moon.yml
      - /third-party/tools/source-fetch-core.mts
      - /tools/release/artifact-target-matrix.mts
      - /extensions/artifacts/packages/tools/contrib-carriers.mts
      - /extensions/tools/extension-artifact-archive-policy.mts
      - project: extension-runtime-contract
        group: contract
      - /extensions/artifacts/packages/tools/extension-artifact-inventory.mts
      - /extensions/artifacts/packages/tools/extension-registry-packages.mts
      - /extensions/contracts/extension-target-profiles.mts
      - /extensions/tools/extension-upstream-licenses.mts
      - /extensions/artifacts/native/tools/native-extension-asset-index-contract.mts
      - /runtimes/liboliphaunt-native/tools/native-runtime-payload.mts
      - /tools/release/platform-compatibility-policy.mts
      - /tools/release/release-artifact-targets.mts
      - /tools/release/prepare-release-candidate.mts
      - /tools/release/prepare-release-candidate.test.mts
      - "@group(release-archive-contract)"
      - /tools/release/release-graph.mts
      - /runtimes/liboliphaunt-wasix/tools/wasix-cargo-artifact-contract.mts
      - /tools/packaging/windows-vc-runtime-closure.mts
      - package.json
      - /bun.lock
    options:
      cache: true
      runFromWorkspaceRoot: true
    command: bash tools/ci/with-projects.sh test --timeout=30000 ./tools/release/prepare-release-candidate.test.mts
  check:
    tags:
      - policy
      - aggregate
      - quality
    deps:
      - release-tools:metadata
      - release-tools:test
      - release-tools:graph-unit
    inputs:
      []
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
