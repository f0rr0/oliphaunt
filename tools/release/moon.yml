$schema: https://moonrepo.dev/schemas/project.json
id: release-tools
language: typescript
layer: tool
stack: infrastructure
tags:
  - javascript-quality
  - tools
  - release
dependsOn:
  - id: shared-test-fixtures
    scope: development
  - id: extension-runtime-contract
    scope: build
  - id: extensions
    scope: build
  - id: extension-artifacts-wasix
    scope: build
  - id: extension-artifacts-native
    scope: build
  - id: liboliphaunt-native
    scope: build
  - id: liboliphaunt-wasix
    scope: build
  - oliphaunt-broker
  - oliphaunt-js
  - oliphaunt-kotlin
  - oliphaunt-node-direct
  - oliphaunt-react-native
  - oliphaunt-rust
  - oliphaunt-query
  - liboliphaunt-native-bindings
  - oliphaunt-query-ts
  - oliphaunt-swift
  - oliphaunt-wasix-rust
  - oliphaunt-wasix-ts
  - oliphaunt-wasix-tools-ts
  - oliphaunt-wasix-napi
project:
  title: Release Tools
  description: "Release-please identity, product-local metadata, packaging gates, and release workflow helpers."
  owner: oliphaunt
owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*":
      - "@oliphaunt/core"
fileGroups:
  source:
    - "*.{mts,sh}"
    - "!*.test.mts"
tasks:
  metadata:
    tags:
      - policy
      - assertion
      - quality
      - static
    command: bash tools/release/release-metadata-check.sh
    inputs:
      - /tools/packaging/**/*
      - /src/database-resources/contracts/**/*
      - /tools/release/**/*
      - /.moon/workspace.yml
      - /.moon/toolchains.yml
      - /.github/workflows/ci.yml
      - /.github/workflows/release.yml
      - /.release-please-manifest.json
      - /src/benchmarks/moon.yml
      - /Cargo.lock
      - /Cargo.toml
      - /src/examples/moon.yml
      - /src/examples/**/Cargo.toml
      - /moon.yml
      - /Package.swift
      - "@group(bun-workspace)"
      - /release-please-config.json
      - /**/CHANGELOG.md
      - /**/Cargo.toml
      - /**/LIBOLIPHAUNT_VERSION
      - /**/Package.swift
      - /**/VERSION
      - /**/gradle.properties
      - /**/moon.yml
      - /**/package.json
      - /**/release.toml
      - /**/targets/**/*.toml
      - /src/extensions/catalog/**/*
      - /src/extensions/contrib/*.toml
      - /src/extensions/evidence/**/*.toml
      - /src/extensions/external/**/recipe.toml
      - /src/extensions/external/**/source.toml
      - /src/extensions/external/**/tools/**/*
      - /src/extensions/external/**/upstream-license-data.json
      - /src/extensions/generated/**/*
      - /src/extensions/model/**/*
      - /src/extensions/schemas/**/*
      - /src/extensions/tools/**/*
      - /src/third-party/postgres/source.toml
      - "@group(upstream-licenses)"
      - /src/wasix/node-addon/tools/build-native.sh
      - project: shared-test-fixtures
        group: fixtures
      - /src/third-party/**/source.toml
      - /src/{native,wasix}/*/sources/*.toml
      - /src/{native,wasix}/*/toolchain.toml
      - /tools/dev/*.toml
      - /tools/release/npm-publisher.toml
      - /tools/**/moon.yml
      - /tools/ci/**/*
      - "**/*"
      - "!/tools/release/**/*.test.{mjs,mts}"
      - "!/tools/release/**/*.md"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: true
  test:
    tags:
      - quality
      - unit
      - requires-rust
    command: bash tools/release/release-check.sh --mutation-tests-only
    inputs:
      - /src/**/tools/frozen-*.mts
      - /src/wasix/sdks/ts/tools/browser-cdp.mts
      - /src/native/runtime/smoke/frozen-consumer.c
      - /.github/workflows/release.yml
      - /src/wasix/sdks/ts/package.json
      - /src/wasix/sdks/ts/tools/wasix-typescript-package.mts
      - /src/wasix/sdks/ts/tools/package.mts
      - /src/wasix/postgres-tools/ts/tools/package.mts
      - /src/wasix/postgres-tools/ts/tools/wasix-tools-typescript-package.mts
      - /src/wasix/runtime/tools/download-assets.sh
      - /src/wasix/runtime/tools/wasix-cargo-artifact-contract.mts
      - /tools/packaging/**/*
      - /src/database-resources/contracts/**/*
      - /tools/release/**/*
      - /.github/scripts/bootstrap-registry-*
      - /.github/scripts/download-bootstrap-*
      - /.github/scripts/download-completed-bootstrap*
      - /.github/scripts/download-build-artifacts*
      - /.github/scripts/download-wasix-runtime-*
      - /.github/scripts/manage-release-*
      - /.github/scripts/merge-checksum-*
      - /.github/scripts/normalize-release-*
      - /.github/scripts/registry-bootstrap-*
      - "/.github/scripts/*release*.{mts,sh}"
      - /.github/scripts/require-workflow-success*
      - /.github/scripts/workflow-run-metadata.mts
      - /.github/scripts/setup-native-build-tools*
      - /.github/scripts/verify-github-oidc-*
      - /tools/ci/with-projects.sh
      - /.prototools
      - /tools/dev/bun.sh
      - /src/native/sdks/kotlin/tools/kotlin-maven-staging.mts
      - "**/*"
      - "!/tools/release/**/*.md"
    options:
      cache: false
      runFromWorkspaceRoot: true
  version-pins-unit:
    tags:
      - quality
      - unit
    command: bash tools/release/independent-version-pins.test.sh
    inputs:
      - /Cargo.toml
      - /Cargo.lock
      - "@group(package-test-metadata)"
      - "@group(release-target-contract)"
      - "@group(legal-files)"
      - "@group(upstream-licenses)"
      - /src/extensions/tools/extension-upstream-licenses.mts
      - /src/extensions/external/**/upstream-license-data.json
      - /tools/release/**/*
      - /tools/packaging/**/*
      - /src/native/sdks/rust/tools/prepare-rust-release-source.mts
      - /src/wasix/sdks/rust/tools/prepare-rust-release-source.mts
      - /src/wasix/sdks/ts/tools/package.mts
      - /src/wasix/sdks/ts/tools/wasix-typescript-package.mts
      - /src/wasix/sdks/ts/tools/integration/packed-node-fixture.mts
      - /src/wasix/postgres-tools/ts/tools/package.mts
      - /src/wasix/postgres-tools/ts/tools/wasix-tools-typescript-package.mts
      - /src/wasix/node-addon/tools/workspace-runtime-contract.mts
      - /src/wasix/node-addon/tools/native-build-data.mts
      - /src/wasix/node-addon/tools/check-release-assets.mts
      - /tools/ci/with-projects.sh
      - /tools/dev/bun.sh
    options:
      cache: true
      runFromWorkspaceRoot: true
  graph-unit:
    tags:
      - quality
      - unit
      - requires-rust
    inputs:
      - "@group(package-test-metadata)"
      - /.moon/tasks/**/*
      - /.moon/toolchains.yml
      - /.moon/workspace.yml
      - /src/benchmarks/moon.yml
      - /src/examples/moon.yml
      - /moon.yml
      - /.release-please-manifest.json
      - /Cargo.toml
      - /Cargo.lock
      - /rust-toolchain.toml
      - /**/Cargo.toml
      - /src/**/*.rs
      - /Package.swift
      - /package.json
      - /release-please-config.json
      - /**/release.toml
      - /**/targets/**/*.toml
      - /**/moon.yml
      - /tools/ci/**/*
      - /tools/**/moon.yml
      - /src/third-party/tools/source-fetch-core.mts
      - /tools/release/artifact-target-matrix.mts
      - /src/extensions/artifacts/packages/tools/contrib-carriers.mts
      - /src/extensions/tools/extension-artifact-archive-policy.mts
      - project: extension-runtime-contract
        group: contract
      - /src/extensions/artifacts/packages/tools/extension-artifact-inventory.mts
      - /src/extensions/artifacts/packages/tools/extension-registry-packages.mts
      - /src/extensions/contracts/extension-target-profiles.mts
      - /src/extensions/tools/extension-upstream-licenses.mts
      - /src/extensions/artifacts/native/tools/native-extension-asset-index-contract.mts
      - /src/native/runtime/tools/native-runtime-payload.mts
      - /tools/release/platform-compatibility-policy.mts
      - /tools/release/release-artifact-targets.mts
      - /tools/release/prepare-release-candidate.mts
      - /tools/release/prepare-release-candidate.test.mts
      - /tools/release/close-release-candidate.sh
      - /tools/release/sync-release-pr.{mts,sh}
      - /tools/release/release-metadata-check.sh
      - /tools/release/check_artifact_targets.mts
      - /tools/release/check-release-metadata.mts
      - /tools/release/check_release_please_config.mts
      - /tools/release/verify-release-commit.mts
      - /tools/release/release-please-state.sh
      - /tools/release/with-{product,release}-history.sh
      - /tools/release/release-dependency-plan.mts
      - /tools/release/frozen-consumer.mts
      - /tools/release/frozen-extension-consumer.mts
      - /tools/release/publication-catalog.mts
      - /tools/release/publication-consumer-proof.mts
      - /tools/release/consumer-compatibility.mts
      - /tools/release/default-extension-release-plan.mts
      - /tools/release/testdata/extension-release-fixture.mts
      - "@group(release-archive-contract)"
      - /tools/release/release-graph.mts
      - /src/wasix/runtime/tools/wasix-cargo-artifact-contract.mts
      - /tools/packaging/windows-vc-runtime-closure.mts
      - package.json
      - /bun.lock
    options:
      cache: true
      runFromWorkspaceRoot: true
    command: bash tools/ci/with-projects.sh test ./tools/release/prepare-release-candidate.test.mts
  check:
    tags:
      - policy
      - aggregate
      - quality
    deps:
      - release-tools:metadata
      - release-tools:test
      - release-tools:graph-unit
      - release-tools:version-pins-unit
    inputs:
      []
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
