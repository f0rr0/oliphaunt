$schema: "https://moonrepo.dev/schemas/project.json"

id: "test-tools"
language: "typescript"
layer: "tool"
stack: "infrastructure"
tags: ["javascript-quality", "tools", "testing", "repo-hygiene"]

project:
  title: "Test Tools"
  description: "Fixture builders used by repository integration tests."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  check:
    tags: ["quality", "static"]
    command: "bun build tools/test/create-liboliphaunt-release-fixture.mts tools/test/create-broker-release-fixture.mts --target=bun --outdir target"
    inputs:
      - "**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
