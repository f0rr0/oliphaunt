$schema: "https://moonrepo.dev/schemas/project.json"

id: "perf-tools"
language: "rust"
layer: "tool"
stack: "systems"
tags: ["tools", "performance", "bench"]
dependsOn:
  - id: "benchmarks"
    scope: "build"

project:
  title: "Performance Tools"
  description: "Native, WASM, mobile, and SQLite benchmark orchestration and reporting."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/perf"
  paths:
    "**/*": ["@oliphaunt/perf"]

tasks:
  rust-api-model-check:
    tags: ["bench", "diagnostic", "quality", "requires-rust"]
    command: "bash tools/perf/rust-api-model/check.sh"
    inputs:
      - "@group(cargo-workspace)"
      - "/src/sdks/rust/**/*"
      - "/src/bindings/wasix-rust/**/*"
      - "/src/runtimes/liboliphaunt/wasix/crates/**/*"
      - "/src/shared/rust-query-core/**/*"
      - "/tools/dev/bun.sh"
      - "/tools/perf/runner/**/*"
      - "/tools/perf/rust-api-model/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true

  unit:
    tags: ["quality", "unit"]
    command: "bash tools/perf/check-native-perf-harness.sh"
    deps:
      - "perf-tools:rust-api-model-check"
    inputs:
      - "@group(cargo-workspace)"
      - "/src/runtimes/liboliphaunt/native/**/*"
      - "/src/sdks/rust/**/*"
      - "/src/bindings/wasix-rust/**/*"
      - "/src/postgres/versions/18/**/*"
      - "/src/sources/toolchains/**/*"
      - "/src/sources/third-party/**/*"
      - "/src/extensions/**/*"
      - "**/*"
      - project: "benchmarks"
    options:
      cache: true
      runFromWorkspaceRoot: true
  rust-api-model-native:
    tags: ["bench", "diagnostic", "measured", "requires-rust"]
    command: "bash tools/perf/rust-api-model/run.sh --runtime native"
    deps:
      - "liboliphaunt-native:release-runtime"
    inputs:
      - "@group(cargo-workspace)"
      - "/src/runtimes/liboliphaunt/native/**/*"
      - "/src/shared/rust-query-core/**/*"
      - "/src/sdks/rust/**/*"
      - "/tools/perf/runner/**/*"
      - "/tools/perf/rust-api-model/**/*"
      - "/tools/runtime/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  rust-api-model-wasix:
    tags: ["bench", "diagnostic", "measured", "requires-rust"]
    command: "bash tools/perf/rust-api-model/run.sh --runtime wasix"
    deps:
      - "liboliphaunt-wasix:runtime-aot"
    inputs:
      - "@group(cargo-workspace)"
      - "/src/bindings/wasix-rust/**/*"
      - "/src/runtimes/liboliphaunt/wasix/crates/**/*"
      - "/src/shared/rust-query-core/**/*"
      - "/tools/perf/runner/**/*"
      - "/tools/perf/rust-api-model/**/*"
      - "/tools/runtime/**/*"
      - "/tools/xtask/**/*"
      - "/target/oliphaunt-wasix/assets/**/*"
      - "/target/oliphaunt-wasix/aot/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  bench:
    tags: ["bench", "plan"]
    command: "bash tools/perf/matrix/run_native_oliphaunt_matrix.sh --plan-only"
    inputs:
      - "@group(cargo-workspace)"
      - "/src/runtimes/liboliphaunt/native/**/*"
      - "/src/sdks/rust/**/*"
      - "/src/bindings/wasix-rust/**/*"
      - "/src/postgres/versions/18/**/*"
      - "/src/sources/toolchains/**/*"
      - "/src/sources/third-party/**/*"
      - "/src/extensions/**/*"
      - "**/*"
      - project: "benchmarks"
    options:
      cache: true
      runFromWorkspaceRoot: true
      runInCI: false
