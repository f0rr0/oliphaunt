$schema: "https://moonrepo.dev/schemas/project.json"

id: "xtask"
language: "rust"
layer: "tool"
stack: "systems"
tags: ["tools", "rust", "xtask", "wasix"]

project:
  title: "WASIX and Extension Asset Tooling"
  description: "Rust checks and generators shared by WASIX runtime and extension assets."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/wasix"
  paths:
    "**/*.rs": ["@oliphaunt/wasix"]
    "Cargo.toml": ["@oliphaunt/wasix"]

tasks:
  unit:
    tags: ["quality", "unit", "requires-rust"]
    command: "cargo test -p xtask --locked"
    env:
      CARGO_TARGET_DIR: "target/moon/xtask/unit"
    inputs:
      - "@group(cargo-workspace)"
      - "**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  cluster-seed-compile:
    tags: ["quality", "static", "wasix"]
    command: "cargo check -p xtask --features cluster-seed-runner --locked"
    env:
      CARGO_TARGET_DIR: "target/moon/xtask/cluster-seed-compile"
    inputs:
      - "@group(cargo-workspace)"
      - "**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
      runInCI: skip
  aot-serializer-compile:
    tags: ["quality", "static", "requires-rust"]
    command: "cargo check -p xtask --features aot-serializer --locked"
    env:
      CARGO_TARGET_DIR: "target/moon/xtask/aot-serializer-compile"
    inputs:
      - "@group(cargo-workspace)"
      - "**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
