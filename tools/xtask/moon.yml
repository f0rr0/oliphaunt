$schema: "https://moonrepo.dev/schemas/project.json"

id: "xtask"
language: "rust"
layer: "tool"
stack: "systems"
tags: ["tools", "rust", "xtask", "wasix"]

project:
  title: "xtask"
  description: "Rust helper binary for WASIX assets, release staging, and source-policy checks."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/wasix"
  paths:
    "**/*.rs": ["@oliphaunt/wasix"]
    "Cargo.toml": ["@oliphaunt/wasix"]

tasks:
  unit:
    tags: ["quality", "unit", "ci-rust"]
    command: "cargo test -p xtask --locked"
    env:
      CARGO_TARGET_DIR: "target/moon/xtask/unit"
    inputs:
      - "/Cargo.lock"
      - "/Cargo.toml"
      - "/rust-toolchain.toml"
      - "/tools/xtask/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  cluster-seed-runner-check:
    tags: ["quality", "static", "wasix"]
    command: "cargo check -p xtask --features cluster-seed-runner --locked"
    env:
      CARGO_TARGET_DIR: "target/moon/xtask/cluster-seed-runner-check"
    inputs:
      - "/Cargo.lock"
      - "/Cargo.toml"
      - "/rust-toolchain.toml"
      - "/tools/xtask/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
      runInCI: skip
  compile-aot-serializer:
    tags: ["quality", "static", "ci-rust"]
    command: "cargo check -p xtask --features aot-serializer --locked"
    env:
      CARGO_TARGET_DIR: "target/moon/xtask/compile-aot-serializer"
    inputs:
      - "/Cargo.lock"
      - "/Cargo.toml"
      - "/rust-toolchain.toml"
      - "/tools/xtask/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
