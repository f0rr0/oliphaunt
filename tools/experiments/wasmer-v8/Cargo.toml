[package]
name = "oliphaunt-wasmer-v8-probe"
version = "0.0.0"
edition = "2024"
publish = false

# Keep research dependencies and compiler selection out of product packages.
[workspace]

[dependencies]
anyhow = "1"
wasmer = { version = "=7.5.0", default-features = false, features = ["v8", "wat"] }
wasmer-wasix = { version = "=0.705.0", optional = true, default-features = false, features = ["sys-default", "v8"] }
tokio = { version = "1", optional = true, features = ["rt-multi-thread"] }

[features]
wasix = ["dep:wasmer-wasix", "dep:tokio"]

[profile.release]
debug = 1
