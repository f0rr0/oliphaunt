# Product SDK taxonomy.
#
# This file is intentionally small and reviewed with SDK changes. It is the
# repo-level registry for SDK ownership, target platforms, and delegation rules.
# `sdk-contracts:check` parses this schema and cross-checks release identities;
# product tasks own behavior and package proof.
# `calling_contract` records synchronous versus language-level asynchronous
# completion. `execution_owner` independently records where an admitted public
# SDK operation executes until it completes; it does not describe internal
# PostgreSQL child processes or server listener loops. `main_safe` states
# whether the surface may monopolize a main/UI/event-loop thread. A
# Promise-shaped caller-owned surface is therefore representable.

schema_version = 6

[sdks.rust]
package_identity = "cargo:oliphaunt"
implementation_path = "src/sdks/rust"
documentation_path = "src/docs/content/sdk/rust"
consumer_targets = ["tauri", "rust-desktop"]
runtime_owner = true
runtime_boundary = "oliphaunt"

[[sdks.rust.surfaces]]
id = "default"
entrypoint = "oliphaunt"
calling_contract = "sync"
execution_owner = "caller"
main_safe = false
topologies = ["native-direct", "native-broker", "native-server"]

[[sdks.rust.surfaces]]
id = "async"
entrypoint = "oliphaunt::AsyncOliphaunt"
calling_contract = "async"
execution_owner = "sdk-thread"
main_safe = true
topologies = ["native-direct", "native-broker", "native-server"]

[sdks.wasix-rust]
package_identity = "cargo:oliphaunt-wasix"
implementation_path = "src/bindings/wasix-rust/crates/oliphaunt-wasix"
documentation_path = "src/docs/content/sdk/wasix-rust"
consumer_targets = ["tauri", "rust-desktop"]
runtime_owner = true
runtime_boundary = "oliphaunt-wasix"

[[sdks.wasix-rust.surfaces]]
id = "default"
entrypoint = "oliphaunt_wasix"
calling_contract = "sync"
execution_owner = "caller"
main_safe = false
topologies = ["wasix-direct", "wasix-server"]

[[sdks.wasix-rust.surfaces]]
id = "async"
entrypoint = "oliphaunt_wasix::AsyncOliphaunt"
calling_contract = "async"
execution_owner = "sdk-thread"
main_safe = true
topologies = ["wasix-direct", "wasix-server"]

[sdks.wasix-typescript]
package_identity = "npm:@oliphaunt/wasix-ts"
implementation_path = "src/bindings/wasix-ts"
documentation_path = "src/docs/content/sdk/wasix-typescript"
consumer_targets = ["browser", "node", "bun", "deno"]
runtime_owner = true
runtime_boundary = "@oliphaunt/wasix-ts"

[[sdks.wasix-typescript.surfaces]]
id = "default"
entrypoint = "@oliphaunt/wasix-ts"
calling_contract = "async"
execution_owner = "caller"
main_safe = false
topologies = ["wasix-direct"]

[[sdks.wasix-typescript.surfaces]]
id = "worker"
entrypoint = "@oliphaunt/wasix-ts/worker"
calling_contract = "async"
execution_owner = "sdk-worker"
main_safe = true
topologies = ["wasix-direct"]

[[sdks.wasix-typescript.surfaces]]
id = "server-node"
entrypoint = "@oliphaunt/wasix-ts/server/node"
calling_contract = "async"
execution_owner = "sdk-worker"
main_safe = true
topologies = ["wasix-server"]

[[sdks.wasix-typescript.surfaces]]
id = "server-bun"
entrypoint = "@oliphaunt/wasix-ts/server/bun"
calling_contract = "async"
execution_owner = "sdk-worker"
main_safe = true
topologies = ["wasix-server"]

[[sdks.wasix-typescript.surfaces]]
id = "server-deno"
entrypoint = "@oliphaunt/wasix-ts/server/deno"
calling_contract = "async"
execution_owner = "sdk-worker"
main_safe = true
topologies = ["wasix-server"]

[sdks.swift]
package_identity = "swiftpm:Oliphaunt"
implementation_path = "src/sdks/swift"
documentation_path = "src/docs/content/sdk/swift"
consumer_targets = ["ios", "macos"]
runtime_owner = true
runtime_boundary = "Oliphaunt"

[[sdks.swift.surfaces]]
id = "default"
entrypoint = "Oliphaunt"
calling_contract = "async"
execution_owner = "sdk-thread"
main_safe = true
topologies = ["native-direct"]

[sdks.kotlin]
package_identity = "maven:dev.oliphaunt:oliphaunt-android"
implementation_path = "src/sdks/kotlin"
documentation_path = "src/docs/content/sdk/kotlin"
consumer_targets = ["android"]
runtime_owner = true
runtime_boundary = "Oliphaunt"

[[sdks.kotlin.surfaces]]
id = "default"
entrypoint = "Oliphaunt"
calling_contract = "async"
execution_owner = "sdk-thread"
main_safe = true
topologies = ["native-direct"]

[sdks.react-native]
package_identity = "npm:@oliphaunt/react-native"
implementation_path = "src/sdks/react-native"
documentation_path = "src/docs/content/sdk/react-native"
consumer_targets = ["react-native-ios", "react-native-android"]
runtime_owner = false
runtime_boundary = "TurboModule adapter"
delegates_apple_to = "swift"
delegates_android_to = "kotlin"

[[sdks.react-native.surfaces]]
id = "default"
entrypoint = "@oliphaunt/react-native"
calling_contract = "async"
execution_owner = "platform-sdk"
main_safe = true
topologies = ["native-direct"]

[sdks.typescript]
package_identity = "npm:@oliphaunt/ts"
implementation_path = "src/sdks/js"
documentation_path = "src/docs/content/sdk/typescript"
consumer_targets = ["node", "bun", "deno"]
runtime_owner = true
runtime_boundary = "@oliphaunt/ts"

[[sdks.typescript.surfaces]]
id = "default"
entrypoint = "@oliphaunt/ts"
calling_contract = "async"
execution_owner = "sdk-runtime"
main_safe = true
topologies = ["native-direct", "native-broker", "native-server"]
