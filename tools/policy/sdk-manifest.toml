# Product SDK taxonomy.
#
# This file is intentionally small and reviewed with SDK changes. It is the
# repo-level registry for SDK ownership, target platforms, and delegation rules.
# `sdk-contracts:check` parses this schema and cross-checks release identities;
# product tasks own behavior and package proof.

schema_version = 4

[sdks.rust]
package_identity = "cargo:oliphaunt"
implementation_path = "src/sdks/rust"
documentation_path = "src/docs/content/sdk/rust"
consumer_targets = ["tauri", "rust-desktop"]
runtime_owner = true
runtime_boundary = "oliphaunt"
execution_modes = ["native-direct", "native-broker", "native-server"]

[sdks.wasix-rust]
package_identity = "cargo:oliphaunt-wasix"
implementation_path = "src/bindings/wasix-rust/crates/oliphaunt-wasix"
documentation_path = "src/docs/content/sdk/wasix-rust"
consumer_targets = ["tauri", "rust-desktop"]
runtime_owner = true
runtime_boundary = "oliphaunt-wasix"
execution_modes = ["wasix-direct", "wasix-server"]

[sdks.wasix-typescript]
package_identity = "npm:@oliphaunt/wasix-ts"
implementation_path = "src/bindings/wasix-ts"
documentation_path = "src/docs/content/sdk/wasix-typescript"
consumer_targets = ["browser", "node", "bun", "deno"]
runtime_owner = true
runtime_boundary = "@oliphaunt/wasix-ts"
execution_modes = ["wasix-direct", "wasix-worker", "wasix-server"]

[sdks.swift]
package_identity = "swiftpm:Oliphaunt"
implementation_path = "src/sdks/swift"
documentation_path = "src/docs/content/sdk/swift"
consumer_targets = ["ios", "macos"]
runtime_owner = true
runtime_boundary = "Oliphaunt"
execution_modes = ["native-direct"]

[sdks.kotlin]
package_identity = "maven:dev.oliphaunt:oliphaunt-android"
implementation_path = "src/sdks/kotlin"
documentation_path = "src/docs/content/sdk/kotlin"
consumer_targets = ["android"]
runtime_owner = true
runtime_boundary = "Oliphaunt"
execution_modes = ["native-direct"]

[sdks.react-native]
package_identity = "npm:@oliphaunt/react-native"
implementation_path = "src/sdks/react-native"
documentation_path = "src/docs/content/sdk/react-native"
consumer_targets = ["react-native-ios", "react-native-android"]
runtime_owner = false
runtime_boundary = "TurboModule adapter"
delegates_apple_to = "swift"
delegates_android_to = "kotlin"
execution_modes = ["native-direct"]

[sdks.typescript]
package_identity = "npm:@oliphaunt/ts"
implementation_path = "src/sdks/js"
documentation_path = "src/docs/content/sdk/typescript"
consumer_targets = ["node", "bun", "deno"]
runtime_owner = true
runtime_boundary = "@oliphaunt/ts"
execution_modes = ["native-direct", "native-broker", "native-server"]
