$schema: "https://moonrepo.dev/schemas/project.json"

id: "policy-tools"
language: "javascript"
layer: "tool"
stack: "infrastructure"
tags: ["tools", "policy", "repo-hygiene"]

project:
  title: "Policy Checks"
  description: "Cross-product repository policy, product graph, SDK parity, and package-boundary checks."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  fmt:
    tags: ["format"]
    command: "bash tools/policy/format.sh --write"
    inputs:
      - "@group(cargo-workspace)"
      - "@group(js-quality)"
    options:
      cache: false
      runFromWorkspaceRoot: true
  js-format-check:
    tags: ["format", "quality", "static"]
    command: "bash tools/policy/format.sh --check-js"
    inputs:
      - "@group(js-quality)"
    options:
      cache: true
      runFromWorkspaceRoot: true
  js-lint:
    tags: ["quality", "static"]
    command: "bash tools/policy/format.sh --lint-js"
    inputs:
      - "@group(js-quality)"
    options:
      cache: true
      runFromWorkspaceRoot: true
  rust-format-check:
    tags: ["format", "quality", "static", "requires-rust"]
    command: "cargo fmt --check"
    inputs:
      - "@group(cargo-workspace)"
      - "/src/**/Cargo.toml"
      - "/src/**/*.rs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  rust-lint:
    tags: ["quality", "static", "requires-rust"]
    command: "tools/dev/bun.sh tools/policy/check-rust-lint.mjs"
    env:
      CARGO_TARGET_DIR: "target/moon/cargo-quality"
    inputs:
      - "@group(cargo-workspace)"
      - "/clippy.toml"
      - "/src/**/Cargo.toml"
      - "/src/**/*.rs"
      - "/tools/**/Cargo.toml"
      - "/tools/**/*.rs"
      - "/tools/policy/check-rust-lint.mjs"
      - "/tools/policy/check-dependency-invariants.sh"
    options:
      cache: true
      runFromWorkspaceRoot: true
  tools-compile:
    tags: ["policy", "assertion", "quality", "static"]
    command: "bash tools/policy/check-policy-tools.sh"
    inputs:
      - "/.github/scripts/**/*.mjs"
      - "/examples/tools/**/*.mjs"
      - "/src/runtimes/liboliphaunt/native/tools/build-ci-target.mjs"
      - "/tools/graph/**/*"
      - "**/*"
      - "/tools/dev/capture-command-output.mjs"
      - "/tools/dev/moon-command.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  unit:
    tags: ["quality", "unit"]
    command: "tools/dev/bun.sh tools/release/release-check.mjs --mutation-tests-only --mutation-scope=policy"
    inputs:
      - "/.gitattributes"
      - "/.github/scripts/check-ci-gate.mjs"
      - "/.github/scripts/check-release-intent.sh"
      - "/.github/scripts/resolve-mobile-e2e.mjs"
      - "/.github/scripts/resolve-mobile-e2e.test.mjs"
      - "/.github/scripts/validate-release-workflow-inputs.sh"
      - "/src/extensions/generated/**/*"
      - "/src/runtimes/liboliphaunt/wasix/assets/build/docker/pinned-wasixcc-assets.tsv"
      - "/src/sdks/react-native/tools/**/*"
      - "/src/sources/**/*"
      - "!/src/sources/tools/**/*.test.*"
      - "/tools/dev/bun.sh"
      - "/tools/dev/capture-command-output.mjs"
      - "/tools/dev/moon-command.mjs"
      - "**/*"
      - "!/tools/policy/check-policy-tools.sh"
      - "!/tools/policy/format.sh"
      - "/tools/release/release-check.mjs"
      - "/tools/release/release-cli-utils.mjs"
      - "/tools/test/isolated-github-test-environment.mjs"
      - "/tools/test/fd-backed-spawn-sync.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
