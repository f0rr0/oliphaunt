$schema: "https://moonrepo.dev/schemas/project.json"

id: "policy-tools"
language: "typescript"
layer: "tool"
stack: "infrastructure"
tags: ["javascript-quality", "tools", "policy", "repo-hygiene"]

project:
  title: "Policy Checks"
  description: "Cross-product repository policy, product graph, SDK parity, and package-boundary checks."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  tools-compile:
    tags: ["policy", "assertion", "quality", "static"]
    command: "bash tools/policy/check-policy-tools.sh"
    inputs:
      - "/.github/scripts/**/*.{mjs,mts}"
      - "/examples/tools/**/*.{mjs,mts}"
      - "/tools/graph/**/*"
      - "**/*"
      - "/tools/test/moon-command.mts"
    options:
      cache: true
      runFromWorkspaceRoot: true
  unit:
    tags: ["quality", "unit"]
    command: "bash tools/release/release-check.sh --mutation-tests-only --mutation-scope=policy"
    inputs:
      - "/.gitattributes"
      - "/.github/scripts/check-ci-gate.mts"
      - "/.github/scripts/check-release-intent.sh"
      - "/.github/scripts/release-intent-data.mts"
      - "/.github/scripts/resolve-mobile-e2e.mts"
      - "/.github/scripts/resolve-mobile-e2e.test.mts"
      - "/.github/scripts/validate-release-workflow-inputs.sh"
      - "/src/extensions/generated/**/*"
      - "/src/runtimes/liboliphaunt/wasix/assets/build/docker/pinned-wasixcc-assets.tsv"
      - "/src/sdks/react-native/tools/**/*"
      - "/src/sources/**/*"
      - "!/src/sources/tools/**/*.test.*"
      - "/tools/dev/bun.sh"
      - "/tools/test/moon-command.mts"
      - "**/*"
      - "!/tools/policy/check-policy-tools.sh"
      - "/tools/release/release-check.sh"
      - "/tools/release/release-cli-utils.mts"
      - "/tools/test/isolated-github-test-environment.mts"
    options:
      cache: false
      runFromWorkspaceRoot: true
