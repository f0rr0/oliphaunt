$schema: "https://moonrepo.dev/schemas/project.json"

id: "sdk-contracts"
language: "javascript"
layer: "tool"
stack: "infrastructure"
tags: ["sdk", "contract"]

project:
  title: "SDK Contracts"
  description: "Generated API, ownership, native boundary, header, documentation-example, and extension-model contracts shared by product SDKs."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  check:
    tags: ["quality", "static"]
    command: "node tools/policy/generate-sdk-api-surface.mjs --check"
    deps:
      - "sdk-contracts:cluster-seeds"
      - "sdk-contracts:doc-examples"
      - "sdk-contracts:fixtures"
      - "sdk-contracts:headers"
      - "sdk-contracts:manifest"
      - "sdk-contracts:native-boundaries"
      - "shared-rust-query-core:check"
    inputs:
      - "/docs/maintainers/sdk-api-surface.md"
      - "/src/runtimes/liboliphaunt/native/include/oliphaunt.h"
      - "/src/sdks/js/src/**/*.ts"
      - "/src/sdks/js/package.json"
      - "/src/sdks/kotlin/oliphaunt/src/{androidMain,commonMain,jvmMain}/**/*.kt"
      - "/src/sdks/kotlin/oliphaunt-android-gradle-plugin/build.gradle.kts"
      - "/src/sdks/kotlin/oliphaunt-android-gradle-plugin/src/main/java/dev/oliphaunt/android/OliphauntAndroidExtension.java"
      - "/src/sdks/react-native/src/**/*.ts"
      - "/src/sdks/react-native/package.json"
      - "/src/sdks/rust/src/**/*.rs"
      - "/src/shared/rust-query-core/**/*"
      - "/src/sdks/rust/crates/oliphaunt-build/src/**/*.rs"
      - "/src/sdks/swift/Sources/Oliphaunt/**/*.swift"
      - "/src/sdks/swift/Sources/OliphauntExtensionSupport/**/*.swift"
      - "/src/bindings/wasix-rust/crates/oliphaunt-wasix/src/**/*.rs"
      - "/src/bindings/wasix-ts/src/**/*.ts"
      - "/src/bindings/wasix-ts/package.json"
      - "/tools/policy/generate-sdk-api-surface.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  cluster-seeds:
    tags: ["quality", "static"]
    command: "bun tools/policy/check-cluster-seed-contract.mjs"
    inputs:
      - "/src/shared/cluster-seed-contract/**/*"
      - "/tools/policy/check-cluster-seed-contract.mjs"
      - "/tools/release/native-cluster-seed-contract.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  fixtures:
    tags: ["quality", "static"]
    command: "bun tools/policy/check-shared-fixtures.mjs"
    inputs:
      - "/src/shared/fixtures/**/*"
      - "/src/**/*.{json,properties}"
      - "/tools/policy/check-shared-fixtures.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  doc-examples:
    tags: ["quality", "static"]
    command: "node tools/policy/check-sdk-doc-examples.mjs"
    inputs:
      - "/src/sdks/{js,kotlin,react-native,rust,swift}/README.md"
      - "/src/bindings/wasix-ts/README.md"
      - "/src/bindings/wasix-ts/src/__tests__/**/*"
      - "/src/sdks/js/src/__tests__/**/*"
      - "/src/sdks/kotlin/oliphaunt/src/**/*"
      - "/src/sdks/react-native/src/__tests__/**/*"
      - "/src/sdks/rust/tests/**/*"
      - "/src/bindings/wasix-rust/crates/oliphaunt-wasix/README.md"
      - "/src/bindings/wasix-rust/crates/oliphaunt-wasix/tests/**/*"
      - "/src/runtimes/liboliphaunt/native/crates/tools/src/**/*"
      - "/src/sdks/swift/Tests/**/*"
      - "/tools/policy/check-sdk-doc-examples.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  headers:
    tags: ["quality", "static"]
    command: "bun tools/policy/check-sdk-header-copies.mjs"
    inputs:
      - "/src/runtimes/liboliphaunt/native/include/oliphaunt.h"
      - "/src/sdks/kotlin/oliphaunt/src/androidMain/cpp/include/oliphaunt.h"
      - "/src/sdks/react-native/android/src/main/cpp/include/oliphaunt.h"
      - "/src/sdks/swift/Sources/COliphaunt/include/oliphaunt.h"
      - "/tools/policy/check-sdk-header-copies.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  manifest:
    tags: ["quality", "static"]
    command: "bun tools/policy/check-sdk-manifest.mjs"
    inputs:
      - "/src/bindings/wasix-rust/moon.yml"
      - "/src/bindings/wasix-ts/moon.yml"
      - "/src/bindings/wasix-ts/package.json"
      - "/src/sdks/*/moon.yml"
      - "/src/sdks/js/package.json"
      - "/src/sdks/react-native/package.json"
      - "/docs/maintainers/sdk-parity-policy.md"
      - "/tools/policy/check-sdk-manifest.mjs"
      - "/tools/policy/sdk-manifest.toml"
      - "/tools/release/release-graph.mjs"
      - "/src/**/release.toml"
    options:
      cache: true
      runFromWorkspaceRoot: true
  native-boundaries:
    tags: ["quality", "static"]
    command: "bun tools/policy/check-native-boundaries.mjs"
    inputs:
      - "/Cargo.toml"
      - "/src/bindings/wasix-rust/**/*"
      - "/src/runtimes/**/*"
      - "/src/sdks/**/*"
      - "/tools/perf/**/*"
      - "/tools/policy/check-native-boundaries.mjs"
      - "/tools/policy/check-native-boundaries.sh"
      - "/tools/xtask/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
