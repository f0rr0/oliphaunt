$schema: "https://moonrepo.dev/schemas/project.json"

id: "ci-workflows"
language: "yaml"
layer: "configuration"
stack: "infrastructure"
tags: ["javascript-quality", "ci", "github-actions", "workflows"]

project:
  title: "GitHub Actions"
  description: "GitHub workflow, action, and repository automation checks."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  verify-bash:
    command: "bash --version"
    toolchains: ["system"]
    options:
      cache: false
  llvm-install-unit:
    tags: ["quality", "unit"]
    command: "bash .github/actions/setup-wasmer-llvm/install.test.sh"
    inputs:
      - "actions/setup-wasmer-llvm/**/*"
      - "/tools/packaging/portable-archive.mts"
      - "/tools/dev/curl-platform-flags.sh"
      - "/tools/dev/acquisition.sh"
      - "/tools/packaging/testdata/tar-fixture.mts"
    options:
      cache: true
      runFromWorkspaceRoot: true
  check:
    tags: ["policy", "assertion", "quality", "static", "requires-maintainer-tools", "requires-rust"]
    command: "bash tools/ci/check-workflows.sh"
    inputs:
      - "/.moon/toolchains.yml"
      - "/.moon/tasks/**/*"
      - "/**/moon.yml"
      - "/.prototools"
      - "/rust-toolchain.toml"
      - "/Cargo.lock"
      - "/**/Cargo.toml"
      - "/.github/actions/**/*"
      - "/.github/scripts/**/*"
      - "/.github/workflows/**/*"
      - "/.github/zizmor.yml"
      - "/tools/dev/*.toml"
      - "/tools/ci/with-projects.sh"
      - "/tools/dev/bun.sh"
      - "/tools/dev/curl-platform-flags.sh"
      - "/tools/dev/acquisition.sh"
      - "/tools/ci/workflow-security.mts"
      - "/tools/ci/workflow-security.test.mts"
      - "/tools/ci/workflow-caches.test.mts"
      - "/src/wasix/postmaster/lib/common.sh"
      - "/src/wasix/postmaster/executor/Cargo.toml"
      - "/src/wasix/postmaster/executor/Cargo.lock"
      - "/src/wasix/postmaster/executor/src/**"
      - "/src/wasix/postmaster/sources/*.toml"
      - "/src/third-party/postgres/source.toml"
      - "/src/wasix/runtime/assets/build/docker/**"
      - "/tools/ci/ci-plan-node-products.test.mts"
      - "/tools/ci/ci-plan-wasix-postmaster-release.test.mts"
      - "/tools/ci/ci-plan-test-*.mts"
      - "/tools/ci/capture-ci-test-observations*.sh"
      - "/tools/ci/ci-release-scope.test.*"
      - "/tools/ci/workflow-moon-transfers.test.mts"
      - "/tools/ci/check-workflows.sh"
      - "/tools/ci/affected.mts"
      - "/tools/ci/ci_plan.mts"
      - "/tools/ci/ci-plan.sh"
      - "@group(package-test-metadata)"
      - "/tools/release/product-version.mts"
      - "/tools/release/with-product-history.sh"
      - "/src/native/sdks/ts/tools/published-consumer.mts"
      - "/src/native/sdks/ts/package.json"
      - "/src/native/sdks/swift/tools/ios-carrier-manifest.mts"
      - "/src/native/runtime/VERSION"
      - "/tools/release/check_registry_publication.mts"
      - "/tools/release/public-consumer-smoke.mts"
      - "/tools/release/release-graph.mts"
    options:
      cache: true
      runFromWorkspaceRoot: true
