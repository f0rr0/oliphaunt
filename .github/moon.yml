$schema: "https://moonrepo.dev/schemas/project.json"

id: "ci-workflows"
language: "yaml"
layer: "configuration"
stack: "infrastructure"
tags: ["javascript-quality", "ci", "github-actions", "workflows"]

project:
  title: "GitHub Actions"
  description: "GitHub workflow, action, and repository automation checks."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  llvm-install-unit:
    tags: ["quality", "unit"]
    command: "bash .github/actions/setup-wasmer-llvm/install.test.sh"
    inputs:
      - "actions/setup-wasmer-llvm/**/*"
      - "/src/shared/artifact-packaging/portable-archive.mts"
      - "/tools/dev/curl-platform-flags.sh"
      - "/tools/test/tar-fixture.mts"
    options:
      cache: true
      runFromWorkspaceRoot: true
  check:
    tags: ["policy", "assertion", "quality", "static", "requires-maintainer-tools"]
    command: "bash tools/policy/check-workflows.sh"
    inputs:
      - "/.moon/toolchains.yml"
      - "/.prototools"
      - "/.github/actions/**/*"
      - "/.github/scripts/**/*"
      - "/.github/workflows/**/*"
      - "/.github/zizmor.yml"
      - "/src/sources/toolchains/**/*"
      - "/tools/graph/with-projects.sh"
      - "/tools/dev/bun.sh"
      - "/tools/dev/curl-platform-flags.sh"
      - "/tools/test/moon-command.mts"
      - "/tools/policy/assertions/workflow-security.mts"
      - "/tools/policy/assertions/workflow-security.test.mts"
      - "/tools/policy/ci-plan-node-products.test.mts"
      - "/tools/policy/ci-plan-wasix-postmaster-release.test.mts"
      - "/tools/policy/workflow-moon-transfers.test.mts"
      - "/tools/policy/check-workflows.sh"
      - "/tools/graph/affected.mts"
      - "/tools/graph/ci_plan.mts"
      - "/tools/graph/ci-plan.sh"
      - "/src/shared/product-metadata/release-graph.mts"
    options:
      cache: true
      runFromWorkspaceRoot: true
