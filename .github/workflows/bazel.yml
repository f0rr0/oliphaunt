name: Native Bazel qualification

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: bazel-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  portable:
    name: Portable packages (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-26
          - platform: windows-x64
            runner: windows-2025-vs2026
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # Cold, credential-free requests prove tool acquisition and real packages.
      # Existing Required/Qualified publication gates remain authoritative.
      - name: Check Bazel acquisition
        run: bash tools/dev/bazel-bootstrap.test.sh

      - name: Select declared Apple SDK
        if: matrix.platform == 'macos-arm64'
        uses: ./.github/actions/setup-apple
        with:
          install-build-dependencies: "false"

      - name: Select declared MSVC SDK
        if: matrix.platform == 'windows-x64'
        uses: ./.github/actions/setup-msvc

      - name: Qualify packages and native host behavior
        timeout-minutes: 70
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          host_tests=(
            //build_defs/languages/carriers:package_test
            //build_defs/languages/carriers:installed_sql_test
          )
          case "$TARGET_PLATFORM" in
            linux-x64) profile=//build_defs/native:linux_x86_64_glibc_2_28 ;;
            linux-arm64) profile=//build_defs/native:linux_aarch64_glibc_2_28 ;;
            macos-arm64) profile=//build_defs/host:native_macos_arm64 ;;
            windows-x64) profile=//build_defs/host:native_windows_x64 ;;
          esac
          case "$TARGET_PLATFORM" in
            macos-arm64|windows-x64)
              host_tests+=(
                //build_defs/host:host_c_smoke
                //build_defs/native:compiler_probe_test
                //build_defs/native:probe_process_test
                //src/native/runtime:abi_conformance_test
                //src/native/runtime:runtime_sql_test
                //src/native/runtime:native_tools_sql_test
                //src/native/runtime:npm
                //src/native/runtime:installed_cargo_test
                //src/native/postgres-tools:cargo_facade
                //src/native/postgres-tools:installed_cargo_test
                //src/native/postgres-tools:installed_carrier_test
                //src/database-resources:native_resource_test
                //src/database-resources:native_shipping_export
              )
              ;;
          esac
          if [[ "$TARGET_PLATFORM" == windows-x64 ]]; then
            host_tests+=(@icu//:windows_icu_smoke_test)
          fi
          if [[ "$TARGET_PLATFORM" != macos-arm64 ]]; then
            startup=()
            if [[ "$TARGET_PLATFORM" == windows-x64 ]]; then
              # MSVC still limits some object paths to MAX_PATH. Keep the whole
              # job on one short base, including maintained Rust build tools.
              startup=(--output_base="$RUNNER_TEMP/b")
            fi
            bash tools/dev/bazel.sh "${startup[@]}" test //:portable_tests "${host_tests[@]}" \
              --platforms="$profile" --host_platform="$profile" --jobs=2
            exit
          fi

          diagnostic_root="$RUNNER_TEMP/native-bazel-diagnostics"
          qualifier_output_base="$RUNNER_TEMP/native-bazel"
          mkdir -p "$diagnostic_root"
          bash tools/dev/bazel.sh --output_base="$qualifier_output_base" --host_jvm_args=-Xmx3g \
            --server_jvm_out="$diagnostic_root/server-jvm.out" test \
            //:portable_tests "${host_tests[@]}" \
            --config=macos-sandbox --platforms="$profile" --host_platform="$profile" --jobs=2 \
            --profile="$diagnostic_root/qualification.json.gz" \
            --starlark_cpu_profile="$diagnostic_root/starlark.pprof" &
          qualifier_pid=$!
          (
            diagnostic_delay_pid=
            trap 'if [[ -n "$diagnostic_delay_pid" ]]; then kill "$diagnostic_delay_pid" 2>/dev/null || true; fi' EXIT
            trap 'exit 0' TERM INT
            sleep 480 &
            diagnostic_delay_pid=$!
            wait "$diagnostic_delay_pid"
            if kill -0 "$qualifier_pid" 2>/dev/null; then
              ps -axo pid,ppid,state,etime,%cpu,%mem,comm > "$diagnostic_root/processes.txt"
              java_pid_file="$qualifier_output_base/server/server.pid.txt"
              if [[ -r "$java_pid_file" ]]; then
                java_pid="$(cat "$java_pid_file")"
                if [[ "$java_pid" =~ ^[0-9]+$ ]]; then
                  java_command="$(ps -p "$java_pid" -o comm= || true)"
                  case "$java_command" in
                    java|*/java|bazel\(*\))
                      kill -QUIT "$java_pid" 2>/dev/null || true
                      sleep 2
                      cp "$diagnostic_root/server-jvm.out" "$diagnostic_root/jvm-8min.out" || true
                      ;;
                  esac
                fi
              fi
            fi
          ) &
          diagnostic_pid=$!
          qualifier_status=0
          trap 'kill "$diagnostic_pid" 2>/dev/null || true' EXIT
          wait "$qualifier_pid" || qualifier_status=$?
          kill "$diagnostic_pid" 2>/dev/null || true
          wait "$diagnostic_pid" || true
          trap - EXIT
          if [[ -f "$diagnostic_root/server-jvm.out" ]]; then
            cp "$diagnostic_root/server-jvm.out" "$diagnostic_root/jvm-final.out" || true
          fi
          exit "$qualifier_status"

      - name: Qualify installed desktop extension family
        if: matrix.platform == 'macos-arm64' || matrix.platform == 'windows-x64'
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          case "$TARGET_PLATFORM" in
            macos-arm64)
              profile=//build_defs/host:native_macos_arm64
              startup=(--output_base="$RUNNER_TEMP/native-bazel" --host_jvm_args=-Xmx3g
                --server_jvm_out="$RUNNER_TEMP/native-bazel-diagnostics/server-jvm.out")
              configuration=(--config=macos-sandbox)
              ;;
            windows-x64)
              profile=//build_defs/host:native_windows_x64
              startup=(--output_base="$RUNNER_TEMP/b")
              configuration=()
              ;;
          esac
          bash tools/dev/bazel.sh "${startup[@]}" test \
            //build_defs/extensions:desktop_members_frozen_sql_test \
            //build_defs/extensions:desktop_final_contract_test \
            "${configuration[@]}" --platforms="$profile" --host_platform="$profile" --jobs=2

      - name: Qualify declared macOS Swift SDK
        if: matrix.platform == 'macos-arm64'
        run: >-
          bash tools/dev/bazel.sh --output_base="$RUNNER_TEMP/native-bazel" --host_jvm_args=-Xmx3g
          --server_jvm_out="$RUNNER_TEMP/native-bazel-diagnostics/server-jvm.out" test //build_defs/host:host_swift_smoke
          //src/native/sdks/swift:installed_consumer_test
          //src/native/sdks/swift:native_candidate_consumer_test
          //src/database-resources:swift_seed_archive
          --config=macos-sandbox --platforms=//build_defs/host:apple_package_macos_arm64
          --host_platform=//build_defs/host:native_macos_arm64 --jobs=2

      - name: Construct native iOS device and simulator ABI consumers
        if: matrix.platform == 'macos-arm64'
        run: |
          for profile in ios_device_arm64 ios_simulator_arm64; do
            bash tools/dev/bazel.sh --output_base="$RUNNER_TEMP/native-bazel" --host_jvm_args=-Xmx3g \
              --server_jvm_out="$RUNNER_TEMP/native-bazel-diagnostics/server-jvm.out" build -c opt \
              //src/native/runtime:mobile_static_abi_consumer \
              //src/native/runtime:runtime_abi_binary \
              --config=macos-sandbox --platforms="//build_defs/host:$profile" \
              --host_platform=//build_defs/host:native_macos_arm64 --jobs=2
          done

      - name: Check execution tool selection for foreign targets
        if: matrix.platform == 'linux-x64'
        run: >-
          bash tools/dev/bazel.sh test
          //build_defs/foundation:bun_toolchain_test
          --platforms=//build_defs/foundation:windows_x86_64
          --extra_execution_platforms=//build_defs/foundation:linux_x86_64
          --nocache_test_results --jobs=2

      - name: Exercise cold, incremental and coverage scenarios
        if: matrix.platform == 'linux-x64'
        run: |
          bash tools/dev/bun.sh tools/bazel/tests/conformance.mts
          bazel_version="$(cat .bazelversion)"
          bazel_binary="${XDG_CACHE_HOME:-$HOME/.cache}/oliphaunt/bazel/$bazel_version/bazel-$bazel_version-linux-x86_64"
          bash tools/dev/bun.sh build_defs/host/sdk-tree-conformance.mts "$bazel_binary"

      - name: Upload macOS Bazel diagnostics
        if: ${{ always() && matrix.platform == 'macos-arm64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-bazel-macos-diagnostics
          path: ${{ runner.temp }}/native-bazel-diagnostics
          if-no-files-found: ignore
          retention-days: 5

  linux:
    name: Linux runtime (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    # Cold native, Android and installed-package construction shares one base.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64
            runner: ubuntu-24.04
          - platform: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # One invocation shares PostgreSQL/ICU/generators across real consumers.
      - name: Qualify runtime, frontends, crypto and extension SQL
        env:
          TARGET_CPU: ${{ matrix.platform }}
        run: |
          profile="//build_defs/native:linux_${TARGET_CPU}_glibc_2_28"
          bash tools/dev/bazel.sh test -c opt //:native_linux_tests \
            --platforms="$profile" --host_platform="$profile" \
            --java_runtime_version=remotejdk_17 --tool_java_runtime_version=remotejdk_17 --jobs=2

      - name: Qualify Android cross-compiled runtime and ABI
        if: matrix.platform == 'x86_64'
        run: >-
          bash tools/dev/bazel.sh test -c opt //build_defs/android:abi_test
          //build_defs/native:android_runtime_abi_test
          --platforms=//build_defs/native:linux_x86_64_glibc_2_28
          --host_platform=//build_defs/native:linux_x86_64_glibc_2_28 --jobs=2

      - name: Qualify installed packages and frozen resources
        if: matrix.platform == 'x86_64'
        run: >-
          bash tools/dev/bazel.sh test -c opt
          //build_defs/languages/installed:consumer_test
          //build_defs/extensions:native_frozen_extension_sql_test
          //src/native/rust-bindings:unit_test
          //build_defs/native/carriers:package_test
          //build_defs/extensions:native_carriers_test
          //build_defs/extensions:contrib_carriers_test
          //src/extensions/contrib:native_carriers_test
          //build_defs/native/apple:framework_contract_test
          //build_defs/native/apple:swift_candidate_contract_test
          //build_defs/native/apple:mobile_seed_contract_test
          //src/native/runtime:npm
          //src/native/runtime:installed_cargo_test
          //src/native/postgres-tools:cargo_facade
          //src/native/postgres-tools:installed_cargo_test
          //src/native/postgres-tools:installed_carrier_test
          //build_defs/resources:resource_contract_test
          //src/database-resources:android_datum64_standard_carriers
          //src/database-resources:android_datum64_icu_carriers
          //src/native/sdks/react-native:source_consumer_test
          //src/native/sdks/react-native:lifecycle_test
          //src/native/sdks/kotlin:android_maven
          //src/native/sdks/kotlin:installed_public_api_consumer
          //src/native/sdks/kotlin:android_test
          //src/native/sdks/kotlin/oliphaunt-android-gradle-plugin:contract_test
          //src/native/sdks/kotlin/oliphaunt-android-gradle-plugin:plugin_maven
          //src/native/sdks/kotlin/oliphaunt-android-gradle-plugin:marker_maven
          --platforms=//build_defs/native:linux_x86_64_glibc_2_28
          --host_platform=//build_defs/native:linux_x86_64_glibc_2_28
          --java_runtime_version=remotejdk_17 --tool_java_runtime_version=remotejdk_17 --jobs=2

      - name: Qualify final native carriers and frozen resources
        env:
          TARGET_CPU: ${{ matrix.platform }}
          QUALIFICATION_JOB_NAME: Linux runtime (${{ matrix.platform }})
        run: |
          profile="//build_defs/native:linux_${TARGET_CPU}_glibc_2_28"
          capture_root="$RUNNER_TEMP/native-build-capture"
          input_root="$RUNNER_TEMP/native-build-inputs"
          mkdir -p "$input_root"
          jq -nc --arg repository "$GITHUB_REPOSITORY" --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflowPath .github/workflows/bazel.yml --arg job "$QUALIFICATION_JOB_NAME" \
            --argjson runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{repository:$repository,workflow:$workflow,workflowPath:$workflowPath,runId:$runId,runAttempt:$runAttempt,job:$job}' \
            > "$input_root/github.json"
          jq -nc --arg profile "$profile" \
            '["-c","opt","--platforms="+$profile,"--host_platform="+$profile,
              "--java_runtime_version=remotejdk_17","--tool_java_runtime_version=remotejdk_17","--jobs=2"]' \
            > "$input_root/configuration.json"
          jq -nc '[
            "//src/native/runtime:native_github_shipping",
            "//src/native/runtime:native_npm_shipping",
            "//src/native/runtime:native_cargo_shipping",
            "//src/native/runtime:native_payload_shipping",
            "//src/native/postgres-tools:native_github_shipping",
            "//src/native/postgres-tools:native_npm_shipping",
            "//src/native/postgres-tools:native_cargo_shipping",
            "//src/native/postgres-tools:native_payload_shipping",
            "//src/native/postgres-tools:npm_facade_shipping",
            "//src/native/postgres-tools:cargo_facade_shipping"
          ]' > "$input_root/roots.json"
          jq -nc '["//src/database-resources:linux_resource_test"]' > "$input_root/targets.json"
          bash tools/dev/bun.sh tools/release/qualify-native-shipping.mts \
            --github-json "$input_root/github.json" --configuration-json "$input_root/configuration.json" \
            --shipping-roots-json "$input_root/roots.json" --targets-json "$input_root/targets.json" \
            --output-directory "$capture_root"

      - name: Upload native construction evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-build-evidence-${{ matrix.platform }}
          path: ${{ runner.temp }}/native-build-capture/evidence/native-build-evidence.json
          if-no-files-found: error
          retention-days: 7

  wasix:
    name: Linux WASIX and installed browser
    runs-on: ubuntu-24.04
    # A measured cold producer request takes 82 minutes before browser host
    # construction; share its base and allow the complete cold qualification.
    timeout-minutes: 120
    outputs:
      source_commit: ${{ steps.wasix-cargo-capture.outputs.source_commit }}
      cargo_artifact_id: ${{ steps.wasix-cargo-upload.outputs.artifact-id }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Restore bounded Bazel action cache
        id: bazel-cache
        continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/oliphaunt/bazel-disk
          key: bazel-disk-v1-${{ runner.os }}-${{ runner.arch }}-wasix-${{ hashFiles('.bazelversion') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            bazel-disk-v1-${{ runner.os }}-${{ runner.arch }}-wasix-${{ hashFiles('.bazelversion') }}-

      - name: Qualify bridge, initdb shim ABI and source mode handling
        run: >-
          bash tools/dev/bazel.sh test --config=wasix-aot //build_defs/wasix:bridge_abi_test
          //build_defs/wasix:initdb_shim_abi_test
          //build_defs/wasix/postmaster:source_modes_test
          --config=ci-cache --disk_cache="$HOME/.cache/oliphaunt/bazel-disk"
          --platforms=//build_defs/native:linux_x86_64_glibc_2_28
          --host_platform=//build_defs/native:linux_x86_64_glibc_2_28 --jobs=2

      - name: Construct platform AOT packages and qualify Linux SDK and resources
        env:
          QUALIFICATION_JOB_NAME: Linux WASIX and installed browser
        run: |
          input_root="$RUNNER_TEMP/wasix-tools-build-inputs"
          mkdir -p "$input_root"
          jq -nc --arg repository "$GITHUB_REPOSITORY" --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflowPath .github/workflows/bazel.yml --arg job "$QUALIFICATION_JOB_NAME" \
            --argjson runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{repository:$repository,workflow:$workflow,workflowPath:$workflowPath,runId:$runId,runAttempt:$runAttempt,job:$job}' \
            > "$input_root/github.json"
          jq -nc --arg cache "$RUNNER_TEMP/wasix-source-sdk-cache" --arg diskCache "$HOME/.cache/oliphaunt/bazel-disk" '[
            "--config=wasix-aot","--platforms=//build_defs/native:linux_x86_64_glibc_2_28",
            "--host_platform=//build_defs/native:linux_x86_64_glibc_2_28","--jobs=1","--local_test_jobs=1",
            "--config=ci-cache","--disk_cache="+$diskCache,
            "--test_env=OLIPHAUNT_WASM_AOT_VERIFY=full","--test_env=XDG_CACHE_HOME="+$cache,"--test_env=RUST_TEST_THREADS=1"
          ]' > "$input_root/configuration.json"
          jq -nc '[
            "//src/wasix/runtime:aot_linux_x64_gnu_payload",
            "//src/wasix/runtime:aot_linux_arm64_gnu_payload",
            "//src/wasix/runtime:aot_macos_arm64_payload",
            "//src/wasix/runtime:aot_windows_x64_msvc_payload",
            "//src/wasix/runtime:cargo",
            "//src/wasix/sdks/ts:browser_sql_consumer",
            "//build_defs/wasix:macos_aot_repeatability_test",
            "//src/wasix/sdks/rust:postgres_regression_test",
            "//src/database-resources:wasix_resource_test",
            "//src/wasix/postgres-tools/ts:installed_consumer_test"
          ]' > "$input_root/targets.json"
          jq -nc '["postgres-tools-wasix"]' > "$input_root/complete-products.json"
          bash tools/dev/bun.sh tools/release/qualify-native-shipping.mts \
            --github-json "$input_root/github.json" --configuration-json "$input_root/configuration.json" \
            --shipping-export //src/wasix/postgres-tools:shipping_export --targets-json "$input_root/targets.json" \
            --complete-products-json "$input_root/complete-products.json" \
            --output-directory "$RUNNER_TEMP/wasix-tools-build-capture"

      - name: Upload tools construction evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-build-evidence-wasix-tools
          path: ${{ runner.temp }}/wasix-tools-build-capture/evidence/native-build-evidence.json
          if-no-files-found: error
          retention-days: 7

      - name: Capture final WASIX Cargo inputs for native hosts
        id: wasix-cargo-capture
        run: |
          capture_root="$RUNNER_TEMP/wasix-cargo-capture"
          mkdir -p "$capture_root"
          test -z "$(git status --porcelain)"
          configuration=(--config=wasix-aot \
            --config=ci-cache --disk_cache="$HOME/.cache/oliphaunt/bazel-disk" \
            --platforms=//build_defs/native:linux_x86_64_glibc_2_28 \
            --host_platform=//build_defs/native:linux_x86_64_glibc_2_28 --jobs=1)
          expression='kind("shipping_package", deps(//src/wasix/runtime:cargo_shipping_export, 1))'
          bash tools/dev/bazel.sh cquery "$expression" "${configuration[@]}" \
            --output=starlark --starlark:file=tools/bazel/shipping.cquery.bzl > "$capture_root/roots.jsonl"
          bash tools/dev/bazel.sh aquery "deps($expression)" "${configuration[@]}" \
            --include_artifacts --include_commandline --output=jsonproto > "$capture_root/aquery.json"
          execution_root="$(bash tools/dev/bazel.sh info execution_root)"
          source_commit="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          jq -n --arg commit "$source_commit" --arg tree "$source_tree" --arg executionRoot "$execution_root" \
            --slurpfile roots "$capture_root/roots.jsonl" --slurpfile aquery "$capture_root/aquery.json" \
            '[{source:{commit:$commit,tree:$tree},executionRoot:$executionRoot,roots:$roots,aquery:$aquery[0]}]' \
            > "$capture_root/cohorts.json"
          test -z "$(git status --porcelain)"
          bash tools/release/with-source.sh HEAD bash tools/dev/bun.sh \
            build_defs/wasix/capture-cargo.mts "$capture_root/cohorts.json" \
            target/wasix-cargo-construction HEAD
          printf 'source_commit=%s\n' "$source_commit" >> "$GITHUB_OUTPUT"

      - name: Upload final WASIX Cargo inputs
        id: wasix-cargo-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-bazel-wasix-cargo-inputs
          path: target/wasix-cargo-construction
          if-no-files-found: error
          retention-days: 7

      # One Linux producer base supplies the real portable runtime and SDK
      # archives consumed by both browser exports. Chrome is a host input.
      - name: Qualify installed browser SQL, persistence and crash recovery
        run: |
          chrome_binary="$(bash tools/dev/bun.sh build_defs/wasix/browser/chrome-receipt.mts "$RUNNER_TEMP/chrome-host.json" "$ImageOS" "$ImageVersion")"
          bash tools/dev/bazel.sh run --config=wasix-aot //src/wasix/sdks/ts:browser_sql_consumer \
            --config=ci-cache --disk_cache="$HOME/.cache/oliphaunt/bazel-disk" \
            --platforms=//build_defs/native:linux_x86_64_glibc_2_28 \
            --host_platform=//build_defs/native:linux_x86_64_glibc_2_28 --jobs=2 \
            -- "$chrome_binary" "$RUNNER_TEMP/chrome-host.json"

      - name: Freeze bounded Bazel cache for transport
        id: bazel-cache-ready
        continue-on-error: true
        if: ${{ !cancelled() && steps.bazel-cache.outputs.cache-hit != 'true' }}
        run: |
          # Cache transport is optional. Never snapshot a live writer or exceed
          # the local budget if Bazel's idle garbage collector has not finished.
          if ! bash tools/dev/bazel.sh shutdown; then
            exit 0
          fi
          cache_root="$HOME/.cache/oliphaunt/bazel-disk"
          if [[ -d "$cache_root" ]]; then
            cache_kib="$(du -sk "$cache_root" | cut -f1)"
            if [[ "$cache_kib" =~ ^[0-9]+$ ]] && (( cache_kib <= 2097152 )); then
              printf 'ready=true\n' >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Save bounded Bazel action cache
        continue-on-error: true
        if: ${{ !cancelled() && steps.bazel-cache-ready.outputs.ready == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/oliphaunt/bazel-disk
          key: ${{ steps.bazel-cache.outputs.cache-primary-key }}

  postmaster:
    name: Linux native postmaster lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      # This owner has a separate compiler/sysroot closure. Keep it parallel to
      # tools/browser construction and share its one base across both profiles.
      - name: Qualify native postmaster carrier and installed lifecycle
        run: >-
          bash tools/dev/bazel.sh --output_base="$RUNNER_TEMP/postmaster-native" test
          --platforms=//build_defs/wasix:portable
          --host_platform=//build_defs/wasix:llvm_serializer_linux_x86_64
          --compilation_mode=opt --jobs=2
          //build_defs/wasix/postmaster:cargo_source_projection_test
          //build_defs/wasix/postmaster:sjlj_runtime_probe_test
          //build_defs/wasix/postmaster:vfork_runtime_probe_test
          @postmaster_postgres//:sealed_profile_test
          @postmaster_postgres//:runtime_test
          //src/wasix/postmaster:linux_public_archive_test

      - name: Qualify linked unwinder marker detection
        run: >-
          bash tools/dev/bazel.sh --output_base="$RUNNER_TEMP/postmaster-native" test
          --platforms=//build_defs/native:linux_x86_64_glibc_2_28
          --host_platform=//build_defs/native:linux_x86_64_glibc_2_28
          --compilation_mode=opt --jobs=2
          //build_defs/wasix/postmaster:linked_unwinder_present_test
          //build_defs/wasix/postmaster:linked_unwinder_absent_test

      - name: Upload native postmaster lifecycle diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-postmaster-lifecycle-diagnostics
          path: |
            ${{ runner.temp }}/postmaster-native/execroot/_main/bazel-out/**/testlogs/**/test.log
            ${{ runner.temp }}/postmaster-native/execroot/_main/bazel-out/**/testlogs/**/test.xml
            ${{ runner.temp }}/postmaster-native/execroot/_main/bazel-out/**/testlogs/**/runtime_test/test.outputs/postmaster-runtime/runtime-result.json
            ${{ runner.temp }}/postmaster-native/execroot/_main/bazel-out/**/testlogs/**/runtime_test/test.outputs/postmaster-runtime/*.stdout
            ${{ runner.temp }}/postmaster-native/execroot/_main/bazel-out/**/testlogs/**/runtime_test/test.outputs/postmaster-runtime/*.stderr
            ${{ runner.temp }}/postmaster-native/execroot/_main/bazel-out/**/testlogs/**/runtime_test/test.outputs/postmaster-runtime/*.loader.jsonl
            ${{ runner.temp }}/postmaster-native/execroot/_main/bazel-out/**/testlogs/**/linux_public_archive_test/test.outputs/postmaster-public-archive/archive-result.json
            ${{ runner.temp }}/postmaster-native/execroot/_main/bazel-out/**/testlogs/**/linux_public_archive_test/test.outputs/postmaster-public-archive/*.stdout
            ${{ runner.temp }}/postmaster-native/execroot/_main/bazel-out/**/testlogs/**/linux_public_archive_test/test.outputs/postmaster-public-archive/*.stderr
          if-no-files-found: ignore
          retention-days: 5

  wasix-host:
    name: WASIX imported runtime (${{ matrix.platform }})
    needs: wasix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            profile: //build_defs/native:linux_aarch64_glibc_2_28
          - platform: macos-arm64
            runner: macos-26
            profile: //build_defs/host:native_macos_arm64
          - platform: windows-x64
            runner: windows-2025-vs2026
            profile: //build_defs/host:native_windows_x64
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Select declared Apple SDK
        if: matrix.platform == 'macos-arm64'
        uses: ./.github/actions/setup-apple
        with:
          install-build-dependencies: "false"

      - name: Select declared MSVC SDK
        if: matrix.platform == 'windows-x64'
        uses: ./.github/actions/setup-msvc

      # The immutable ID comes from this run's successful Linux producer.
      # Receipt/source/hash validation remains mandatory in the Bazel importer.
      - name: Download final Linux-built WASIX Cargo inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.wasix.outputs.cargo_artifact_id }}
          path: ${{ runner.temp }}/wasix-cargo-inputs

      - name: Qualify imported AOT runtime on its native host
        env:
          EXPECTED_SOURCE_COMMIT: ${{ needs.wasix.outputs.source_commit }}
          TARGET_PROFILE: ${{ matrix.profile }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          startup=()
          configuration=()
          if [[ "$TARGET_PLATFORM" == windows-x64 ]]; then
            startup=(--output_base="$RUNNER_TEMP/b")
          elif [[ "$TARGET_PLATFORM" == macos-arm64 ]]; then
            startup=(--host_jvm_args=-Xmx3g)
            configuration=(--config=macos-sandbox)
          fi
          bash tools/dev/bazel.sh "${startup[@]}" test //src/wasix/sdks/rust:postgres_regression_test \
            "${configuration[@]}" --platforms="$TARGET_PROFILE" --host_platform="$TARGET_PROFILE" \
            --repo_env=OLIPHAUNT_WASIX_SOURCE_COMMIT="$EXPECTED_SOURCE_COMMIT" \
            --repo_env=OLIPHAUNT_WASIX_CARGO_INPUTS="$RUNNER_TEMP/wasix-cargo-inputs" \
            --jobs=2 --local_test_jobs=1 \
            --test_env=OLIPHAUNT_WASM_AOT_VERIFY=full \
            --test_env=XDG_CACHE_HOME="$RUNNER_TEMP/wasix-imported-sdk-cache" \
            --test_env=RUST_TEST_THREADS=1
