      CI_PLATFORM: ${{ matrix.platform }}
      CI_MODE: ${{ needs.release-inputs.outputs.ci_mode }}
      CI_SELECTED_REQUESTS: ${{ needs.release-inputs.outputs.ci_selected_requests }}
      CI_CAPTURE_REQUESTS: ${{ needs.release-inputs.outputs.ci_capture_requests }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Acquire source-bound native inputs
        uses: ./.github/actions/native-release-inputs
        with:
          run-id: ${{ needs.release-inputs.outputs.run_id }}
          pull-number: ${{ needs.release-inputs.outputs.pull_number }}
          public-artifact-id: ${{ needs.release-inputs.outputs.public_artifact_id }}

      - name: Restore bounded standard Bazel caches
        id: bazel-cache
        uses: ./.github/actions/bazel-cache
        with:
          phase: restore
          cohort: postmaster-host

      - name: Select declared Apple SDK
        if: matrix.platform == 'macos-arm64'
        uses: ./.github/actions/setup-apple
        with:
          install-build-dependencies: "false"

      - name: Qualify native carrier from authenticated Linux guest
        if: contains(fromJSON(needs.release-inputs.outputs.ci_selected_requests), env.CI_REQUEST_ID)
        env:
          CI_REQUEST_ID: postmaster-host/${{ matrix.platform }}/carrier-lifecycle
          CI_REQUIRES: '["postmaster/linux-carrier-lifecycle"]'
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EXPECTED_SOURCE_COMMIT: ${{ needs.postmaster.outputs.source_commit }}
          EXPECTED_SOURCE_TREE: ${{ needs.postmaster.outputs.source_tree }}
          WORKFLOW_EVENT: ${{ github.event_name }}
          WORKFLOW_REF: ${{ github.ref }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          TARGET_COMPILER: ${{ matrix.compiler }}
          TARGET_PREFIX: ${{ matrix.prefix }}
          QUALIFICATION_JOB_NAME: Native postmaster lifecycle (${{ matrix.platform }})
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_SOURCE_TREE"
          input_root="$RUNNER_TEMP/postmaster-build-inputs"
          mkdir -p "$input_root"
          bun_binary="$(bash tools/dev/bun.sh -p process.execPath)"
          bun_directory="$(dirname "$bun_binary")"
          PATH="$bun_directory:$PATH"
          export PATH
          origin_snapshots="$input_root/linux-origin"
          OLIPHAUNT_GITHUB_RUN_SNAPSHOT_DIR="$origin_snapshots" \
          bash .github/scripts/download-build-artifacts.sh "$GITHUB_WORKFLOW" "$EXPECTED_SOURCE_COMMIT" \
            "$RUNNER_TEMP/postmaster-linux-packet" --run-id "$GITHUB_RUN_ID" \
            --job 'Linux native postmaster lifecycle' --job-success-only \
            --workflow-path .github/workflows/bazel.yml --event "$WORKFLOW_EVENT" --ref "$WORKFLOW_REF" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --source-tree "$EXPECTED_SOURCE_TREE" \
            --artifact native-build-evidence-postmaster-linux
          producer_attempt="$(jq -er '[.jobs[] | select(.name == "Linux native postmaster lifecycle")] | max_by(.run_attempt) | .run_attempt' "$origin_snapshots/run-$GITHUB_RUN_ID.json")"
          jq -nc --arg repository "$GITHUB_REPOSITORY" --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflowPath .github/workflows/bazel.yml --arg job 'Linux native postmaster lifecycle' \
            --argjson runId "$GITHUB_RUN_ID" --argjson runAttempt "$producer_attempt" \
            '{repository:$repository,workflow:$workflow,workflowPath:$workflowPath,runId:$runId,runAttempt:$runAttempt,job:$job}' \
            > "$input_root/linux-github.json"
          bash tools/dev/bun.sh tools/release/native-build-files.mts \
            --evidence-root "$RUNNER_TEMP/postmaster-linux-packet" \
            --source-commit "$EXPECTED_SOURCE_COMMIT" --source-tree "$EXPECTED_SOURCE_TREE" \
            --github-json "$input_root/linux-github.json" --output-directory target/postmaster-linux-import \
            > "$input_root/files.json"
          archive="$(jq -er '[.[] | select(endswith("-linux-x64-gnu.tar.zst"))] | if length == 1 then .[0] else error("one canonical Linux archive required") end' "$input_root/files.json")"
          jq --arg job "$QUALIFICATION_JOB_NAME" --argjson attempt "$GITHUB_RUN_ATTEMPT" \
            '.job=$job | .runAttempt=$attempt' "$input_root/linux-github.json" \
            > "$input_root/github.json"
          jq -nc --arg base "$RUNNER_TEMP/postmaster-native" \
            '["--output_base="+$base,"--host_jvm_args=-Xmx3g"]' > "$input_root/startup.json"
          jq -nc --arg compiler "$TARGET_COMPILER" --arg archive "$archive" --arg platform "$TARGET_PLATFORM" \
            '["-c","opt","--platforms=//build_defs/wasix:portable","--host_platform="+$compiler,
              "--extra_execution_platforms="+$compiler,
              (if $platform == "macos-arm64" then "--jobs=2" else "--jobs=1" end),"--local_test_jobs=1",
              "--repo_env=OLIPHAUNT_POSTMASTER_GUEST_ARCHIVE="+$archive]
              + (if $platform == "macos-arm64" then ["--config=macos-sandbox"] else [] end)' \
            > "$input_root/configuration.json"
          jq -nc --arg prefix "$TARGET_PREFIX" \
            '["//src/wasix/postmaster:"+$prefix+"_public_archive_test",
              "//src/wasix/postmaster:"+$prefix+"_runtime_test"]' > "$input_root/targets.json"
          printf '%s\n' "${CI_REQUIRES:-[]}" > "$input_root/ci-requires.json"
          ci_arguments=(--ci-request-id "$CI_REQUEST_ID" --ci-job "$CI_REQUEST_JOB" --ci-mode "$CI_MODE"
            --ci-requires-json "$input_root/ci-requires.json")
          if jq -e --arg id "$CI_REQUEST_ID" 'index($id) != null' <<< "$CI_CAPTURE_REQUESTS" >/dev/null; then
            ci_arguments+=(--ci-handoff)
          fi
          bash tools/dev/bun.sh tools/release/qualify-native-shipping.mts "${ci_arguments[@]}" \
            --github-json "$input_root/github.json" --startup-json "$input_root/startup.json" \
            --configuration-json "$input_root/configuration.json" \
            --shipping-export "//src/wasix/postmaster:${TARGET_PREFIX}_shipping_export" \
            --targets-json "$input_root/targets.json" \
            --output-directory "$RUNNER_TEMP/postmaster-build-capture"
          mkdir -p "$RUNNER_TEMP/ci-requests/$CI_REQUEST_ID"
          cp "$RUNNER_TEMP/postmaster-build-capture/ci-request.json" "$RUNNER_TEMP/ci-requests/$CI_REQUEST_ID/ci-request.json"

      - name: Upload native postmaster construction evidence
        if: needs.release-inputs.outputs.ci_mode == 'full' || contains(fromJSON(needs.release-inputs.outputs.ci_capture_requests), format('postmaster-host/{0}/carrier-lifecycle', matrix.platform))
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-build-evidence-postmaster-${{ matrix.platform }}
          path: ${{ runner.temp }}/postmaster-build-capture/evidence/
          if-no-files-found: error
          retention-days: 7

      - name: Upload native postmaster build and query diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-postmaster-build-diagnostics-${{ matrix.platform }}
          path: ${{ runner.temp }}/postmaster-build-capture/diagnostics/
          if-no-files-found: warn
          retention-days: 7

      - *ci_request_receipts

      - name: Save bounded standard Bazel caches
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/bazel-cache
        with:
          phase: save
          cohort: postmaster-host
          disk-cache-hit: ${{ steps.bazel-cache.outputs.disk-cache-hit }}
          output-base: ${{ runner.temp }}/postmaster-native
          jvm-args: -Xmx3g

  react-native:
    name: Native React Native consumers
    if: ${{ !cancelled() && needs.release-inputs.result == 'success' && needs.portable.result == 'success' && contains(fromJSON(needs.release-inputs.outputs.ci_selected_jobs), 'react-native') }}
    needs: [portable, release-inputs]
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CI_REQUEST_JOB: react-native
      CI_MODE: ${{ needs.release-inputs.outputs.ci_mode }}
      CI_SELECTED_REQUESTS: ${{ needs.release-inputs.outputs.ci_selected_requests }}
      CI_CAPTURE_REQUESTS: ${{ needs.release-inputs.outputs.ci_capture_requests }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Acquire source-bound native inputs
        uses: ./.github/actions/native-release-inputs
        with:
          run-id: ${{ needs.release-inputs.outputs.run_id }}
          pull-number: ${{ needs.release-inputs.outputs.pull_number }}
          public-artifact-id: ${{ needs.release-inputs.outputs.public_artifact_id }}

      - name: Restore bounded standard Bazel caches
        id: bazel-cache
        uses: ./.github/actions/bazel-cache
        with:
          phase: restore
          cohort: react-native

      - name: Select declared Apple SDK
        uses: ./.github/actions/setup-apple
        with:
          install-build-dependencies: "false"

      - name: Authenticate final Apple and Swift consumer inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          input_root="$RUNNER_TEMP/react-native-build-inputs"
          mkdir -p "$input_root"
          jq -nc '["oliphaunt-react-native"]' > "$input_root/consumer-products.json"
          bash tools/release/with-source.sh HEAD bash tools/dev/bun.sh tools/release/native-release-preparation.mts \
            --stage-release-archives --run-id "$GITHUB_RUN_ID" --ref "$GITHUB_REF" \
            --consumer-products-json "$input_root/consumer-products.json" \
            --output-directory target/native-react-native-archive-inputs

      - name: Qualify final React Native package and installed iOS consumer
        if: contains(fromJSON(needs.release-inputs.outputs.ci_selected_requests), env.CI_REQUEST_ID)
        env:
          CI_REQUEST_ID: react-native/installed-consumer
          CI_REQUIRES: '["portable/macos-arm64/apple-packages"]'
        run: |
          OLIPHAUNT_MOBILE_CANDIDATE_CHECKOUT="$(pwd -P)"
          test "$OLIPHAUNT_MOBILE_CANDIDATE_CHECKOUT" = "$(cd "$GITHUB_WORKSPACE" && pwd -P)"
          OLIPHAUNT_MOBILE_CANDIDATE_SHA="$(git rev-parse HEAD)"
          OLIPHAUNT_MOBILE_CANDIDATE_TREE="$(git rev-parse 'HEAD^{tree}')"
          test -z "$(git status --porcelain --untracked-files=no)"
          export OLIPHAUNT_MOBILE_CANDIDATE_CHECKOUT OLIPHAUNT_MOBILE_CANDIDATE_SHA OLIPHAUNT_MOBILE_CANDIDATE_TREE
          input_root="$RUNNER_TEMP/react-native-build-inputs"
          jq -nc --arg repository "$GITHUB_REPOSITORY" --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflowPath .github/workflows/bazel.yml --arg job 'Native React Native consumers' \
            --argjson runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{repository:$repository,workflow:$workflow,workflowPath:$workflowPath,runId:$runId,runAttempt:$runAttempt,job:$job}' \
            > "$input_root/github.json"
          jq -nc --arg base "$RUNNER_TEMP/native-bazel" \
            '["--output_base="+$base,"--host_jvm_args=-Xmx3g"]' > "$input_root/startup.json"
          jq -nc '["-c","opt","--config=macos-sandbox",
            "--platforms=//build_defs/host:apple_package_macos_arm64",
            "--host_platform=//build_defs/host:native_macos_arm64","--jobs=1","--local_test_jobs=1"]' \
            > "$input_root/configuration.json"
          printf '%s\n' "${CI_REQUIRES:-[]}" > "$input_root/ci-requires.json"
          ci_arguments=(--ci-request-id "$CI_REQUEST_ID" --ci-job "$CI_REQUEST_JOB" --ci-mode "$CI_MODE"
            --ci-requires-json "$input_root/ci-requires.json")
          if jq -e --arg id "$CI_REQUEST_ID" 'index($id) != null' <<< "$CI_CAPTURE_REQUESTS" >/dev/null; then
            ci_arguments+=(--ci-handoff)
          fi
          bash tools/dev/bun.sh tools/release/qualify-native-shipping.mts "${ci_arguments[@]}" \
            --github-json "$input_root/github.json" --startup-json "$input_root/startup.json" \
            --configuration-json "$input_root/configuration.json" \
            --shipping-export //:native_react_native_shipping_export \
            --output-directory "$RUNNER_TEMP/react-native-build-capture"
          mkdir -p "$RUNNER_TEMP/ci-requests/$CI_REQUEST_ID"
          cp "$RUNNER_TEMP/react-native-build-capture/ci-request.json" "$RUNNER_TEMP/ci-requests/$CI_REQUEST_ID/ci-request.json"

      - name: Upload React Native construction evidence
        if: needs.release-inputs.outputs.ci_mode == 'full' || contains(fromJSON(needs.release-inputs.outputs.ci_capture_requests), 'react-native/installed-consumer')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-build-evidence-react-native-macos-arm64
          path: ${{ runner.temp }}/react-native-build-capture/evidence/
          if-no-files-found: error
          retention-days: 7

      - *ci_request_receipts

      - name: Save bounded standard Bazel caches
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/bazel-cache
        with:
          phase: save
          cohort: react-native
          disk-cache-hit: ${{ steps.bazel-cache.outputs.disk-cache-hit }}
          output-base: ${{ runner.temp }}/native-bazel
          jvm-args: -Xmx3g

  release-families:
    name: Native release families
    if: ${{ !cancelled() && needs.release-inputs.result == 'success' && needs.portable.result == 'success' && needs.linux.result == 'success' && needs.wasix.result == 'success' && needs.postmaster.result == 'success' && needs.postmaster-host.result == 'success' && contains(fromJSON(needs.release-inputs.outputs.ci_selected_jobs), 'release-families') }}
    needs: [portable, linux, wasix, postmaster, postmaster-host, release-inputs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      pull-requests: read
    env:
      CI_REQUEST_JOB: release-families
      CI_MODE: ${{ needs.release-inputs.outputs.ci_mode }}
      CI_SELECTED_REQUESTS: ${{ needs.release-inputs.outputs.ci_selected_requests }}
      CI_CAPTURE_REQUESTS: ${{ needs.release-inputs.outputs.ci_capture_requests }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Acquire source-bound native inputs
        uses: ./.github/actions/native-release-inputs
        with:
          run-id: ${{ needs.release-inputs.outputs.run_id }}
          pull-number: ${{ needs.release-inputs.outputs.pull_number }}
          public-artifact-id: ${{ needs.release-inputs.outputs.public_artifact_id }}

      - name: Restore bounded standard Bazel caches
        id: bazel-cache
        uses: ./.github/actions/bazel-cache
        with:
          phase: restore
          cohort: release-families

      - name: Authenticate this run's completed archive producers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash tools/release/with-source.sh HEAD bash tools/dev/bun.sh tools/release/native-release-preparation.mts
          --stage-release-archives --run-id "$GITHUB_RUN_ID" --ref "$GITHUB_REF"
          --output-directory target/native-release-archive-inputs

      - name: Qualify complete public checksum families
        if: contains(fromJSON(needs.release-inputs.outputs.ci_selected_requests), env.CI_REQUEST_ID)
        env:
          CI_REQUEST_ID: release-families/checksums
          CI_REQUIRES: '["portable/linux-x64/napi","portable/linux-arm64/napi","portable/macos-arm64/napi","portable/windows-x64/napi","portable/macos-arm64/native-carriers","portable/windows-x64/native-carriers","portable/macos-arm64/apple-packages","linux/x86_64/android-packages","linux/x86_64/native-carriers","linux/aarch64/native-carriers","wasix/tools-sdk-browser","postmaster/linux-carrier-lifecycle","postmaster-host/macos-arm64/carrier-lifecycle","postmaster-host/linux-arm64/carrier-lifecycle"]'
        run: |
          input_root="$RUNNER_TEMP/release-family-build-inputs"
          mkdir -p "$input_root"
          jq -nc --arg repository "$GITHUB_REPOSITORY" --arg workflow "$GITHUB_WORKFLOW" \
            --arg workflowPath .github/workflows/bazel.yml --arg job "Native release families" \
            --argjson runId "$GITHUB_RUN_ID" --argjson runAttempt "$GITHUB_RUN_ATTEMPT" \
            '{repository:$repository,workflow:$workflow,workflowPath:$workflowPath,runId:$runId,runAttempt:$runAttempt,job:$job}' \
            > "$input_root/github.json"
          jq -nc --arg archives "$GITHUB_WORKSPACE/target/native-release-archive-inputs" '[
            "-c","opt","--platforms=//build_defs/native:linux_x86_64_glibc_2_28",
            "--host_platform=//build_defs/native:linux_x86_64_glibc_2_28","--jobs=2",
            "--repo_env=OLIPHAUNT_NATIVE_RELEASE_ARCHIVES="+$archives
          ]' > "$input_root/configuration.json"
          printf '%s\n' "${CI_REQUIRES:-[]}" > "$input_root/ci-requires.json"
          ci_arguments=(--ci-request-id "$CI_REQUEST_ID" --ci-job "$CI_REQUEST_JOB" --ci-mode "$CI_MODE"
            --ci-requires-json "$input_root/ci-requires.json")
          if jq -e --arg id "$CI_REQUEST_ID" 'index($id) != null' <<< "$CI_CAPTURE_REQUESTS" >/dev/null; then
            ci_arguments+=(--ci-handoff)
          fi
          bash tools/dev/bun.sh tools/release/qualify-native-shipping.mts "${ci_arguments[@]}" \
            --github-json "$input_root/github.json" --configuration-json "$input_root/configuration.json" \
            --shipping-export //:release_family_shipping_export \
            --output-directory "$RUNNER_TEMP/release-family-build-capture"
          mkdir -p "$RUNNER_TEMP/ci-requests/$CI_REQUEST_ID"
          cp "$RUNNER_TEMP/release-family-build-capture/ci-request.json" "$RUNNER_TEMP/ci-requests/$CI_REQUEST_ID/ci-request.json"

      - name: Upload public checksum construction evidence
        if: needs.release-inputs.outputs.ci_mode == 'full' || contains(fromJSON(needs.release-inputs.outputs.ci_capture_requests), 'release-families/checksums')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-build-evidence-release-families
          path: ${{ runner.temp }}/release-family-build-capture/evidence/
          if-no-files-found: error
          retention-days: 7

      - *ci_request_receipts

      - name: Save bounded standard Bazel caches
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/bazel-cache
        with:
          phase: save
          cohort: release-families
          disk-cache-hit: ${{ steps.bazel-cache.outputs.disk-cache-hit }}

  wasix-host:
    name: WASIX imported runtime (${{ matrix.platform }})
    if: ${{ !cancelled() && needs.release-inputs.result == 'success' && needs.wasix.result == 'success' && fromJSON(needs.release-inputs.outputs.wasix_host_matrix).include[0] != null }}
    needs: [wasix, release-inputs]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-inputs.outputs.wasix_host_matrix) }}
    env:
      CI_REQUEST_JOB: wasix-host/${{ matrix.platform }}
      CI_PLATFORM: ${{ matrix.platform }}
      CI_MODE: ${{ needs.release-inputs.outputs.ci_mode }}
      CI_SELECTED_REQUESTS: ${{ needs.release-inputs.outputs.ci_selected_requests }}
      CI_CAPTURE_REQUESTS: ${{ needs.release-inputs.outputs.ci_capture_requests }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Acquire source-bound native inputs
        uses: ./.github/actions/native-release-inputs
        with:
          run-id: ${{ needs.release-inputs.outputs.run_id }}
          pull-number: ${{ needs.release-inputs.outputs.pull_number }}
          public-artifact-id: ${{ needs.release-inputs.outputs.public_artifact_id }}

      - name: Restore bounded standard Bazel caches
        id: bazel-cache
        uses: ./.github/actions/bazel-cache
        with:
          phase: restore
          cohort: wasix-host

      - name: Select declared Apple SDK
        if: matrix.platform == 'macos-arm64'
        uses: ./.github/actions/setup-apple
        with:
          install-build-dependencies: "false"

      - name: Select declared MSVC SDK
        if: matrix.platform == 'windows-x64'
        uses: ./.github/actions/setup-msvc

      # The immutable ID comes from this run's successful Linux producer.
      # Receipt/source/hash validation remains mandatory in the Bazel importer.
      - name: Download final Linux-built WASIX Cargo inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: ${{ needs.wasix.outputs.cargo_artifact_id }}
          path: ${{ runner.temp }}/wasix-cargo-inputs

      - name: Qualify imported AOT runtime on its native host
        if: contains(fromJSON(needs.release-inputs.outputs.ci_selected_requests), env.CI_REQUEST_ID)
        env:
          CI_REQUIRES: '["wasix/tools-sdk-browser"]'
          CI_REQUEST_ID: wasix-host/${{ matrix.platform }}/imported-runtime
          EXPECTED_SOURCE_COMMIT: ${{ needs.wasix.outputs.source_commit }}
          TARGET_PROFILE: ${{ matrix.profile }}
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_COMMIT"
          test -z "$(git status --porcelain)"
          startup=()
          configuration=()
          if [[ "$TARGET_PLATFORM" == windows-x64 ]]; then
            startup=(--output_base="$RUNNER_TEMP/b")
          elif [[ "$TARGET_PLATFORM" == macos-arm64 ]]; then
            startup=(--host_jvm_args=-Xmx3g)
            configuration=(--config=macos-sandbox)
          fi
          ci_targets=(//src/wasix/sdks/rust:postgres_regression_test //build_defs/wasix:host_aot_smoke_test)
          ci_configuration=("${configuration[@]}" "--platforms=$TARGET_PROFILE" "--host_platform=$TARGET_PROFILE"
            "--repo_env=OLIPHAUNT_WASIX_SOURCE_COMMIT=$EXPECTED_SOURCE_COMMIT"
            "--repo_env=OLIPHAUNT_WASIX_CARGO_INPUTS=$RUNNER_TEMP/wasix-cargo-inputs"
            --jobs=2 --local_test_jobs=1 --test_env=OLIPHAUNT_WASM_AOT_VERIFY=full
            "--test_env=XDG_CACHE_HOME=$RUNNER_TEMP/wasix-imported-sdk-cache" --test_env=RUST_TEST_THREADS=1)
          ci_startup=("${startup[@]}")
          ci_command='test'
          ci_input_root="$RUNNER_TEMP/ci-request-inputs/$CI_REQUEST_ID"
          mkdir -p "$ci_input_root"
          jq -nc --args '$ARGS.positional' -- "${ci_targets[@]}" > "$ci_input_root/targets.json"
          jq -nc --args '$ARGS.positional' -- "${ci_configuration[@]}" > "$ci_input_root/configuration.json"
          jq -nc --args '$ARGS.positional' -- "${ci_startup[@]}" > "$ci_input_root/startup.json"
          printf '%s\n' "$CI_REQUIRES" > "$ci_input_root/requires.json"
          bash tools/release/with-source.sh HEAD bash tools/dev/bun.sh tools/ci/run-configured-request.mts \
            --id "$CI_REQUEST_ID" --job "$CI_REQUEST_JOB" --mode "$CI_MODE" --command "$ci_command" \
            --targets-json "$ci_input_root/targets.json" --configuration-json "$ci_input_root/configuration.json" \
            --startup-json "$ci_input_root/startup.json" --requires-json "$ci_input_root/requires.json" \
            --output-directory "$RUNNER_TEMP/ci-requests/$CI_REQUEST_ID"

      - *ci_request_receipts

      - name: Save bounded standard Bazel caches
        if: ${{ always() }}
        continue-on-error: true
        timeout-minutes: 10
        uses: ./.github/actions/bazel-cache
        with:
          phase: save
          cohort: wasix-host
          disk-cache-hit: ${{ steps.bazel-cache.outputs.disk-cache-hit }}
          output-base: ${{ matrix.platform == 'windows-x64' && format('{0}/b', runner.temp) || '' }}
          jvm-args: ${{ matrix.platform == 'macos-arm64' && '-Xmx3g' || '' }}

  required:
    name: Required
    needs: [release-inputs, portable, linux, wasix, postmaster, postmaster-host, react-native, release-families, wasix-host]
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed') && needs.release-inputs.outputs.ci_mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require every native qualification job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS_JSON"

      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up verified Node.js and Bun
        uses: ./.github/actions/setup-node-bun

      - name: Acquire source-bound native inputs
        uses: ./.github/actions/native-release-inputs
        with:
          run-id: ${{ needs.release-inputs.outputs.run_id }}
          pull-number: ${{ needs.release-inputs.outputs.pull_number }}
          public-artifact-id: ${{ needs.release-inputs.outputs.public_artifact_id }}

      - name: Audit the completed native construction
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          bash tools/release/with-source.sh HEAD bash tools/dev/bun.sh
          tools/release/audit-native-construction.mts
          --run-id "$GITHUB_RUN_ID" --ref "$GITHUB_REF"
          --output-directory "$RUNNER_TEMP/native-construction-audit"

  source-ci:
    name: Source CI
    needs: [release-inputs, portable, linux, wasix, postmaster, postmaster-host, react-native, release-families, wasix-host, required]
    if: always() && (github.event_name != 'pull_request' || github.event.action != 'closed')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require a successful plan and every selected job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: jq -e '."release-inputs".result == "success" and all(.[]; .result == "success" or .result == "skipped")' <<< "$NEEDS_JSON"

      - name: Checkout exact source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up verified Node.js and Bun
        uses: ./.github/actions/setup-node-bun

      - name: Download source request plan
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: native-ci-plan
          path: ${{ runner.temp }}/native-ci-plan

      - name: Download completed source request receipts
        if: needs.release-inputs.outputs.ci_selected_requests != '[]'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: native-ci-requests-*
          merge-multiple: true
          path: ${{ runner.temp }}/ci-requests

      - name: Verify selected requests and every omission
        run: |
          mkdir -p "$RUNNER_TEMP/ci-requests"
          bash tools/release/with-source.sh HEAD bash tools/dev/bun.sh tools/ci/configured-scope.mts verify \
            --plan "$RUNNER_TEMP/native-ci-plan/plan.json" --requests-dir "$RUNNER_TEMP/ci-requests" \
            --required-result '${{ needs.required.result }}' --basis-output "$RUNNER_TEMP/native-ci-basis/basis.json"

      - name: Upload admitted complete configured basis
        if: needs.release-inputs.outputs.ci_mode == 'full' && needs.required.result == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: native-ci-basis
          path: ${{ runner.temp }}/native-ci-basis/basis.json
          if-no-files-found: error
          retention-days: 90
