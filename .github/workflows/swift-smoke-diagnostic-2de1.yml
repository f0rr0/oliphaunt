name: Apple compile SDK union diagnostic

on:
  push:
    branches: [f0rr0/diagnostic-swift-smoke-2de1]

permissions:
  contents: read

concurrency:
  group: apple-compile-union-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  apple_compile_union:
    name: Compare stable and mixed Apple compile SDK inputs
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout diagnostic transport and exact source ancestry
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Select declared Apple SDK
        uses: ./.github/actions/setup-apple
        with:
          install-build-dependencies: "false"

      - name: Build four cold compile controls
        timeout-minutes: 35
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/apple-compile-union-bootstrap
        run: |
          set -euo pipefail
          bash tools/dev/bun.sh --no-install --no-env-file .github/scripts/apple-compile-input-control.mts run "$RUNNER_TEMP/apple-compile-union"

      - name: Stop exact control servers and finalize safe evidence
        if: always()
        timeout-minutes: 4
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/apple-compile-union-bootstrap
        run: |
          set -euo pipefail
          bash tools/dev/bun.sh --no-install --no-env-file .github/scripts/apple-compile-input-control.mts finalize "$RUNNER_TEMP/apple-compile-union"

      - name: Preserve sanitized complete profiles and control identities
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apple-compile-union-control
          path: ${{ runner.temp }}/apple-compile-union/evidence
          if-no-files-found: warn
          retention-days: 7
