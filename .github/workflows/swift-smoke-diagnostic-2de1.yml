name: Windows installed consumer correction diagnostic

on:
  push:
    branches: [f0rr0/diagnostic-swift-smoke-2de1]

permissions:
  contents: read

concurrency:
  group: windows-installed-consumer-control-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  installed_consumers:
    name: Verify corrected Windows installed consumers
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Checkout corrected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 65c0291c91ec10340fb827b66331192c60e735e6
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Select declared MSVC SDK
        uses: ./.github/actions/setup-msvc

      - name: Verify static PostGIS consumers
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/windows-installed-consumer-bootstrap
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 65c0291c91ec10340fb827b66331192c60e735e6
          test "$(git rev-parse 'HEAD^{tree}')" = 89401f21194e1c3dde0b95c5414d459bb047d6d6
          diag="$RUNNER_TEMP/windows-installed-consumers-diagnostic"
          mkdir -p "$diag"
          printf 'SOURCE_COMMIT=65c0291c91ec10340fb827b66331192c60e735e6\nSOURCE_TREE=89401f21194e1c3dde0b95c5414d459bb047d6d6\n' > "$diag/source.txt"
          targets=(
            //build_defs/extensions:desktop_all_members_frozen_sql_test
            //build_defs/extensions:postgis_server_windows_link_test
            //build_defs/extensions:postgis_embedded_windows_link_test
          )
          printf '%s\n' "${targets[@]}" > "$diag/targets.txt"
          base="$RUNNER_TEMP/b"
          test ! -e "$base"
          bazel=(bash tools/dev/bazel.sh --nohome_rc --nosystem_rc --output_base="$base")
          "${bazel[@]}" test "${targets[@]}" -c opt \
            --platforms=//build_defs/host:native_windows_x64 \
            --host_platform=//build_defs/host:native_windows_x64 \
            --jobs=2 --lockfile_mode=error --disk_cache= \
            --keep_going --nocache_test_results --test_output=errors --test_summary=detailed \
            > "$diag/tests.log" 2>&1
          tail -n 20 "$diag/tests.log"

      - name: Preserve installed consumer diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installed-consumers-diagnostic
          path: |
            ${{ runner.temp }}/windows-installed-consumers-diagnostic
            ${{ runner.temp }}/b/execroot/_main/bazel-out/x64_windows-opt/testlogs/build_defs/extensions/desktop_all_members_frozen_sql_test
            ${{ runner.temp }}/b/execroot/_main/bazel-out/x64_windows-opt/testlogs/build_defs/extensions/postgis_server_windows_link_test
            ${{ runner.temp }}/b/execroot/_main/bazel-out/x64_windows-opt/testlogs/build_defs/extensions/postgis_embedded_windows_link_test
          if-no-files-found: warn
          retention-days: 7
