name: Windows installed consumer correction diagnostic

on:
  push:
    branches: [f0rr0/diagnostic-swift-smoke-2de1]

permissions:
  contents: read

concurrency:
  group: windows-installed-consumer-control-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  installed_consumers:
    name: Verify corrected Windows installed consumers
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Checkout corrected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 43764f9876041314ee8c451444004c80d899c056
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Select declared MSVC SDK
        uses: ./.github/actions/setup-msvc

      - name: Run the five failed installed consumers and helper regression
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/windows-installed-consumer-bootstrap
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 43764f9876041314ee8c451444004c80d899c056
          test "$(git rev-parse 'HEAD^{tree}')" = 8e67f263ad2c05ab00fe951a5dedf0b31e643a63
          test -z "${OLIPHAUNT_NATIVE_PUBLICATION_INPUTS:-}"
          diag="$RUNNER_TEMP/windows-installed-consumers-diagnostic"
          mkdir -p "$diag"
          printf 'SOURCE_COMMIT=43764f9876041314ee8c451444004c80d899c056\nSOURCE_TREE=8e67f263ad2c05ab00fe951a5dedf0b31e643a63\n' > "$diag/source.txt"
          targets=(
            //build_defs/languages/carriers:installed_sql_test
            //build_defs/extensions:desktop_all_members_frozen_sql_test
            //src/native/runtime:host_runtime_sql_test
            //src/database-resources:native_resource_test
            //src/native/postgres-tools:installed_carrier_test
            //build_defs/native:host_runtime_test_helpers_test
          )
          printf '%s\n' "${targets[@]}" > "$diag/targets.txt"
          base="$RUNNER_TEMP/b"
          test ! -e "$base"
          bazel=(bash tools/dev/bazel.sh --nohome_rc --nosystem_rc --output_base="$base")
          "${bazel[@]}" test "${targets[@]}" -c opt \
            --platforms=//build_defs/host:native_windows_x64 \
            --host_platform=//build_defs/host:native_windows_x64 \
            --jobs=2 --lockfile_mode=error --disk_cache= \
            --keep_going --nocache_test_results --test_output=errors --test_summary=detailed \
            > "$diag/tests.log" 2>&1
          tail -n 20 "$diag/tests.log"

      - name: Preserve installed consumer diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-installed-consumers-diagnostic
          path: |
            ${{ runner.temp }}/windows-installed-consumers-diagnostic
            ${{ runner.temp }}/b/execroot/_main/bazel-out/x64_windows-opt/testlogs/build_defs/languages/carriers/installed_sql_test
            ${{ runner.temp }}/b/execroot/_main/bazel-out/x64_windows-opt/testlogs/build_defs/extensions/desktop_all_members_frozen_sql_test
            ${{ runner.temp }}/b/execroot/_main/bazel-out/x64_windows-opt/testlogs/src/native/runtime/host_runtime_sql_test
            ${{ runner.temp }}/b/execroot/_main/bazel-out/x64_windows-opt/testlogs/src/database-resources/native_resource_test
            ${{ runner.temp }}/b/execroot/_main/bazel-out/x64_windows-opt/testlogs/src/native/postgres-tools/installed_carrier_test
            ${{ runner.temp }}/b/execroot/_main/bazel-out/x64_windows-opt/testlogs/build_defs/native/host_runtime_test_helpers_test
          if-no-files-found: warn
          retention-days: 7
