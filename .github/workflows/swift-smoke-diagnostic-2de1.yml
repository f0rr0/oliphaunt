name: Windows libiconv configuration diagnostic

on:
  push:
    branches: [f0rr0/diagnostic-swift-smoke-2de1]

permissions:
  contents: read

concurrency:
  group: swift-compiler-smoke-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Generate Windows libiconv headers and test pinned templates
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    steps:
      - name: Checkout immutable tested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: bb841660476a0b7dbddaea7b5d8828d99bc91ea7
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tested commit and tree
        run: |
          tested_commit="$(git rev-parse HEAD)"
          tested_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$tested_commit" = bb841660476a0b7dbddaea7b5d8828d99bc91ea7
          test "$tested_tree" = 5efda73eb5cd9ee45b6eef5f7fd743e0b907fa67
          printf 'TESTED_SOURCE_COMMIT=%s\nTESTED_SOURCE_TREE=%s\n' "$tested_commit" "$tested_tree"

      - name: Select declared MSVC SDK
        uses: ./.github/actions/setup-msvc

      - name: Generate actual Windows libiconv headers and run template regression
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/iconv-config-bootstrap
        run: |
          bash tools/dev/bazel.sh --nohome_rc --nosystem_rc \
            --output_base="$RUNNER_TEMP/iconv-config" --host_jvm_args=-Xmx3g \
            test //build_defs/extensions/postgis:iconv_config \
            //build_defs/extensions/postgis:configure_headers_test -c opt \
            --platforms=//build_defs/host:native_windows_x64 \
            --host_platform=//build_defs/host:native_windows_x64 --jobs=2 --local_test_jobs=1 \
            --lockfile_mode=error --repository_cache= --disk_cache= --test_output=all
