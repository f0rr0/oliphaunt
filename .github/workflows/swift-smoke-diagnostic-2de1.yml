name: Apple sandbox input control

on:
  push:
    branches: [f0rr0/diagnostic-swift-smoke-2de1]

permissions:
  contents: read

concurrency:
  group: apple-sandbox-input-control-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  sandbox_inputs:
    name: Compare declared Apple SDK sandbox setup
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout fixed source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 2291012139d6d71544cf75875282fed1399ecd9c
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Select declared Apple SDK
        uses: ./.github/actions/setup-apple
        with:
          install-build-dependencies: "false"

      - name: Compare in-memory and stock disk sandbox stashes
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/apple-sandbox-bootstrap
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 2291012139d6d71544cf75875282fed1399ecd9c
          test "$(git rev-parse 'HEAD^{tree}')" = 51cbd2b54fceaf615a47d7db05c782ece60bd925
          diag="$RUNNER_TEMP/apple-sandbox-input-control"
          raw="$RUNNER_TEMP/apple-sandbox-input-control-private"
          mkdir -p "$diag" "$raw"
          printf 'SOURCE_COMMIT=2291012139d6d71544cf75875282fed1399ecd9c\nSOURCE_TREE=51cbd2b54fceaf615a47d7db05c782ece60bd925\n' > "$diag/source.txt"
          targets=(@icu//:data_stub //build_defs/host:host_c_smoke //build_defs/native:probe_process_test)
          for memory in true false; do
            base="$RUNNER_TEMP/apple-sandbox-base-$memory"
            test ! -e "$base"
            bazel=(bash tools/dev/bazel.sh --nohome_rc --nosystem_rc
              --output_base="$base" --host_jvm_args=-Xmx3g
              --server_jvm_out="$raw/server-$memory.out")
            for profile in native_macos_arm64 apple_package_macos_arm64; do
              stem="$memory-$profile"
              "${bazel[@]}" build "${targets[@]}" -c opt --config=macos-sandbox \
                "--platforms=//build_defs/host:$profile" \
                --host_platform=//build_defs/host:native_macos_arm64 \
                --jobs=1 --local_test_jobs=1 --lockfile_mode=error --disk_cache= \
                --reuse_sandbox_directories=true --sandbox_debug=false \
                "--experimental_inmemory_sandbox_stashes=$memory" \
                "--profile=$diag/$stem.profile.json.gz" \
                "--build_event_json_file=$raw/$stem.events.jsonl" \
                --build_event_publish_all_actions=true \
                > "$diag/$stem.build.log" 2>&1
              gzip -t "$diag/$stem.profile.json.gz"
              gzip -dc "$diag/$stem.profile.json.gz" | \
                jq -e 'type == "object" and (.traceEvents | type == "array")' > /dev/null
              jq -s '{
                options: [.[] | .structuredCommandLine? | select(.commandLineLabel == "canonical") |
                  .sections[]?.optionList.option[]? |
                  select(.optionName == "reuse_sandbox_directories" or .optionName == "sandbox_debug" or
                    .optionName == "experimental_inmemory_sandbox_stashes" or .optionName == "jobs" or
                    .optionName == "platforms" or .optionName == "host_platform" or .optionName == "compilation_mode") |
                  {name: .optionName, value: .optionValue}],
                compileActions: [.[] | .action? | select(.type == "CppCompile") |
                  {success, type, label, configuration}]
              }' "$raw/$stem.events.jsonl" > "$diag/$stem.bep-projection.json"
              jq -e --arg memory "$memory" --arg profile "//build_defs/host:$profile" '
                (.options | map({key: .name, value: .value}) | from_entries) as $options |
                $options.reuse_sandbox_directories == "true" and $options.sandbox_debug == "false" and
                $options.experimental_inmemory_sandbox_stashes == $memory and $options.jobs == "1" and
                $options.platforms == $profile and $options.host_platform == "//build_defs/host:native_macos_arm64" and
                $options.compilation_mode == "opt" and (.compileActions | length >= 3) and
                (all(.compileActions[]; .success == true))
              ' "$diag/$stem.bep-projection.json" > /dev/null
              tail -n 8 "$diag/$stem.build.log"
            done
            "${bazel[@]}" shutdown > "$raw/shutdown-$memory.log" 2>&1
          done

      - name: Preserve complete profiles and bounded build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: apple-sandbox-input-control
          path: ${{ runner.temp }}/apple-sandbox-input-control
          if-no-files-found: warn
          retention-days: 7
