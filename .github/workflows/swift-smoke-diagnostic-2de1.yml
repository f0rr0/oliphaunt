name: Windows libiconv configuration diagnostic

on:
  push:
    branches: [f0rr0/diagnostic-swift-smoke-2de1]

permissions:
  contents: read

concurrency:
  group: swift-compiler-smoke-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Generate Windows libiconv headers and test pinned templates
    runs-on: windows-2025-vs2026
    timeout-minutes: 25
    env:
      XDG_CACHE_HOME: ${{ runner.temp }}/iconv-config-bootstrap
    steps:
      - name: Checkout immutable tested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 0d2199402248c50a8e0f9c07ee4a7631e1600ff1
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tested commit and tree
        run: |
          tested_commit="$(git rev-parse HEAD)"
          tested_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$tested_commit" = 0d2199402248c50a8e0f9c07ee4a7631e1600ff1
          test "$tested_tree" = ecf5e3cb397c4e34ea032cc341dc9f6ad284acf4
          printf 'TESTED_SOURCE_COMMIT=%s\nTESTED_SOURCE_TREE=%s\n' "$tested_commit" "$tested_tree"

      - name: Select declared MSVC SDK
        uses: ./.github/actions/setup-msvc

      - name: Compare named and stdin hashes of the same pinned Windows binary
        run: |
          version="$(tr -d '\r' < .bazelversion)"
          asset="bazel-$version-windows-x86_64.exe"
          expected="$(awk -v version="$version" -v asset="$asset" \
            '$1 == version && $2 == asset { print $3 }' tools/dev/bazel-checksums.tsv)"
          cache_dir="$XDG_CACHE_HOME/oliphaunt/bazel/$version"
          mkdir -p "$cache_dir"
          binary="$cache_dir/$asset"
          curl --fail --location --silent --show-error --connect-timeout 15 --max-time 300 \
            --proto '=https' --proto-redir '=https' \
            --output "$binary" "https://releases.bazel.build/$version/release/$asset"
          named="$(sha256sum "$binary" | awk '{ print $1 }')"
          stdin="$(sha256sum < "$binary" | awk '{ print $1 }')"
          test "$stdin" = "$expected"
          test "$named" = "\\${expected}"
          printf 'EXPECTED_SHA256=%s\nNAMED_PARSER=%s\nSTDIN_PARSER=%s\n' "$expected" "$named" "$stdin"
          chmod +x "$binary"

      - name: Generate actual Windows libiconv headers and run template regression
        run: |
          bash tools/dev/bazel.sh --nohome_rc --nosystem_rc \
            --output_base="$RUNNER_TEMP/iconv-config" --host_jvm_args=-Xmx3g \
            test //build_defs/extensions/postgis:iconv_config \
            //build_defs/extensions/postgis:configure_headers_test -c opt \
            --platforms=//build_defs/host:native_windows_x64 \
            --host_platform=//build_defs/host:native_windows_x64 --jobs=2 --local_test_jobs=1 \
            --lockfile_mode=error --repository_cache= --disk_cache= --test_output=all
