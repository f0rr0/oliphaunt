name: Corrected Windows PostGIS DLL link diagnostic

on:
  push:
    branches: [f0rr0/diagnostic-swift-smoke-2de1]

permissions:
  contents: read

concurrency:
  group: windows-postgis-link-control-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  postgis_links:
    name: Link both corrected PostGIS modules and check prepared sources
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - name: Checkout corrected source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 1dd502586c9612e89df672ae6710f021d8a3a9a4
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pinned Bun
        uses: ./.github/actions/setup-bun

      - name: Select declared MSVC SDK
        uses: ./.github/actions/setup-msvc

      - name: Link both corrected PostGIS modules and verify their source and action contracts
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/windows-postgis-link-bootstrap
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 1dd502586c9612e89df672ae6710f021d8a3a9a4
          test "$(git rev-parse 'HEAD^{tree}')" = a174b240be2c7245e1871a5b8cef2de1d3bffdcc
          diag="$RUNNER_TEMP/windows-postgis-corrected-link-diagnostic"
          mkdir -p "$diag"
          printf 'GREEN_SOURCE_COMMIT=1dd502586c9612e89df672ae6710f021d8a3a9a4\nGREEN_SOURCE_TREE=a174b240be2c7245e1871a5b8cef2de1d3bffdcc\n' | tee "$diag/green-source.txt"
          bazel=(bash tools/dev/bazel.sh --nohome_rc --nosystem_rc
            --output_base="$RUNNER_TEMP/windows-postgis-link-check" --host_jvm_args=-Xmx3g)
          config=(-c opt --platforms=//build_defs/host:native_windows_x64
            --host_platform=//build_defs/host:native_windows_x64 --jobs=2
            --lockfile_mode=error --repository_cache= --disk_cache=)
          targets=(//src/extensions/external/postgis:postgis_server.dll
            //src/extensions/external/postgis:postgis_embedded.dll)
          "${bazel[@]}" test "${targets[@]}" \
            //build_defs/extensions:postgis_server_windows_link_test \
            //build_defs/extensions:postgis_embedded_windows_link_test \
            //build_defs/extensions/postgis:postgis_windows_sources_test \
            "${config[@]}" --keep_going --nocache_test_results --test_output=errors \
            > "$diag/green.log" 2>&1
          "${bazel[@]}" cquery "set(${targets[*]})" "${config[@]}" --output=files \
            > "$diag/green-files.txt" 2> "$diag/green-query.log"
          "${bazel[@]}" info execution_root "${config[@]}" \
            > "$diag/execution-root.txt" 2> "$diag/info.log"
          execution_root="$(tr -d '\r' < "$diag/execution-root.txt")"
          count=0
          while IFS= read -r relative; do
            relative="${relative%$'\r'}"
            case "$relative" in
              */postgis_server.dll|*/postgis_embedded.dll) ;;
              *) exit 1 ;;
            esac
            dll="$execution_root/$relative"
            test -f "$dll" && test -s "$dll"
            test "$(head -c 2 "$dll")" = MZ
            printf '%s  %s\n' "$(sha256sum < "$dll" | cut -d ' ' -f 1)" "$relative" | tee -a "$diag/green-dlls.txt"
            count=$((count + 1))
          done < "$diag/green-files.txt"
          test "$count" -eq 2
          printf 'GREEN_POSTGIS_DLLS=2\nGREEN_ACTION_CONTRACT_TESTS=passed\nGREEN_PREPARED_SOURCE_TEST=passed\n'
          tail -n 12 "$diag/green.log"

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-postgis-corrected-link-diagnostic
          path: ${{ runner.temp }}/windows-postgis-corrected-link-diagnostic
          if-no-files-found: warn
          retention-days: 7
