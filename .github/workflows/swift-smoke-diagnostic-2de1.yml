name: Native macOS Swift discoverer diagnostic

on:
  push:
    branches: [f0rr0/diagnostic-swift-smoke-2de1]

permissions:
  contents: read

concurrency:
  group: swift-compiler-smoke-${{ github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Link the real Swift discoverer with the declared native toolchain
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - name: Checkout immutable tested source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 98590ee7baf01b6aa7fd766933393369c042b6b9
          fetch-depth: 1
          persist-credentials: false

      - name: Verify tested commit and tree
        run: |
          tested_commit="$(git rev-parse HEAD)"
          tested_tree="$(git rev-parse 'HEAD^{tree}')"
          test "$tested_commit" = 98590ee7baf01b6aa7fd766933393369c042b6b9
          test "$tested_tree" = adf289054e0f18009a248c3cdf8c7a06f3bfe707
          printf 'TESTED_SOURCE_COMMIT=%s\nTESTED_SOURCE_TREE=%s\n' "$tested_commit" "$tested_tree"

      - name: Select declared Apple SDK
        uses: ./.github/actions/setup-apple
        with:
          install-build-dependencies: "false"

      - name: Build the upstream discoverer under the native macOS profile
        env:
          XDG_CACHE_HOME: ${{ runner.temp }}/swift-native-bootstrap
        run: |
          bash tools/dev/bazel.sh --nohome_rc --nosystem_rc \
            --output_base="$RUNNER_TEMP/swift-native" --host_jvm_args=-Xmx3g \
            build @rules_swift//tools/test_discoverer:test_discoverer -c opt \
            --config=macos-sandbox \
            --platforms=//build_defs/host:native_macos_arm64 \
            --host_platform=//build_defs/host:native_macos_arm64 --jobs=1 \
            --lockfile_mode=error --repository_cache= --disk_cache= \
            --toolchain_resolution_debug='.*rules_swift.*toolchain_type'
