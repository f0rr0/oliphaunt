name: PGlite recursion qualification
on:
  push:
    branches: [f0rr0/windows-recursion-qualification-20261008]
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  recursion:
    name: PGlite recursion (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025-vs2026
            target: windows-x64-msvc
          - os: ubuntu-24.04
            target: linux-x64-gnu
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-node-runtime
      - name: Verify published PGlite package and run isolated cases
        run: |
          npm pack @electric-sql/pglite@0.5.8 --ignore-scripts --silent
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { readFileSync } from 'node:fs';
          assert.equal(createHash('sha512').update(readFileSync('electric-sql-pglite-0.5.8.tgz')).digest('base64'), 'n9tsbUOhwx2epK1V0ZG9Ar4SHWUju04dhmzZXiSBXwBoleOvIfals33NAaWgagQVAL4Rbvx/Ptsu3P+pA09f6Q==');
          NODE
          mkdir -p diagnostic-installed/pglite
          tar -xzf electric-sql-pglite-0.5.8.tgz -C diagnostic-installed/pglite
          PGLITE_RECURSION=1 node diagnostics/deep-recursion.mjs diagnostic-installed/pglite/package/dist/index.js - diagnostic-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: ${{ !cancelled() }}
        with:
          name: pglite-deep-recursion-${{ matrix.target }}
          path: |
            diagnostic-results/*.json
            diagnostic-results/*.log
            diagnostic-results/*/result.json
            diagnostic-results/*/events.jsonl
          include-hidden-files: true
          if-no-files-found: error
