name: Windows SQLite generator diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-generator:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Checkout isolated diagnostic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up verified Node.js and Bun
        uses: ./.github/actions/setup-node-bun

      - name: Select declared MSVC SDK
        uses: ./.github/actions/setup-msvc

      - name: Compare strict SQLite launch and scoped default shell environment
        shell: bash
        run: bun --no-env-file --no-install tools/ci/windows-sqlite-generator-diagnostic.mts
