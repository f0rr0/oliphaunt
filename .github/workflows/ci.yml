name: pgTAP Windows Git checkout diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pgtap-checkout:
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up verified Node.js and Bun
        uses: ./.github/actions/setup-node-bun

      - name: Compare stock Git checkout with qualified pgTAP bytes
        shell: bash
        run: bun --no-env-file --no-install tools/ci/windows-pgtap-git-diagnostic.mts
