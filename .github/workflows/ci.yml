name: Windows query runfiles diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

defaults:
  run:
    shell: bash

jobs:
  query-runfiles:
    runs-on: windows-2025-vs2026
    timeout-minutes: 20
    steps:
      - name: Checkout diagnostic source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Install repository pinned Node.js and Bun
        id: runtimes
        env:
          OLIPHAUNT_NODE_RUNTIME_CACHE_ROOT: ${{ runner.temp }}/oliphaunt-node-runtime
          OLIPHAUNT_PINNED_TOOL_CACHE_ROOT: ${{ runner.temp }}/oliphaunt-pinned-tools
        run: |
          node_binary="$(bash .github/actions/setup-moon/install-pinned-node.sh)"
          bun_binary="$(bash tools/dev/install-pinned-js-runtime.sh bun)"
          printf 'node=%s\nbun=%s\n' "$node_binary" "$bun_binary" >> "$GITHUB_OUTPUT"

      - name: Select declared MSVC SDK
        uses: ./.github/actions/setup-msvc

      - name: Exercise only the query source consumer
        id: consumer
        continue-on-error: true
        run: |
          profile=//build_defs/host:native_windows_x64
          bash tools/dev/bazel.sh --output_base="$RUNNER_TEMP/b" test -c opt \
            --platforms="$profile" --host_platform="$profile" --jobs=2 \
            --test_output=errors //src/query/rust:consumer_test

      - name: Compare the same declared archive under Bun and Node.js
        if: always() && steps.runtimes.outcome == 'success'
        env:
          NODE_BINARY: ${{ steps.runtimes.outputs.node }}
          BUN_BINARY: ${{ steps.runtimes.outputs.bun }}
        run: |
          profile=//build_defs/host:native_windows_x64
          bazel=(bash tools/dev/bazel.sh --output_base="$RUNNER_TEMP/b")
          configuration=(-c opt --platforms="$profile" --host_platform="$profile" --jobs=2)
          execution_root="$("${bazel[@]}" info execution_root | tr -d '\r')"
          executable="$("${bazel[@]}" cquery "${configuration[@]}" \
            //src/query/rust:consumer_test --output=files | tr -d '\r')"
          archive="$("${bazel[@]}" cquery "${configuration[@]}" \
            //src/query/rust:crate --output=files | tr -d '\r')"
          archive_short_path="$("${bazel[@]}" cquery "${configuration[@]}" \
            //src/query/rust:crate --output=starlark \
            --starlark:expr='target.files.to_list()[0].short_path' | tr -d '\r')"
          arguments=("$execution_root" "$executable" "$archive" "$archive_short_path")
          bun_status=0
          "$BUN_BINARY" --no-env-file --no-install tools/ci/windows-query-runfiles-diagnostic.mts "${arguments[@]}" || bun_status=$?
          "$NODE_BINARY" tools/ci/windows-query-runfiles-diagnostic.mts "${arguments[@]}"
          exit "$bun_status"

      - name: Populate and rematerialize the query from an owned disk cache
        if: ${{ !cancelled() && steps.runtimes.outcome == 'success' && steps.consumer.outcome != 'skipped' }}
        env:
          NODE_BINARY: ${{ steps.runtimes.outputs.node }}
          BUN_BINARY: ${{ steps.runtimes.outputs.bun }}
        run: |
          set -euo pipefail
          profile=//build_defs/host:native_windows_x64
          bazel=(bash tools/dev/bazel.sh --output_base="$RUNNER_TEMP/b")
          configuration=(-c opt --platforms="$profile" --host_platform="$profile" --jobs=2)
          cache_root="$(cygpath -m "$RUNNER_TEMP/query-runfiles-disk-cache")"
          mkdir -p "$cache_root"
          overall=0
          for phase in populate rematerialize; do
            printf 'Query disk cache phase=%s\n' "$phase"
            "${bazel[@]}" clean
            consumer_status=0
            "${bazel[@]}" test "${configuration[@]}" --disk_cache="$cache_root" \
              --nocache_test_results --test_output=errors //src/query/rust:consumer_test || consumer_status=$?
            printf 'Query disk cache phase=%s consumer_status=%s\n' "$phase" "$consumer_status"
            if [[ "$consumer_status" != 0 ]]; then overall=1; fi
            execution_root="$("${bazel[@]}" info execution_root | tr -d '\r')"
            executable="$("${bazel[@]}" cquery "${configuration[@]}" \
              //src/query/rust:consumer_test --output=files | tr -d '\r')"
            archive="$("${bazel[@]}" cquery "${configuration[@]}" \
              //src/query/rust:crate --output=files | tr -d '\r')"
            archive_short_path="$("${bazel[@]}" cquery "${configuration[@]}" \
              //src/query/rust:crate --output=starlark \
              --starlark:expr='target.files.to_list()[0].short_path' | tr -d '\r')"
            arguments=("$execution_root" "$executable" "$archive" "$archive_short_path")
            "$BUN_BINARY" --no-env-file --no-install tools/ci/windows-query-runfiles-diagnostic.mts "${arguments[@]}" || overall=1
            "$NODE_BINARY" tools/ci/windows-query-runfiles-diagnostic.mts "${arguments[@]}" || overall=1
          done
          exit "$overall"
