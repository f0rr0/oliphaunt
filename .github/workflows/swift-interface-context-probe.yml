name: Expo Swift UIKit mechanism matrix

on:
  push:
    branches: [f0rr0/swift-interface-probe-20261022]

permissions:
  contents: read

jobs:
  expo-umbrella-mechanism:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        timeout-minutes: 2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        timeout-minutes: 2

      - uses: ./.github/actions/setup-apple
        timeout-minutes: 2
        with:
          install-build-dependencies: "false"

      - name: Observe the direct Swift UIKit import mechanisms
        timeout-minutes: 15
        shell: bash
        run: bash tools/dev/bun.sh --no-env-file tools/ci/run-expo-umbrella-mechanism-matrix.mts

      - name: Retain exact compiler observations
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: expo-umbrella-mechanism
          path: ${{ runner.temp }}/expo-umbrella-mechanism/
          if-no-files-found: error
          retention-days: 7
