name: WASIX host
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
      job-targets:
        required: true
        type: string
      napi-targets:
        required: true
        type: string
      llvm-version:
        required: true
        type: string
      cache-save-if:
        required: true
        type: boolean
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  WASMER_LLVM_VERSION: ${{ inputs.llvm-version }}
  OLIPHAUNT_CI_JOB_TARGETS_JSON: ${{ inputs.job-targets }}
defaults:
  run:
    shell: bash
jobs:
  windows-engine:
    name: WASIX Windows engine
    if: ${{ contains(inputs.matrix, 'windows-x64-msvc') }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-moon
        with:
          cache-partition: wasix-windows-engine
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ inputs.cache-save-if }}
          tools: cargo-nextest@0.9.137
      - uses: ./.github/actions/setup-msvc
      - name: Produce and test pinned Windows engine
        run: .github/scripts/run-moon-targets.sh liboliphaunt-wasix:engine-test
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: liboliphaunt-wasix-windows-engine
          include-hidden-files: true
          path: |
            target/oliphaunt-wasix/engine/windows-x64-msvc/oliphaunt_wee8.dll
            target/oliphaunt-wasix/engine/windows-x64-msvc/cache-producer.exe
            target/oliphaunt-wasix/engine/windows-x64-msvc/source.json
            target/oliphaunt-wasix/engine/windows-x64-msvc/LICENSE.v8
            src/wasix/runtime/engine/crates/*/upstream/**
            src/wasix/runtime/engine/crates/wasmer/prebuilt/embedded_bindings.rs
          if-no-files-found: error
  windows-caches:
    name: WASIX Windows baseline caches
    needs: windows-engine
    if: ${{ contains(inputs.matrix, 'windows-x64-msvc') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-moon
        with:
          cache-partition: wasix-windows-caches
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ inputs.cache-save-if }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: liboliphaunt-wasix-windows-engine
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: liboliphaunt-wasix-runtime-portable
          path: .
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'postgres-tools-wasix:build-aot') }}
        with:
          name: postgres-tools-wasix-compiler-output
          path: target/postgres-tools/wasix/assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        if: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'extension-artifacts-wasix:build-aot') }}
        with:
          name: extensions-wasix-compiler-output
          path: target/extensions/wasix/assets
      - name: Set up CPU profile producer
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y wine64 libz-mingw-w64 qemu-user
      - name: Produce and read genuine SSE4.1 native caches
        env:
          BUILD_TOOLS: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'postgres-tools-wasix:build-aot') }}
          BUILD_EXTENSIONS: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'extension-artifacts-wasix:build-aot') }}
        run: |
          products=(runtime)
          if [ "$BUILD_TOOLS" = true ]; then products+=(tools); fi
          if [ "$BUILD_EXTENSIONS" = true ]; then products+=(extensions); fi
          bun src/wasix/runtime/engine/windows/build-caches.mts "${products[@]}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: liboliphaunt-wasix-windows-baseline-caches
          path: target/oliphaunt-wasix/engine/windows-x64-msvc/cache/sse41
          if-no-files-found: error
  build:
    name: WASIX host (${{ matrix.target_id }})
    runs-on: ${{ matrix.os }}
    needs: [windows-engine, windows-caches]
    if: ${{ !cancelled() }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Moon
        uses: ./.github/actions/setup-moon
        with:
          cache-partition: wasix-host-${{ matrix.target }}

      - name: Set up Rust
        uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ inputs.cache-save-if }}
          tools: ${{ runner.os == 'Windows' && 'cargo-nextest@0.9.137' || '' }}

      - name: Set up MSVC
        if: ${{ runner.os == 'Windows' }}
        uses: ./.github/actions/setup-msvc

      - name: Download same-run Windows engine
        if: ${{ runner.os == 'Windows' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: liboliphaunt-wasix-windows-engine
          path: .
      - name: Download same-run Windows baseline caches
        if: ${{ runner.os == 'Windows' }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: liboliphaunt-wasix-windows-baseline-caches
          path: target/oliphaunt-wasix/engine/windows-x64-msvc/cache/sse41
      - name: Set up macOS acquisition and smoke timeout
        if: ${{ runner.os == 'macOS' }}
        run: |
          command -v bash
          bash --version
          brew list coreutils >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install coreutils

      - name: Prepare engine source
        run: .github/scripts/run-moon-targets.sh liboliphaunt-wasix:engine-sources

      - name: Download portable WASIX build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: liboliphaunt-wasix-runtime-portable
          path: .

      - name: Download portable WASIX tools compiler outputs
        if: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'postgres-tools-wasix:build-aot') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: postgres-tools-wasix-compiler-output
          path: target/postgres-tools/wasix/assets

      - name: Download portable WASIX extension compiler outputs
        if: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'extension-artifacts-wasix:build-aot') }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: extensions-wasix-compiler-output
          path: target/extensions/wasix/assets

      - name: Install Wasmer LLVM 22.1 for AOT generation
        if: ${{ runner.os != 'Windows' }}
        uses: ./.github/actions/setup-wasmer-llvm
        with:
          cache-save-if: ${{ inputs.cache-save-if }}
          url: ${{ matrix.llvm_url }}
          sha256: ${{ matrix.llvm_sha256 }}
          bytes: ${{ matrix.llvm_bytes }}
          version: ${{ env.WASMER_LLVM_VERSION }}

      - name: Build, validate, and smoke target AOT artifacts
        env:
          AOT_TARGET: ${{ matrix.target }}
          OLIPHAUNT_MOON_TRANSFERRED_DEPS_JSON: '["liboliphaunt-wasix:runtime-portable", "postgres-tools-wasix:compiler-output", "extension-artifacts-wasix:compiler-output", "liboliphaunt-wasix:engine-build"]'
        run: .github/scripts/run-planned-moon-job.sh liboliphaunt-wasix-aot

      - name: Upload target PostgreSQL WASIX tools
        if: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'postgres-tools-wasix:package-aot') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgres-tools-wasix-release-assets-${{ matrix.target_id }}
          path: target/postgres-tools/wasix/release-assets/*-aot-${{ matrix.target_id }}.tar.gz
          if-no-files-found: error

      - name: Stage target AOT artifact envelope
        if: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'liboliphaunt-wasix:runtime-aot') }}
        env:
          AOT_TARGET: ${{ matrix.target }}
        run: |
          target="${AOT_TARGET:?AOT_TARGET is required}"
          source="target/oliphaunt-wasix/aot/$target"
          if [ ! -d "$source" ]; then
            echo "missing AOT output directory: $source" >&2
            exit 1
          fi
          upload="target/oliphaunt-wasix/aot-upload"
          rm -rf "$upload"
          mkdir -p "$upload/files"
          cp -R "$source/." "$upload/files/"
          printf '%s\n' "$target" >"$upload/target-triple.txt"

      - name: Upload target artifacts
        if: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'liboliphaunt-wasix:runtime-aot') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: liboliphaunt-wasix-runtime-aot-${{ matrix.target_id }}
          path: |
            target/oliphaunt-wasix/aot-upload/**
          if-no-files-found: error

      - name: Upload target WASIX tools compiler outputs
        if: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'postgres-tools-wasix:build-aot') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: postgres-tools-wasix-aot-${{ matrix.target_id }}
          path: target/postgres-tools/wasix/aot
          if-no-files-found: error

      - name: Upload target extension AOT artifacts
        if: ${{ contains(fromJson(inputs.job-targets)['liboliphaunt-wasix-aot'], 'extension-artifacts-wasix:build-aot') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: liboliphaunt-wasix-extension-aot-${{ matrix.target_id }}
          path: target/extensions/wasix/aot-artifacts
          if-no-files-found: error

      - name: Download same-run WASIX exact-extension outputs
        if: ${{ contains(fromJson(inputs.napi-targets), matrix.target_id) }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: liboliphaunt-wasix-extension-artifacts-*
          path: target/extensions/wasix/release-assets
          merge-multiple: true

      - name: Build WASIX Node-API release assets
        if: ${{ contains(fromJson(inputs.napi-targets), matrix.target_id) }}
        shell: bash
        env:
          OLIPHAUNT_ARTIFACT_CRATE_REQUIRE_PAYLOAD: "1"
          OLIPHAUNT_ICU_DATA_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/wasix-build/work/icu-wasix/share/icu
          OLIPHAUNT_WASM_GENERATED_AOT_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/aot
          OLIPHAUNT_WASIX_EXTENSION_ARTIFACT_ROOT: ${{ github.workspace }}/target/extension-artifacts
          OLIPHAUNT_WASIX_GENERATED_ASSETS_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/assets
          OLIPHAUNT_WASIX_NAPI_ARTIFACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          OLIPHAUNT_MOON_TRANSFERRED_DEPS_JSON: '["liboliphaunt-wasix:engine-build", "extension-artifacts-wasix:build-target", "extension-artifacts-wasix:build-aot", "liboliphaunt-wasix:runtime-aot"]'
        run: .github/scripts/run-planned-moon-job.sh wasix-napi

      - name: Upload WASIX Node-API release assets
        if: ${{ contains(fromJson(inputs.napi-targets), matrix.target_id) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oliphaunt-wasix-napi-release-assets-${{ matrix.target_id }}
          path: target/oliphaunt-wasix-napi/release-assets
          if-no-files-found: error

      - name: Upload WASIX Node-API optional npm package
        if: ${{ contains(fromJson(inputs.napi-targets), matrix.target_id) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oliphaunt-wasix-napi-npm-package-${{ matrix.target_id }}
          path: target/oliphaunt-wasix-napi/npm-packages/*.tgz
          if-no-files-found: error
