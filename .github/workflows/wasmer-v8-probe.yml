name: Wasmer V8 DLL audit control
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: wasmer-v8-dll-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  dll-audit:
    name: Audit retained DLL (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: '11331153142'
          - os: windows-2025-vs2026
            artifact: '11331067461'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-msvc
        if: matrix.os == 'windows-2025-vs2026'
      - name: Set up research-only Visual Studio 2022 host
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
          vsversion: '2022'
      - name: Download exact retained producer DLL
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          run-id: '37277151739'
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          path: dll-audit-input
          merge-multiple: true
      - name: Verify retained hashes and fixed Windows environment lookup
        shell: bash
        run: python tools/experiments/wasmer-v8/dll_artifact_audit.py dll-audit-input
      - name: Retain native audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v8-dll-native-audit-${{ matrix.os }}
          path: |
            dll-audit-input/native-audit-*.log
            dll-audit-input/native-audit-receipt.json
          if-no-files-found: error
          retention-days: 90
