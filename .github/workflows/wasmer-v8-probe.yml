name: Windows V8 genuine cache pair and owned trap control
'on':
  workflow_dispatch:
    inputs:
      scope:
        description: Diagnostic scope
        type: choice
        default: errors-and-cpu
        options:
        - errors-and-cpu
        - cpu-only
        - errors-only
        - catalog-only
        - interrupt-only
        - catalog-strict-only
        - automatic-only
        - automatic-and-catalog
        - family-only
        - fallible-and-catalog
        - fallible-family-only
permissions:
  contents: read
  actions: read
jobs:
  expanded-ownership:
    if: ${{ inputs.scope == 'errors-only' || inputs.scope == 'errors-and-cpu' }}
    name: Owned errors, automatic delivery and SDK (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runner:
        - windows-2022
        - windows-2025-vs2026
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-rust-tools
      with:
        toolchain: 1.96.0
    - name: Set up research-only Visual Studio 2022 host
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: x64
        vsversion: '2022'
      if: ${{ matrix.runner == 'windows-2022' }}
    - name: Set up current MSVC host
      if: ${{ matrix.runner == 'windows-2025-vs2026' }}
      uses: ./.github/actions/setup-msvc
    - name: Pin research linker under Git Bash
      shell: pwsh
      run: '$linker = Join-Path $env:VCToolsInstallDir ''bin/HostX64/x64/link.exe''

        if (!(Test-Path -LiteralPath $linker -PathType Leaf)) { throw "missing MSVC linker $linker" }

        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 # zizmor: ignore[github-env] validated runner-owned MSVC linker path.

        '
    - name: Compile Windows V8 serializer
      run: cargo check --locked -p xtask --features aot-serializer
    - name: Download immutable diagnostic portable runtime
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37225721762'
        artifact-ids: '11312707536'
        github-token: ${{ github.token }}
        path: .
        merge-multiple: true
    - name: Verify diagnostic PostgreSQL fixture identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p target/windows-v8-diagnostic

        gh api repos/f0rr0/oliphaunt/actions/artifacts/11312707536 > target/windows-v8-diagnostic/guest-artifact.json

        python tools/experiments/wasmer-v8/verify_guest.py . target/windows-v8-diagnostic

        '
    - name: Generate diagnostic Windows V8 artifacts
      run: bash src/wasix/runtime/tools/build-aot-target.sh
    - name: Download immutable diagnostic extension compiler outputs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37240991549'
        artifact-ids: '11318826010'
        github-token: ${{ github.token }}
        path: target/extensions/wasix/assets
        merge-multiple: true
    - name: Download immutable diagnostic tools compiler outputs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37240991549'
        artifact-ids: '11318277384'
        github-token: ${{ github.token }}
        path: target/postgres-tools/wasix/assets
        merge-multiple: true
    - name: Record extension and tools provenance and generate Windows AOT
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        gh api repos/f0rr0/oliphaunt/actions/artifacts/11318826010 > target/windows-v8-diagnostic/extension-artifact.json

        gh api repos/f0rr0/oliphaunt/actions/artifacts/11318277384 > target/windows-v8-diagnostic/tools-artifact.json

        cp target/extensions/wasix/assets/manifest.json target/windows-v8-diagnostic/extension-manifest.json

        cp target/postgres-tools/wasix/assets/manifest.json target/windows-v8-diagnostic/tools-manifest.json

        bash src/extensions/artifacts/wasix/tools/build-aot.sh

        bash src/wasix/postgres-tools/tools/build-aot.sh

        '
    - name: Materialize the immutable vector extension package
      env:
        OLIPHAUNT_WASIX_GENERATED_ASSETS_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/assets
        OLIPHAUNT_WASM_GENERATED_AOT_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/aot
      run: "set -euo pipefail\nOLIPHAUNT_WASIX_GENERATED_ASSET_ROOT=\"$PWD/target/extensions/wasix/assets\" \\\nOLIPHAUNT_WASIX_EXTENSION_AOT_ARTIFACT_ROOT=\"$PWD/target/extensions/wasix/aot-artifacts\" \\\n  bash tools/dev/bun.sh src/extensions/artifacts/packages/tools/build-extension-ci-artifacts.mts \\\n    --output-root target/windows-v8-ownership/vector-artifacts --family wasix --require-wasix oliphaunt-extension-vector\n"
    - name: Apply the pinned private DLL ownership control
      run: python tools/experiments/wasmer-v8/expanded-ownership/prepare-dll.py target/windows-v8-ownership/control
    - name: Apply the scoped error ownership control
      run: 'git apply --unsafe-paths --directory="$PWD/target/windows-v8-ownership/control/engine/dependency/wasmer-7.5.0" tools/experiments/wasmer-v8/expanded-ownership/trap-ownership.diff

        cp tools/experiments/wasmer-v8/expanded-ownership/trap-ownership.rs src/wasix/sdks/rust/tests/research_v8_trap_ownership.rs

        python -c ''from pathlib import Path; p=Path("src/wasix/sdks/rust/tests/research_v8_trap_ownership.rs"); p.write_text(p.read_text().replace("fn main() {", "#[test]\nfn trap_ownership() {"))'''
    - name: Apply callback panic containment and stage binary fixtures
      run: 'git apply --unsafe-paths --directory="$PWD/target/windows-v8-ownership/control/engine/dependency/wasmer-7.5.0" tools/experiments/wasmer-v8/expanded-ownership/callback-panic.diff

        cp tools/experiments/wasmer-v8/expanded-ownership/*.wasm src/wasix/sdks/rust/tests/

        cp tools/experiments/wasmer-v8/expanded-ownership/callback-panic.rs src/wasix/sdks/rust/tests/research_v8_callback_panic.rs

        python -c ''from pathlib import Path; p=Path("src/wasix/sdks/rust/tests/research_v8_callback_panic.rs"); p.write_text(p.read_text().replace("fn main() {", "#[test]\nfn callback_panic_containment() {"))''

        '
    - name: Embed the private engine and generate C function dispatch
      run: python tools/experiments/wasmer-v8/expanded-ownership/embed-dll.py target/windows-v8-ownership/control
    - name: Test owned errors, automatic delivery and actual SDK
      env:
        OLIPHAUNT_RESEARCH_LIFECYCLE_CYCLES: '100'
        OLIPHAUNT_WASIX_GENERATED_ASSETS_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/assets
        OLIPHAUNT_WASM_GENERATED_AOT_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/aot
      run: 'set -euo pipefail

        export OLIPHAUNT_WASIX_EXTENSION_ARTIFACT_ROOT="$PWD/target/windows-v8-ownership/vector-artifacts"

        python tools/experiments/wasmer-v8/expanded-ownership/embedded-check.py target/windows-v8-ownership/control

        cargo test --locked -p oliphaunt-wasix --no-default-features --test research_v8_trap_ownership -- --nocapture --test-threads=1

        cargo test --locked -p oliphaunt-wasix --no-default-features --test research_v8_callback_panic -- --nocapture --test-threads=1'
    - name: Diagnose native ownership failure
      if: ${{ failure() }}
      run: python tools/experiments/wasmer-v8/expanded-ownership/debug-failure.py target/windows-v8-ownership/control
    - name: Retain ownership receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-v8-dll-expanded-ownership-${{ matrix.runner }}
        path: 'target/windows-v8-ownership/control

          target/windows-v8-diagnostic/guest-artifact.json

          target/windows-v8-diagnostic/extension-manifest.json

          target/windows-v8-diagnostic/tools-manifest.json

          !target/windows-v8-ownership/control/engine/dependency'
        if-no-files-found: warn
        retention-days: 90
  wine-producer:
    if: ${{ inputs.scope == 'cpu-only' || inputs.scope == 'errors-and-cpu' }}
    name: Genuine Windows cache on emulated SSE4.1 CPU
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Install producer linker
      run: 'sudo apt-get update

        sudo apt-get install -y lld-18'
    - name: Download immutable native engine
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37301714833'
        artifact-ids: '11343090816'
        github-token: ${{ github.token }}
        path: target/frozen-engine
        merge-multiple: true
    - name: Download immutable portable guest
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37225721762'
        artifact-ids: '11312707536'
        github-token: ${{ github.token }}
        path: target/frozen-portable
        merge-multiple: true
    - name: Verify immutable guest
      run: 'mkdir -p target/wine-guest

        gh api repos/f0rr0/oliphaunt/actions/artifacts/11312707536 > target/wine-guest/guest-artifact.json

        python3 tools/experiments/wasmer-v8/verify_guest.py target/frozen-portable target/wine-guest'
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Download immutable genuine native CPU profile
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37353127348'
        artifact-ids: '11363551962'
        github-token: ${{ github.token }}
        path: target/frozen-native-cpu-profile
        merge-multiple: true
    - name: Produce genuine Windows cache and fresh emulated reader
      run: python3 tools/experiments/wasmer-v8/expanded-ownership/wine-producer.py target/wine-cache target/frozen-engine target/wine-guest/postgres.wasm target/frozen-native-cpu-profile
    - name: Retain genuine profile evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-genuine-low-cpu-cache
        path: 'target/wine-cache/*.log

          target/wine-cache/wine-producer-receipt.json

          target/wine-cache/cache-probe.exe

          target/wine-cache/wine-producer.exe

          target/wine-cache/atomic-wait.exe

          target/wine-cache/wine-postgres.cache

          target/wine-cache/guest.wasm'
        if-no-files-found: warn
        retention-days: 90
  native-cache-pair:
    name: Native compatible cache selection (${{ matrix.runner }})
    needs:
    - wine-producer
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner:
        - windows-2022
        - windows-2025-vs2026
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - name: Download exact native engine
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37301714833'
        artifact-ids: '11343090816'
        github-token: ${{ github.token }}
        path: target/frozen-engine
        merge-multiple: true
    - name: Stage frozen engine
      run: python -c 'from pathlib import Path; import shutil; source=next(Path("target/frozen-engine").rglob("engine/oliphaunt_wee8.dll")).parent; target=Path("target/windows-v8-ownership/control/engine"); shutil.copytree(source,target)'
    - name: Download same-run genuine CPU profile
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: windows-genuine-low-cpu-cache
        path: target/wine-cache
    - name: Fresh native readers choose a compatible genuine profile
      run: python tools/experiments/wasmer-v8/expanded-ownership/cache-pair-check.py target/windows-v8-ownership/control target/wine-cache
    - name: Retain native profile receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: native-cache-pair-${{ matrix.runner }}
        path: target/windows-v8-ownership/control/cache-pair
        if-no-files-found: warn
        retention-days: 90
  catalog-full:
    if: ${{ inputs.scope == 'catalog-only' || inputs.scope == 'catalog-strict-only' || inputs.scope == 'automatic-and-catalog' || inputs.scope == 'fallible-and-catalog' }}
    name: Full native Windows catalog, server and tools
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-rust-tools
      with:
        toolchain: 1.96.0
    - name: Set up current MSVC host
      uses: ./.github/actions/setup-msvc
    - name: Pin research linker under Git Bash
      shell: pwsh
      run: '$linker = Join-Path $env:VCToolsInstallDir ''bin/HostX64/x64/link.exe''

        if (!(Test-Path -LiteralPath $linker -PathType Leaf)) { throw "missing MSVC linker $linker" }

        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 # zizmor: ignore[github-env] validated runner-owned MSVC linker path.

        '
    - name: Compile Windows V8 serializer
      run: cargo check --locked -p xtask --features aot-serializer
    - name: Download immutable diagnostic portable runtime
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37225721762'
        artifact-ids: '11312707536'
        github-token: ${{ github.token }}
        path: .
        merge-multiple: true
    - name: Verify diagnostic PostgreSQL fixture identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p target/windows-v8-diagnostic

        gh api repos/f0rr0/oliphaunt/actions/artifacts/11312707536 > target/windows-v8-diagnostic/guest-artifact.json

        python tools/experiments/wasmer-v8/verify_guest.py . target/windows-v8-diagnostic

        '
    - name: Generate diagnostic Windows V8 artifacts
      run: bash src/wasix/runtime/tools/build-aot-target.sh
    - name: Download immutable diagnostic extension compiler outputs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37240991549'
        artifact-ids: '11318826010'
        github-token: ${{ github.token }}
        path: target/extensions/wasix/assets
        merge-multiple: true
    - name: Download immutable diagnostic tools compiler outputs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37240991549'
        artifact-ids: '11318277384'
        github-token: ${{ github.token }}
        path: target/postgres-tools/wasix/assets
        merge-multiple: true
    - name: Record extension and tools provenance and generate Windows AOT
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        gh api repos/f0rr0/oliphaunt/actions/artifacts/11318826010 > target/windows-v8-diagnostic/extension-artifact.json

        gh api repos/f0rr0/oliphaunt/actions/artifacts/11318277384 > target/windows-v8-diagnostic/tools-artifact.json

        cp target/extensions/wasix/assets/manifest.json target/windows-v8-diagnostic/extension-manifest.json

        cp target/postgres-tools/wasix/assets/manifest.json target/windows-v8-diagnostic/tools-manifest.json

        bash src/extensions/artifacts/wasix/tools/build-aot.sh

        bash src/wasix/postgres-tools/tools/build-aot.sh

        '
    - name: Apply the pinned private DLL ownership control
      run: python tools/experiments/wasmer-v8/expanded-ownership/prepare-dll.py target/windows-v8-ownership/control
    - name: Apply the scoped error ownership control
      run: 'git apply --unsafe-paths --directory="$PWD/target/windows-v8-ownership/control/engine/dependency/wasmer-7.5.0" tools/experiments/wasmer-v8/expanded-ownership/trap-ownership.diff

        cp tools/experiments/wasmer-v8/expanded-ownership/trap-ownership.rs src/wasix/sdks/rust/tests/research_v8_trap_ownership.rs

        python -c ''from pathlib import Path; p=Path("src/wasix/sdks/rust/tests/research_v8_trap_ownership.rs"); p.write_text(p.read_text().replace("fn main() {", "#[test]\nfn trap_ownership() {"))'''
    - name: Apply callback panic containment and stage binary fixtures
      run: 'git apply --unsafe-paths --directory="$PWD/target/windows-v8-ownership/control/engine/dependency/wasmer-7.5.0" tools/experiments/wasmer-v8/expanded-ownership/callback-panic.diff

        cp tools/experiments/wasmer-v8/expanded-ownership/*.wasm src/wasix/sdks/rust/tests/

        cp tools/experiments/wasmer-v8/expanded-ownership/callback-panic.rs src/wasix/sdks/rust/tests/research_v8_callback_panic.rs

        python -c ''from pathlib import Path; p=Path("src/wasix/sdks/rust/tests/research_v8_callback_panic.rs"); p.write_text(p.read_text().replace("fn main() {", "#[test]\nfn callback_panic_containment() {"))''

        '
    - name: Apply automatic Store and memory lifetime hooks
      if: ${{ inputs.scope == 'automatic-and-catalog' || inputs.scope == 'fallible-and-catalog' }}
      run: python tools/experiments/wasmer-v8/expanded-ownership/automatic-interrupt-prepare.py target/windows-v8-ownership/control
    - name: Propagate cancellation attachment errors through WASIX
      if: ${{ inputs.scope == 'fallible-and-catalog' }}
      run: python tools/experiments/wasmer-v8/expanded-ownership/fallible-attachment.py target/windows-v8-ownership/control
    - name: Embed the private engine and generate C function dispatch
      run: python tools/experiments/wasmer-v8/expanded-ownership/embed-dll.py target/windows-v8-ownership/control
    - name: Require cached WASIX modules and block consumer guest compilation
      if: ${{ inputs.scope == 'catalog-strict-only' || inputs.scope == 'automatic-and-catalog' || inputs.scope == 'fallible-and-catalog' }}
      run: 'python tools/experiments/wasmer-v8/expanded-ownership/cache-only-prepare.py target/windows-v8-ownership/control

        cp tools/experiments/wasmer-v8/expanded-ownership/cache-only.rs src/wasix/sdks/rust/tests/research_v8_cache_only.rs

        python -c ''from pathlib import Path; p=Path("src/wasix/sdks/rust/tests/research_v8_cache_only.rs"); p.write_text(p.read_text().replace("fn main() {", "#[test]\nfn cache_only_policy() {"))''

        cargo test --locked -p oliphaunt-wasix --no-default-features --test research_v8_cache_only -- --nocapture --test-threads=1

        '
      env:
        OLIPHAUNT_WASIX_GENERATED_ASSETS_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/assets
        OLIPHAUNT_WASM_GENERATED_AOT_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/aot
    - name: Qualify the full native Windows catalog and server
      env:
        CI_HEAD_SHA: ${{ github.sha }}
      run: python tools/experiments/wasmer-v8/expanded-ownership/catalog-check.py target/windows-v8-ownership/control
    - name: Diagnose native ownership failure
      if: ${{ failure() }}
      run: python tools/experiments/wasmer-v8/expanded-ownership/debug-failure.py target/windows-v8-ownership/control
    - name: Retain ownership receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-v8-full-catalog
        path: 'target/windows-v8-ownership/control

          target/windows-v8-diagnostic/guest-artifact.json

          target/windows-v8-diagnostic/extension-manifest.json

          target/windows-v8-diagnostic/tools-manifest.json

          !target/windows-v8-ownership/control/engine/dependency

          !target/windows-v8-ownership/control/cache-only-dependency'
        if-no-files-found: warn
        retention-days: 90
  interrupt-native:
    if: ${{ inputs.scope == 'interrupt-only' }}
    name: Native WASIX signal and shared-memory registry (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner:
        - windows-2022
        - windows-2025-vs2026
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-rust-tools
      with:
        toolchain: 1.96.0
    - name: Set up research-only Visual Studio 2022 host
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: x64
        vsversion: '2022'
      if: ${{ matrix.runner == 'windows-2022' }}
    - name: Set up current MSVC host
      if: ${{ matrix.runner == 'windows-2025-vs2026' }}
      uses: ./.github/actions/setup-msvc
    - name: Pin research linker under Git Bash
      shell: pwsh
      run: '$linker = Join-Path $env:VCToolsInstallDir ''bin/HostX64/x64/link.exe''

        if (!(Test-Path -LiteralPath $linker -PathType Leaf)) { throw "missing MSVC linker $linker" }

        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 # zizmor: ignore[github-env] validated runner-owned MSVC linker path.

        '
    - name: Compile Windows V8 serializer
      run: cargo check --locked -p xtask --features aot-serializer
    - name: Download immutable diagnostic portable runtime
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37225721762'
        artifact-ids: '11312707536'
        github-token: ${{ github.token }}
        path: .
        merge-multiple: true
    - name: Verify diagnostic PostgreSQL fixture identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p target/windows-v8-diagnostic

        gh api repos/f0rr0/oliphaunt/actions/artifacts/11312707536 > target/windows-v8-diagnostic/guest-artifact.json

        python tools/experiments/wasmer-v8/verify_guest.py . target/windows-v8-diagnostic

        '
    - name: Generate diagnostic Windows V8 artifacts
      run: bash src/wasix/runtime/tools/build-aot-target.sh
    - name: Download immutable diagnostic extension compiler outputs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37240991549'
        artifact-ids: '11318826010'
        github-token: ${{ github.token }}
        path: target/extensions/wasix/assets
        merge-multiple: true
    - name: Apply the pinned private DLL ownership control
      run: python tools/experiments/wasmer-v8/expanded-ownership/prepare-dll.py target/windows-v8-ownership/control
    - name: Apply the scoped error ownership control
      run: 'git apply --unsafe-paths --directory="$PWD/target/windows-v8-ownership/control/engine/dependency/wasmer-7.5.0" tools/experiments/wasmer-v8/expanded-ownership/trap-ownership.diff

        cp tools/experiments/wasmer-v8/expanded-ownership/trap-ownership.rs src/wasix/sdks/rust/tests/research_v8_trap_ownership.rs

        python -c ''from pathlib import Path; p=Path("src/wasix/sdks/rust/tests/research_v8_trap_ownership.rs"); p.write_text(p.read_text().replace("fn main() {", "#[test]\nfn trap_ownership() {"))'''
    - name: Apply callback panic containment and stage binary fixtures
      run: 'git apply --unsafe-paths --directory="$PWD/target/windows-v8-ownership/control/engine/dependency/wasmer-7.5.0" tools/experiments/wasmer-v8/expanded-ownership/callback-panic.diff

        cp tools/experiments/wasmer-v8/expanded-ownership/*.wasm src/wasix/sdks/rust/tests/

        cp tools/experiments/wasmer-v8/expanded-ownership/callback-panic.rs src/wasix/sdks/rust/tests/research_v8_callback_panic.rs

        python -c ''from pathlib import Path; p=Path("src/wasix/sdks/rust/tests/research_v8_callback_panic.rs"); p.write_text(p.read_text().replace("fn main() {", "#[test]\nfn callback_panic_containment() {"))''

        '
    - name: Stage the private signal registry control
      run: 'git apply --unsafe-paths --directory="$PWD/target/windows-v8-ownership/control/engine/dependency/wasmer-7.5.0" tools/experiments/wasmer-v8/expanded-ownership/atomic-wasix.diff

        cp tools/experiments/wasmer-v8/expanded-ownership/atomic-wasix.rs src/wasix/sdks/rust/tests/research_v8_atomic_wasix.rs

        python -c ''from pathlib import Path; p=Path("src/wasix/sdks/rust/tests/research_v8_atomic_wasix.rs"); p.write_text(p.read_text().replace("fn main() {", "#[test]\nfn atomic_wasix_registry() {"))''

        '
    - name: Embed the private engine and generate C function dispatch
      run: python tools/experiments/wasmer-v8/expanded-ownership/embed-dll.py target/windows-v8-ownership/control
    - name: Exercise the real WASIX kill path and multi-isolate cleanup
      run: python tools/experiments/wasmer-v8/expanded-ownership/atomic-wasix-check.py target/windows-v8-ownership/control
      env:
        OLIPHAUNT_RESEARCH_LIFECYCLE_CYCLES: '100'
        OLIPHAUNT_WASIX_GENERATED_ASSETS_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/assets
        OLIPHAUNT_WASM_GENERATED_AOT_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/aot
    - name: Retain signal registry receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: native-wasix-signal-registry-${{ matrix.runner }}
        path: 'target/windows-v8-ownership/control

          !target/windows-v8-ownership/control/engine/dependency'
        if-no-files-found: warn
        retention-days: 90
  automatic-store-interruption:
    if: ${{ inputs.scope == 'automatic-only' || inputs.scope == 'automatic-and-catalog' || inputs.scope == 'family-only' || (inputs.scope == 'fallible-and-catalog' || inputs.scope == 'fallible-family-only') }}
    name: Automatic Store interruption and teardown (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        runner:
        - windows-2022
        - windows-2025-vs2026
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup-rust-tools
      with:
        toolchain: 1.96.0
    - name: Set up verified Bun for generated package envelopes
      if: ${{ inputs.scope == 'family-only' || (inputs.scope == 'fallible-and-catalog' || inputs.scope == 'fallible-family-only') }}
      uses: ./.github/actions/setup-bun
    - name: Set up research-only Visual Studio 2022 host
      uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      with:
        arch: x64
        vsversion: '2022'
      if: ${{ matrix.runner == 'windows-2022' }}
    - name: Set up current MSVC host
      if: ${{ matrix.runner == 'windows-2025-vs2026' }}
      uses: ./.github/actions/setup-msvc
    - name: Pin research linker under Git Bash
      shell: pwsh
      run: '$linker = Join-Path $env:VCToolsInstallDir ''bin/HostX64/x64/link.exe''

        if (!(Test-Path -LiteralPath $linker -PathType Leaf)) { throw "missing MSVC linker $linker" }

        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8 # zizmor: ignore[github-env] validated runner-owned MSVC linker path.

        '
    - name: Compile Windows V8 serializer
      run: cargo check --locked -p xtask --features aot-serializer
    - name: Download immutable diagnostic portable runtime
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37225721762'
        artifact-ids: '11312707536'
        github-token: ${{ github.token }}
        path: .
        merge-multiple: true
    - name: Verify diagnostic PostgreSQL fixture identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        mkdir -p target/windows-v8-diagnostic

        gh api repos/f0rr0/oliphaunt/actions/artifacts/11312707536 > target/windows-v8-diagnostic/guest-artifact.json

        python tools/experiments/wasmer-v8/verify_guest.py . target/windows-v8-diagnostic

        '
    - name: Generate diagnostic Windows V8 artifacts
      run: bash src/wasix/runtime/tools/build-aot-target.sh
    - name: Download immutable diagnostic extension compiler outputs
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        run-id: '37240991549'
        artifact-ids: '11318826010'
        github-token: ${{ github.token }}
        path: target/extensions/wasix/assets
        merge-multiple: true
    - name: Apply the pinned private DLL ownership control
      run: python tools/experiments/wasmer-v8/expanded-ownership/prepare-dll.py target/windows-v8-ownership/control
    - name: Apply the scoped error ownership control
      run: 'git apply --unsafe-paths --directory="$PWD/target/windows-v8-ownership/control/engine/dependency/wasmer-7.5.0" tools/experiments/wasmer-v8/expanded-ownership/trap-ownership.diff

        cp tools/experiments/wasmer-v8/expanded-ownership/trap-ownership.rs src/wasix/sdks/rust/tests/research_v8_trap_ownership.rs

        python -c ''from pathlib import Path; p=Path("src/wasix/sdks/rust/tests/research_v8_trap_ownership.rs"); p.write_text(p.read_text().replace("fn main() {", "#[test]\nfn trap_ownership() {"))'''
    - name: Apply callback panic containment and stage binary fixtures
      run: 'git apply --unsafe-paths --directory="$PWD/target/windows-v8-ownership/control/engine/dependency/wasmer-7.5.0" tools/experiments/wasmer-v8/expanded-ownership/callback-panic.diff

        cp tools/experiments/wasmer-v8/expanded-ownership/*.wasm src/wasix/sdks/rust/tests/

        cp tools/experiments/wasmer-v8/expanded-ownership/callback-panic.rs src/wasix/sdks/rust/tests/research_v8_callback_panic.rs

        python -c ''from pathlib import Path; p=Path("src/wasix/sdks/rust/tests/research_v8_callback_panic.rs"); p.write_text(p.read_text().replace("fn main() {", "#[test]\nfn callback_panic_containment() {"))''

        '
    - name: Apply automatic Store and memory lifetime hooks
      run: python tools/experiments/wasmer-v8/expanded-ownership/automatic-interrupt-prepare.py target/windows-v8-ownership/control
    - name: Propagate cancellation attachment errors through WASIX
      if: ${{ (inputs.scope == 'fallible-and-catalog' || inputs.scope == 'fallible-family-only') }}
      run: python tools/experiments/wasmer-v8/expanded-ownership/fallible-attachment.py target/windows-v8-ownership/control
    - name: Embed the private engine and generate C function dispatch
      run: python tools/experiments/wasmer-v8/expanded-ownership/embed-dll.py target/windows-v8-ownership/control
    - name: Exercise automatic WASIX interruption and Store teardown races
      if: ${{ inputs.scope != 'fallible-and-catalog' && inputs.scope != 'fallible-family-only' }}
      run: python tools/experiments/wasmer-v8/expanded-ownership/automatic-interrupt-check.py target/windows-v8-ownership/control
      env:
        OLIPHAUNT_RESEARCH_LIFECYCLE_CYCLES: '100'
        OLIPHAUNT_WASIX_GENERATED_ASSETS_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/assets
        OLIPHAUNT_WASM_GENERATED_AOT_DIR: ${{ github.workspace }}/target/oliphaunt-wasix/aot
    - name: Exercise clean WASIX attachment errors and shutdown races
      if: ${{ (inputs.scope == 'fallible-and-catalog' || inputs.scope == 'fallible-family-only') }}
      run: python tools/experiments/wasmer-v8/expanded-ownership/fallible-attachment.py target/windows-v8-ownership/control --check
    - name: Stage aligned unpublished crate family and frozen engine packages
      if: ${{ inputs.scope == 'family-only' || (inputs.scope == 'fallible-and-catalog' || inputs.scope == 'fallible-family-only') }}
      run: |
        python tools/experiments/wasmer-v8/expanded-ownership/cache-only-prepare.py target/windows-v8-ownership/control
        python tools/experiments/wasmer-v8/expanded-ownership/stage-family.py target/windows-v8-ownership/control
    - name: Build and run the family consumer from extracted crate contents
      if: ${{ inputs.scope == 'family-only' || (inputs.scope == 'fallible-and-catalog' || inputs.scope == 'fallible-family-only') }}
      run: python tools/experiments/wasmer-v8/expanded-ownership/family-check.py target/windows-v8-ownership/control
      env:
        CARGO_TARGET_DIR: ${{ github.workspace }}/target/research-family
    - name: Retain automatic lifetime receipts
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: automatic-store-interruption-${{ matrix.runner }}
        path: 'target/windows-v8-ownership/control

          !target/windows-v8-ownership/control/engine/dependency

          !target/windows-v8-ownership/control/cache-only-dependency

          !target/windows-v8-ownership/control/family/sources

          !target/windows-v8-ownership/control/family/extracted

          !target/windows-v8-ownership/control/family/consumer-from-archives/reconstructed.dll

          !target/windows-v8-ownership/control/family/packages/manual-package-stage

          !target/windows-v8-ownership/control/family/standalone-family-consumer'
        if-no-files-found: warn
        retention-days: 90
