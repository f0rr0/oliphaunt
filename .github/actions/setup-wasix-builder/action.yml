name: Set up WASIX builder
description: Load the pinned WASIX Docker builder using the shared build cache.

inputs:
  cache-save-if:
    description: Whether this run may save the builder cache.
    required: true

runs:
  using: composite
  steps:
    - name: Identify builder recipe
      id: recipe
      shell: bash
      run: |
        source src/wasix/postmaster/lib/common.sh
        recipe_sha256="$(fresh_wasix_builder_recipe_sha256)"
        printf 'sha256=%s\n' "$recipe_sha256" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd

    - name: Load WASIX builder
      uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f
      with:
        context: .
        file: src/wasix/runtime/assets/build/docker/Dockerfile
        tags: |
          oliphaunt-wasix-wasix-build:ci
          oliphaunt-wasix-wasix-build:local
        labels: dev.oliphaunt.wasix-builder.recipe-sha256=${{ steps.recipe.outputs.sha256 }}
        load: true
        cache-from: type=gha,scope=wasix-builder
        cache-to: ${{ inputs.cache-save-if == 'true' && 'type=gha,mode=max,scope=wasix-builder,ignore-error=true' || '' }}
