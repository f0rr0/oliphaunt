name: Set up npm publisher
description: Install and verify the exact npm CLI used for trusted publication.

inputs:
  npm-version:
    description: Exact stable npm version.
    required: true

outputs:
  node-executable:
    description: Absolute verified Node.js executable used to launch npm.
    value: ${{ steps.install.outputs.node-executable }}
  npm-cli:
    description: Absolute digest-verified npm CLI entrypoint.
    value: ${{ steps.install.outputs.npm-cli }}
  execution-envelope:
    description: Absolute digest-verified npm execution envelope.
    value: ${{ steps.install.outputs.execution-envelope }}

runs:
  using: composite
  steps:
    - name: Restore verified npm publisher archive
      id: restore_verified_npm_publisher
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/oliphaunt-npm-publisher
        key: verified-npm-publisher-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup-npm-publisher/action.yml', '.github/actions/setup-npm-publisher/install.sh', '.github/actions/setup-moon/toolchain-archive.py', 'src/sources/toolchains/npm-publisher.toml', 'tools/dev/curl-platform-flags.sh') }}

    - name: Install exact npm publisher
      id: install
      shell: bash
      env:
        NPM_PUBLISHER_VERSION: ${{ inputs.npm-version }}
        OLIPHAUNT_NPM_PUBLISHER_CACHE_ROOT: ${{ runner.temp }}/oliphaunt-npm-publisher
      run: | # zizmor: ignore[github-env] only a full-tree digest-verified runner-temp path is exported.
        set -euo pipefail
        publisher_bin="$(bash .github/actions/setup-npm-publisher/install.sh)"
        node_launcher="$(command -v node)"
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
          command -v cygpath >/dev/null 2>&1
          node_launcher="$(cygpath -u "$node_launcher")"
        fi
        npm_cli_fs="$(cd "$publisher_bin/../npm/bin" && pwd -P)/npm-cli.js"
        verifier_fs="$(pwd -P)/tools/release/npm-trusted-publishing-runtime.mjs"
        execution_envelope="$(cd "$publisher_bin/.." && pwd -P)"
        if [[ "$node_launcher" != /* || ! -f "$node_launcher" || -L "$node_launcher" ]]; then
          echo "The verified Node.js launcher is not a regular absolute path: ${node_launcher}" >&2
          exit 1
        fi
        if [[ ! -f "$npm_cli_fs" || -L "$npm_cli_fs" ]]; then
          echo "The verified npm CLI is not a regular file: ${npm_cli_fs}" >&2
          exit 1
        fi
        if [[ ! -f "$verifier_fs" || -L "$verifier_fs" ]]; then
          echo "The npm trusted-publishing verifier is not a regular file: ${verifier_fs}" >&2
          exit 1
        fi
        run_native_node() {
          MSYS2_ARG_CONV_EXCL='*' "$node_launcher" "$@"
        }
        node_executable="$(
          run_native_node -e 'process.stdout.write(process.execPath)'
        )"
        npm_cli="$npm_cli_fs"
        verifier="$verifier_fs"
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
          npm_cli="$(cygpath -aw "$npm_cli_fs")"
          verifier="$(cygpath -aw "$verifier_fs")"
        fi
        node_version="$(run_native_node --version)"
        npm_version="$(run_native_node "$npm_cli" --version)"
        if [[ "$npm_version" != "$NPM_PUBLISHER_VERSION" ]]; then
          echo "Expected npm ${NPM_PUBLISHER_VERSION}; observed ${npm_version}" >&2
          exit 1
        fi
        run_native_node "$verifier" check-runtime \
          --node "$node_version" \
          --npm "$npm_version"
        run_native_node "$verifier" check-trust-cli \
          --npm-cli "$npm_cli"
        export_dir="$publisher_bin"
        output_node="$node_executable"
        output_npm_cli="$npm_cli"
        output_envelope="$execution_envelope"
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
          export_dir="$(cygpath -w "$export_dir")"
          output_envelope="$(cygpath -w "$execution_envelope")"
        fi
        printf '%s\n' "$export_dir" >> "$GITHUB_PATH"
        {
          printf 'node-executable=%s\n' "$output_node"
          printf 'npm-cli=%s\n' "$output_npm_cli"
          printf 'execution-envelope=%s\n' "$output_envelope"
        } >> "$GITHUB_OUTPUT"

    - name: Save verified npm publisher archive
      if: ${{ env.HEAVY_CACHE_SAVE_IF == 'true' && steps.restore_verified_npm_publisher.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/oliphaunt-npm-publisher
        key: verified-npm-publisher-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup-npm-publisher/action.yml', '.github/actions/setup-npm-publisher/install.sh', '.github/actions/setup-moon/toolchain-archive.py', 'src/sources/toolchains/npm-publisher.toml', 'tools/dev/curl-platform-flags.sh') }}
