name: Set up Moon
description: Install verified Node.js, Moon, and Bun binaries and optionally hydrate JavaScript workspace dependencies.

inputs:
  install-workspace:
    description: Install Bun workspace dependencies for JavaScript-family tasks.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore verified tool archives
      id: restore_verified_moon_toolchain
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ runner.temp }}/oliphaunt-moon-toolchain
          ${{ runner.temp }}/oliphaunt-pinned-tools
        key: verified-moon-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools', '.moon/toolchains.yml', '.github/actions/setup-moon/action.yml', '.github/actions/setup-node-bun/action.yml', '.github/actions/setup-moon/install-pinned-toolchain.sh', '.github/actions/setup-moon/toolchain-archive.mts', 'tools/dev/moon-cli.toml', 'tools/dev/moon-plugins.toml', 'tools/dev/proto.toml', 'tools/dev/bun.toml', 'tools/dev/install-pinned-js-runtime.sh', 'tools/dev/extract-pinned-zip.sh', 'tools/packaging/portable-archive.mts', 'tools/dev/extract-pinned-binary.sh', 'tools/dev/curl-platform-flags.sh') }}

    - name: Set up exact Node.js and Bun
      uses: ./.github/actions/setup-node-bun

    - name: Install verified Moon
      shell: bash
      env:
        OLIPHAUNT_MOON_TOOLCHAIN_CACHE_ROOT: ${{ runner.temp }}/oliphaunt-moon-toolchain
      run: | # zizmor: ignore[github-env] only digest-verified runner-temp paths are exported.
        set -euo pipefail
        toolchain_root="$(bash .github/actions/setup-moon/install-pinned-toolchain.sh)"
        moon_home="$RUNNER_TEMP/oliphaunt-moon-home"
        moon_home_fs="$moon_home"
        moon_home_env="$moon_home"
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
          command -v cygpath >/dev/null 2>&1
          moon_home_fs="$(cygpath -u "$moon_home")"
          moon_home_env="$(cygpath -w "$moon_home_fs")"
        fi
        rm -rf "$moon_home_fs"
        mkdir -p "$moon_home_fs/plugins/toolchains"
        cp "$toolchain_root/plugins/"*.wasm "$moon_home_fs/plugins/toolchains/"
        toolchain_bin="$toolchain_root/bin"
        moon_bin="$toolchain_bin/moon"
        if [[ "${RUNNER_OS:-}" == "Windows" ]]; then
          command -v cygpath >/dev/null 2>&1
          toolchain_bin="$(cygpath -w "$toolchain_bin")"
          moon_bin="$(cygpath -w "${moon_bin}.exe")"
          # Native executables do not inherit Git Bash's virtual /usr/bin
          # lookup. Keep their bare `bash` commands away from System32's WSL
          # launcher. Git's bin directory has no competing GNU link.exe.
          git_root="$(cygpath -w /)"
          git_bin="${git_root%\\}\\bin"
          [[ -x "$(cygpath -u "$git_bin")/bash.exe" ]]
          echo "$git_bin" >> "$GITHUB_PATH"
        fi
        echo "$toolchain_bin" >> "$GITHUB_PATH"
        echo "MOON_HOME=$moon_home_env" >> "$GITHUB_ENV"
        echo "MOON_BIN=$moon_bin" >> "$GITHUB_ENV"
        # List every configured plugin to keep verified global tools while Moon
        # still injects a child PATH. With `true`, Rust searches System32 before
        # inherited PATH on Windows and launches WSL's bash.exe.
        echo "MOON_TOOLCHAIN_FORCE_GLOBALS=javascript,node,bun,rust" >> "$GITHUB_ENV"

    - name: Verify toolchain
      shell: bash
      run: |
        set -euo pipefail
        moon --version
        node --version
        bun --version
        moon run ci-workflows:verify-bash

    - name: Save verified tool archives
      if: ${{ env.HEAVY_CACHE_SAVE_IF == 'true' && steps.restore_verified_moon_toolchain.outputs.cache-hit != 'true' }}
      continue-on-error: true
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: |
          ${{ runner.temp }}/oliphaunt-moon-toolchain
          ${{ runner.temp }}/oliphaunt-pinned-tools
        key: verified-moon-toolchain-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.prototools', '.moon/toolchains.yml', '.github/actions/setup-moon/action.yml', '.github/actions/setup-node-bun/action.yml', '.github/actions/setup-moon/install-pinned-toolchain.sh', '.github/actions/setup-moon/toolchain-archive.mts', 'tools/dev/moon-cli.toml', 'tools/dev/moon-plugins.toml', 'tools/dev/proto.toml', 'tools/dev/bun.toml', 'tools/dev/install-pinned-js-runtime.sh', 'tools/dev/extract-pinned-zip.sh', 'tools/packaging/portable-archive.mts', 'tools/dev/extract-pinned-binary.sh', 'tools/dev/curl-platform-flags.sh') }}

    - name: Install workspace dependencies
      if: ${{ inputs.install-workspace == 'true' }}
      shell: bash
      run: bun install --frozen-lockfile

    - name: Restore Moon task outputs
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        # casOutputsCache uses these directories; hashes/ is diagnostic metadata.
        path: |
          .moon/cache/blobs
          .moon/cache/manifests
        key: moon-task-cache-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('.prototools', '.moon/toolchains.yml') }}-${{ github.sha }}
        restore-keys: |
          moon-task-cache-v2-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('.prototools', '.moon/toolchains.yml') }}-

    - name: Hydrate Moon plugins
      shell: bash
      run: moon query projects >/dev/null
