$schema: "https://moonrepo.dev/schemas/project.json"

id: "repo"
language: "unknown"
layer: "configuration"
stack: "infrastructure"
tags: ["javascript-quality", "repo", "hygiene", "monorepo"]

project:
  title: "Repository"
  description: "Root repository hygiene, workspace metadata, and cross-cutting checks."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "*": ["@oliphaunt/core"]

tasks:
  prek:
    tags: ["policy", "assertion", "quality", "static", "requires-maintainer-tools"]
    command: "bash tools/dev/check-prek.sh"
    inputs:
      - "/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
      # Local hook validation only; hosted checks already run the owned format
      # and policy tasks without bootstrapping every maintainer binary.
      runInCI: false
  js-format-check:
    command: "bun x --no-install biome format package.json biome.json renovate.json .markdownlint-cli2.jsonc"
    inputs: ["/package.json", "/biome.json", "/renovate.json", "/.markdownlint-cli2.jsonc"]
    options:
      mergeArgs: replace
      mergeInputs: replace
  js-lint:
    command: "bun x --no-install biome lint --diagnostic-level=error package.json biome.json renovate.json .markdownlint-cli2.jsonc"
    inputs: ["/package.json", "/biome.json", "/renovate.json", "/.markdownlint-cli2.jsonc"]
    options:
      mergeArgs: replace
      mergeInputs: replace
