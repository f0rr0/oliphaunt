$schema: "https://moonrepo.dev/schemas/project.json"

id: "oliphaunt-react-native"
language: "typescript"
layer: "library"
stack: "frontend"
tags: ["sdk", "react-native", "typescript", "ios", "android", "release-product"]
dependsOn:
  - "oliphaunt-swift"
  - "oliphaunt-kotlin"
  - "shared-js-core"
  - id: "extension-runtime-contract"
    scope: "build"

project:
  title: "Oliphaunt React Native SDK"
  description: "React Native New Architecture SDK over the Swift and Kotlin Oliphaunt SDKs."
  owner: "oliphaunt"
  release:
    component: "oliphaunt-react-native"
    packagePath: "src/sdks/react-native"

owners:
  defaultOwner: "@oliphaunt/sdk-react-native"
  paths:
    "**/*.ts": ["@oliphaunt/sdk-react-native"]
    "**/*.tsx": ["@oliphaunt/sdk-react-native"]
    "ios/**": ["@oliphaunt/sdk-react-native", "@oliphaunt/sdk-swift"]
    "android/**": ["@oliphaunt/sdk-react-native", "@oliphaunt/sdk-android"]

tasks:
  compile:
    tags: ["quality", "static"]
    command: "bash src/sdks/react-native/tools/check-sdk.sh check-static"
    inputs:
      - "/src/shared/fixtures/**/*"
      - project: "shared-js-core"
      - "@group(pnpm-workspace)"
      - "/tools/dev/write-scoped-pnpm-workspace.mjs"
      - "**/*"
      - "!/src/sdks/react-native/**/node_modules"
      - "!/src/sdks/react-native/**/node_modules/**"
      - "!/src/sdks/react-native/**/.build"
      - "!/src/sdks/react-native/**/.build/**"
      - "!/src/sdks/react-native/**/.gradle/**"
      - "!/src/sdks/react-native/**/.cxx/**"
      - "!/src/sdks/react-native/**/build/**"
      - "!/src/sdks/react-native/**/lib/**"
      - "!/src/sdks/react-native/ios/vendor/**"
    options:
      cache: true
      runFromWorkspaceRoot: true
  build-ios-bridge:
    tags: ["build", "ios", "react-native-new-architecture"]
    command: "bash src/sdks/react-native/tools/check-sdk.sh build-ios-bridge"
    inputs:
      - "/Package.swift"
      - "/src/shared/fixtures/**/*"
      - project: "shared-js-core"
      - "@group(pnpm-workspace)"
      - "/tools/dev/write-scoped-pnpm-workspace.mjs"
      - "/src/runtimes/liboliphaunt/native/include/oliphaunt.h"
      - "**/*"
      - "!/src/sdks/react-native/**/node_modules"
      - "!/src/sdks/react-native/**/node_modules/**"
      - "!/src/sdks/react-native/**/.build"
      - "!/src/sdks/react-native/**/.build/**"
      - "!/src/sdks/react-native/**/.gradle/**"
      - "!/src/sdks/react-native/**/.cxx/**"
      - "!/src/sdks/react-native/**/build/**"
      - "!/src/sdks/react-native/**/lib/**"
      - "!/src/sdks/react-native/ios/vendor/**"
      - project: "oliphaunt-swift"
      - "!/src/sdks/swift/.build"
      - "!/src/sdks/swift/.build/**"
    options:
      cache: true
      runFromWorkspaceRoot: true
  build-android-bridge:
    tags: ["build", "android", "react-native-new-architecture"]
    command: "bash src/sdks/react-native/tools/check-sdk.sh build-android-bridge"
    inputs:
      - "/src/shared/fixtures/**/*"
      - project: "shared-js-core"
      - "@group(pnpm-workspace)"
      - "/tools/dev/write-scoped-pnpm-workspace.mjs"
      - "/src/runtimes/liboliphaunt/native/include/oliphaunt.h"
      - project: "oliphaunt-kotlin"
      - project: "extension-runtime-contract"
      - "**/*"
      - "!/src/sdks/react-native/**/node_modules"
      - "!/src/sdks/react-native/**/node_modules/**"
      - "!/src/sdks/react-native/**/.build"
      - "!/src/sdks/react-native/**/.build/**"
      - "!/src/sdks/react-native/**/.gradle/**"
      - "!/src/sdks/react-native/**/.cxx/**"
      - "!/src/sdks/react-native/**/build/**"
      - "!/src/sdks/react-native/**/lib/**"
      - "!/src/sdks/react-native/ios/vendor/**"
      - "/tools/policy/run-gradle-lint-checked.sh"
    options:
      cache: true
      runFromWorkspaceRoot: true
  unit:
    tags: ["quality", "unit"]
    command: "bash src/sdks/react-native/tools/check-sdk.sh test-unit"
    inputs:
      - "@group(legal-files)"
      - "/src/extensions/**/*"
      - "/src/extensions/generated/mobile/static-extensions.tsv"
      - "/src/extensions/generated/sdk/extensions.json"
      - "/src/extensions/generated/sdk/ios-static-dependencies.json"
      - "/src/postgres/versions/18/source.toml"
      - "/src/runtimes/liboliphaunt/licenses/**/*"
      - "/src/runtimes/liboliphaunt/native/VERSION"
      - "/src/runtimes/liboliphaunt/wasix/VERSION"
      - "/src/sources/third-party/shared/icu.toml"
      - "/src/sources/third-party/shared/openssl.toml"
      - "/src/shared/fixtures/**/*"
      - "/src/shared/cluster-seed-contract/**/*"
      - project: "shared-js-core"
      - "@group(pnpm-workspace)"
      - "/tools/dev/capture-command-output.mjs"
      - "/tools/dev/write-scoped-pnpm-workspace.mjs"
      - "/tools/policy/source-fetch-core.mjs"
      - "/tools/release/extension-upstream-licenses.mjs"
      - "@group(release-archive-contract)"
      - "/tools/release/wasix-extension-install-contract.mjs"
      - "**/*"
      - "!/src/sdks/react-native/**/node_modules"
      - "!/src/sdks/react-native/**/node_modules/**"
      - "!/src/sdks/react-native/**/.build"
      - "!/src/sdks/react-native/**/.build/**"
      - "!/src/sdks/react-native/**/.gradle/**"
      - "!/src/sdks/react-native/**/.cxx/**"
      - "!/src/sdks/react-native/**/build/**"
      - "!/src/sdks/react-native/**/lib/**"
      - "!/src/sdks/react-native/ios/vendor/**"
      - "/tools/test/fd-backed-spawn-sync.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  smoke:
    tags: ["runtime", "smoke"]
    command: "pnpm --dir examples/react-native-expo run smoke"
    deps:
      - "oliphaunt-swift:smoke"
      - "oliphaunt-kotlin:smoke"
    inputs:
      - "/Package.swift"
      - "/examples/react-native-expo/**/*"
      - "/src/extensions/**/*"
      - "/src/shared/fixtures/extensions/**/*"
      - "/src/runtimes/liboliphaunt/native/**/*"
      - "/src/runtimes/liboliphaunt/wasix/VERSION"
      - "/src/sources/toolchains/android-sdk.toml"
      - project: "oliphaunt-kotlin"
      - project: "extension-runtime-contract"
      - "**/*"
      - "!/src/sdks/react-native/**/node_modules"
      - "!/src/sdks/react-native/**/node_modules/**"
      - "!/src/sdks/react-native/**/.build"
      - "!/src/sdks/react-native/**/.build/**"
      - "!/src/sdks/react-native/**/.gradle/**"
      - "!/src/sdks/react-native/**/.cxx/**"
      - "!/src/sdks/react-native/**/build/**"
      - "!/src/sdks/react-native/**/lib/**"
      - "!/src/sdks/react-native/ios/vendor/**"
      - project: "oliphaunt-swift"
      - "!/src/sdks/swift/.build"
      - "!/src/sdks/swift/.build/**"
      - "@group(pnpm-workspace)"
      - "/tools/dev/write-scoped-pnpm-workspace.mjs"
    options:
      cache: local
      runFromWorkspaceRoot: true
  smoke-android:
    tags: ["runtime", "smoke", "android"]
    command: "pnpm --dir examples/react-native-expo run smoke:android"
    deps:
      - "oliphaunt-kotlin:smoke"
    inputs:
      - "/examples/react-native-expo/**/*"
      - "/src/extensions/**/*"
      - "/src/shared/fixtures/extensions/**/*"
      - "/src/runtimes/liboliphaunt/native/**/*"
      - "/src/runtimes/liboliphaunt/wasix/VERSION"
      - "/src/sources/toolchains/android-sdk.toml"
      - project: "oliphaunt-kotlin"
      - project: "extension-runtime-contract"
      - "**/*"
      - "!/src/sdks/react-native/**/node_modules"
      - "!/src/sdks/react-native/**/node_modules/**"
      - "!/src/sdks/react-native/**/.build"
      - "!/src/sdks/react-native/**/.build/**"
      - "!/src/sdks/react-native/**/.gradle/**"
      - "!/src/sdks/react-native/**/.cxx/**"
      - "!/src/sdks/react-native/**/build/**"
      - "!/src/sdks/react-native/**/lib/**"
      - "!/src/sdks/react-native/ios/vendor/**"
      - "@group(pnpm-workspace)"
      - "/tools/dev/write-scoped-pnpm-workspace.mjs"
    options:
      cache: local
      runFromWorkspaceRoot: true
  smoke-ios:
    tags: ["runtime", "smoke", "ios"]
    command: "pnpm --dir examples/react-native-expo run smoke:ios"
    deps:
      - "oliphaunt-swift:smoke"
    inputs:
      - "/Package.swift"
      - "/examples/react-native-expo/**/*"
      - "/src/extensions/**/*"
      - "/src/shared/fixtures/extensions/**/*"
      - "/src/runtimes/liboliphaunt/native/**/*"
      - "/src/runtimes/liboliphaunt/wasix/VERSION"
      - "**/*"
      - "!/src/sdks/react-native/**/node_modules"
      - "!/src/sdks/react-native/**/node_modules/**"
      - "!/src/sdks/react-native/**/.build"
      - "!/src/sdks/react-native/**/.build/**"
      - "!/src/sdks/react-native/**/.gradle/**"
      - "!/src/sdks/react-native/**/.cxx/**"
      - "!/src/sdks/react-native/**/build/**"
      - "!/src/sdks/react-native/**/lib/**"
      - "!/src/sdks/react-native/ios/vendor/**"
      - project: "oliphaunt-swift"
      - "!/src/sdks/swift/.build"
      - "!/src/sdks/swift/.build/**"
      - "@group(pnpm-workspace)"
      - "/tools/dev/write-scoped-pnpm-workspace.mjs"
    options:
      cache: local
      runFromWorkspaceRoot: true
  e2e:
    tags: ["mobile", "e2e"]
    command: "true"
    deps:
      - "oliphaunt-react-native:mobile-build-android"
      - "oliphaunt-react-native:mobile-e2e-android"
      - "oliphaunt-react-native:mobile-build-ios"
      - "oliphaunt-react-native:mobile-e2e-ios"
    inputs:
      - "/Package.swift"
      - "/src/extensions/**/*"
      - "/src/runtimes/liboliphaunt/native/**/*"
      - "/src/runtimes/liboliphaunt/wasix/VERSION"
      - project: "oliphaunt-kotlin"
      - project: "extension-runtime-contract"
      - "**/*"
      - "!/src/sdks/react-native/**/node_modules"
      - "!/src/sdks/react-native/**/node_modules/**"
      - "!/src/sdks/react-native/**/.build"
      - "!/src/sdks/react-native/**/.build/**"
      - "!/src/sdks/react-native/**/.gradle/**"
      - "!/src/sdks/react-native/**/.cxx/**"
      - "!/src/sdks/react-native/**/build/**"
      - "!/src/sdks/react-native/**/lib/**"
      - "!/src/sdks/react-native/ios/vendor/**"
      - project: "oliphaunt-swift"
      - "!/src/sdks/swift/.build"
      - "!/src/sdks/swift/.build/**"
      - "/src/sources/toolchains/android-emulator-runner.toml"
      - "/src/sources/toolchains/maestro.toml"
      - "/tools/dev/setup-maestro.sh"
      - "@group(pnpm-workspace)"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  mobile-build-android:
    tags: ["mobile", "build", "android", "ci-mobile-build-android"]
    command: "pnpm --dir examples/react-native-expo run mobile-build:android"
    deps:
      - "oliphaunt-kotlin:package-artifacts"
      - "oliphaunt-react-native:package-artifacts"
    inputs:
      - "@group(legal-files)"
      - "/src/extensions/**/*"
      - "!/src/extensions/generated/docs"
      - "!/src/extensions/generated/docs/**"
      - "!/src/extensions/evidence"
      - "!/src/extensions/evidence/**"
      - "/target/extension-artifacts/**/*"
      - "/target/sdk-artifacts/oliphaunt-kotlin/**/*"
      - "/target/sdk-artifacts/oliphaunt-react-native/**/*"
      - "/src/postgres/versions/18/source.toml"
      - "/src/runtimes/liboliphaunt/licenses/**/*"
      - "/src/runtimes/liboliphaunt/native/**/*"
      - "/src/runtimes/liboliphaunt/wasix/VERSION"
      - "/src/sources/toolchains/android-sdk.toml"
      - "/src/sources/third-party/shared/icu.toml"
      - "/src/sources/third-party/shared/openssl.toml"
      - project: "oliphaunt-kotlin"
      - "@group(cargo-workspace)"
      - "/src/sdks/rust/Cargo.toml"
      - "/src/sdks/rust/build.rs"
      - project: "extension-runtime-contract"
      - "/tools/native-packaging/**/*"
      - "/src/sdks/rust/src/**/*"
      - "**/*"
      - "!/src/sdks/react-native/**/node_modules"
      - "!/src/sdks/react-native/**/node_modules/**"
      - "!/src/sdks/react-native/**/.build"
      - "!/src/sdks/react-native/**/.build/**"
      - "!/src/sdks/react-native/**/.gradle/**"
      - "!/src/sdks/react-native/**/.cxx/**"
      - "!/src/sdks/react-native/**/build/**"
      - "!/src/sdks/react-native/**/lib/**"
      - "!/src/sdks/react-native/ios/vendor/**"
      - "@group(pnpm-workspace)"
      - "/tools/dev/write-scoped-pnpm-workspace.mjs"
      - "/tools/dev/capture-command-output.mjs"
      - "/tools/policy/source-fetch-core.mjs"
      - "/tools/release/extension-upstream-licenses.mjs"
      - "@group(release-archive-contract)"
      - "/src/sdks/react-native/tools/expo-android-gradle-limits.sh"
      - "/src/sdks/react-native/tools/expo-android-runner.sh"
    outputs:
      - "/target/mobile-build/react-native/android/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
  mobile-e2e-android:
    tags: ["mobile", "e2e", "android"]
    command: "pnpm --dir examples/react-native-expo run mobile-e2e:android"
    deps:
      - target: "oliphaunt-react-native:mobile-build-android"
        cacheStrategy: "outputs"
    inputs:
      - "/examples/react-native-expo/src/**/*"
      - "/examples/react-native-expo/maestro/**/*"
      - "/examples/react-native-expo/package.json"
      - "/src/sdks/react-native/tools/mobile-e2e.sh"
      - "/src/sdks/react-native/tools/expo-runner-common.sh"
      - "/src/sdks/react-native/tools/expo-runner-metro.sh"
      - "/src/sdks/react-native/tools/expo-runner-reporting.sh"
      - "/src/sdks/react-native/tools/expo-runner-runtime-resources.sh"
      - "/src/sdks/react-native/tools/expo-runner-workspace.sh"
      - "/tools/dev/write-scoped-pnpm-workspace.mjs"
      - "/src/sdks/react-native/tools/expo-runner-android-device.sh"
      - "/src/sdks/react-native/tools/mobile-extension-runtime.sh"
      - "/src/sources/toolchains/android-emulator-runner.toml"
      - "/src/sources/toolchains/maestro.toml"
      - "/tools/dev/setup-maestro.sh"
      - "/target/mobile-build/react-native/android/**/*"
      - "/src/sdks/react-native/tools/expo-android-gradle-limits.sh"
      - "/src/sdks/react-native/tools/expo-android-runner.sh"
      - "/src/sdks/react-native/tools/mobile-extension-artifact-paths.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: skip
  mobile-drill-android:
    tags: ["mobile", "drill", "android"]
    command: "pnpm --dir examples/react-native-expo run mobile-drill:android"
    deps:
      - "oliphaunt-kotlin:smoke"
    inputs:
      - "/src/extensions/**/*"
      - "/src/runtimes/liboliphaunt/native/**/*"
      - "/src/runtimes/liboliphaunt/wasix/VERSION"
      - "/src/sources/toolchains/android-sdk.toml"
      - project: "oliphaunt-kotlin"
      - project: "extension-runtime-contract"
      - "/tools/native-packaging/**/*"
      - "**/*"
      - "!/src/sdks/react-native/**/node_modules"
      - "!/src/sdks/react-native/**/node_modules/**"
      - "!/src/sdks/react-native/**/.build"
      - "!/src/sdks/react-native/**/.build/**"
      - "!/src/sdks/react-native/**/.gradle/**"
      - "!/src/sdks/react-native/**/.cxx/**"
      - "!/src/sdks/react-native/**/build/**"
      - "!/src/sdks/react-native/**/lib/**"
      - "!/src/sdks/react-native/ios/vendor/**"
      - "@group(pnpm-workspace)"
      - "/tools/dev/write-scoped-pnpm-workspace.mjs"
      - "/src/sdks/react-native/tools/expo-android-gradle-limits.sh"
      - "/src/sdks/react-native/tools/expo-android-runner.sh"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  mobile-build-ios:
    tags: ["mobile", "build", "ios", "ci-mobile-build-ios"]
    command: "pnpm --dir examples/react-native-expo run mobile-build:ios"
