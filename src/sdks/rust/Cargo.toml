[package]
name = "oliphaunt"
version = "0.1.1"
edition = "2024"
rust-version = "1.93"
description = "Native-first Rust SDK surface for embedded PostgreSQL through liboliphaunt."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
license = "MIT"
exclude = [
  ".gitignore",
  "crates/oliphaunt-build/**",
  "moon.yml",
  "release.toml",
  "tools/**",
]
links = "oliphaunt_artifact_relay"
build = "build.rs"

[lib]
name = "oliphaunt"
path = "src/lib.rs"

[features]
default = []
__internal-broker-helper = []
internal-native-packaging = []

[package.metadata.oliphaunt]
broker-helper = "oliphaunt-broker"
broker-version = "0.1.1"

[dependencies]
fs2 = "0.4"
getrandom = "0.3"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "time"] }
