$schema: "https://moonrepo.dev/schemas/project.json"

id: "oliphaunt-kotlin"
language: "kotlin"
layer: "library"
stack: "systems"
tags: ["sdk", "kotlin", "android", "native", "release-product"]
dependsOn:
  - "liboliphaunt-native"
  - id: "extension-runtime-contract"
    scope: "build"

project:
  title: "Oliphaunt Kotlin SDK"
  description: "Android SDK for native liboliphaunt."
  owner: "oliphaunt"
  release:
    component: "oliphaunt-kotlin"
    packagePath: "src/sdks/kotlin"

owners:
  defaultOwner: "@oliphaunt/sdk-android"
  paths:
    "**/*.kt": ["@oliphaunt/sdk-android"]
    "**/*.kts": ["@oliphaunt/sdk-android"]

tasks:
  compile:
    tags: ["quality", "static", "requires-android-sdk"]
    command: "bash src/sdks/kotlin/tools/check-sdk.sh check-static"
    inputs:
      - "@group(legal-files)"
      - "/src/extensions/generated/sdk/extensions.json"
      - "/src/extensions/external/**/upstream-license-data.json"
      - "/src/runtimes/liboliphaunt/licenses/openssl-3.5.6-LICENSE.txt"
      - "/src/runtimes/liboliphaunt/licenses/postgresql-18.4-COPYRIGHT"
      - "/src/shared/fixtures/**/*"
      - "**/*"
      - project: "extension-runtime-contract"
      - "/src/sdks/react-native/tools/android-smoke-artifacts.sh"
      - "/tools/policy/run-gradle-lint-checked.sh"
      - "/tools/runtime/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  unit:
    tags: ["quality", "unit", "requires-android-sdk"]
    command: "bash src/sdks/kotlin/tools/check-sdk.sh test-unit"
    inputs:
      - "@group(legal-files)"
      - "/src/extensions/generated/sdk/extensions.json"
      - "/src/extensions/external/**/upstream-license-data.json"
      - "/src/runtimes/liboliphaunt/licenses/openssl-3.5.6-LICENSE.txt"
      - "/src/runtimes/liboliphaunt/licenses/postgresql-18.4-COPYRIGHT"
      - "/src/shared/fixtures/**/*"
      - "/src/shared/cluster-seed-contract/**/*"
      - "**/*"
      - project: "extension-runtime-contract"
      - "/src/sdks/react-native/tools/android-smoke-artifacts.sh"
      - "/tools/runtime/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  smoke:
    tags: ["runtime", "smoke"]
    command: "bash src/sdks/kotlin/tools/check-sdk.sh smoke-runtime"
    deps:
      - "liboliphaunt-native:release-runtime"
    inputs:
      - "/src/extensions/**/*"
      - project: "liboliphaunt-native"
      - "**/*"
      - project: "extension-runtime-contract"
      - "/src/sdks/react-native/tools/android-smoke-artifacts.sh"
      - "/tools/runtime/**/*"
      - "/tools/xtask/**/*"
      - "@group(cargo-workspace)"
    options:
      cache: local
      runFromWorkspaceRoot: true
  package:
    tags: ["package"]
    command: "bash src/sdks/kotlin/tools/check-sdk.sh package-shape"
    inputs:
      - "@group(legal-files)"
      - "/src/extensions/generated/sdk/extensions.json"
      - "/src/shared/fixtures/**/*"
      - "/src/runtimes/liboliphaunt/native/include/oliphaunt.h"
      - "**/*"
      - project: "extension-runtime-contract"
      - "/src/sdks/react-native/tools/android-smoke-artifacts.sh"
      - "/tools/runtime/**/*"
    options:
      cache: local
      runFromWorkspaceRoot: true
  package-artifacts:
    tags: ["release", "artifact-package", "ci-kotlin-sdk-package"]
    command: "tools/dev/bun.sh tools/release/build-sdk-ci-artifacts.mjs oliphaunt-kotlin"
    inputs:
      - "@group(legal-files)"
      - "/src/extensions/generated/sdk/extensions.json"
      - "/src/shared/fixtures/**/*"
      - "/src/runtimes/liboliphaunt/native/include/oliphaunt.h"
      - "**/*"
      - project: "extension-runtime-contract"
      - "/src/sdks/react-native/tools/android-smoke-artifacts.sh"
      - "/tools/release/build-sdk-ci-artifacts.mjs"
      - "/tools/release/sdk-artifacts/kotlin.mjs"
      - "/tools/release/sdk-artifacts/shared.mjs"
      - "/tools/release/check-staged-artifacts.mjs"
      - "/tools/release/extension-runtime-asset-contract.mjs"
      - "/tools/release/extension-upstream-licenses.mjs"
      - "/tools/release/ios-carrier-manifest.mjs"
      - "@group(release-target-contract)"
      - "/tools/release/release-cli-utils.mjs"
      - "/tools/release/release-graph.mjs"
      - "@group(release-archive-contract)"
      - "@group(source-sdk-packaging)"
      - "/tools/policy/source-fetch-core.mjs"
      - "/tools/runtime/**/*"
    outputs:
      - "/target/sdk-artifacts/oliphaunt-kotlin/**/*"
    options:
      cache: local
      runFromWorkspaceRoot: true
  maven-staging:
    tags: ["release", "artifact-package", "ci-kotlin-maven-staging"]
    command: "tools/dev/bun.sh tools/release/kotlin-maven-staging.mjs"
    deps:
      - "oliphaunt-kotlin:package-artifacts"
    inputs:
      - "/src/sdks/kotlin/gradle.properties"
      - "/tools/release/kotlin-maven-staging.mjs"
      - "/tools/release/maven-central-contract.mjs"
      - "/target/sdk-artifacts/oliphaunt-kotlin/maven/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: true
  qualify:
    tags: ["release", "package"]
    command: "bash src/sdks/kotlin/tools/check-sdk.sh release-check"
    deps:
      - "liboliphaunt-native:release-runtime"
    inputs:
      - "/src/extensions/generated/sdk/extensions.json"
      - "/src/shared/fixtures/**/*"
      - "/src/runtimes/liboliphaunt/native/include/oliphaunt.h"
      - "**/*"
      - project: "extension-runtime-contract"
      - "/src/sdks/react-native/tools/android-smoke-artifacts.sh"
      - "/tools/policy/run-gradle-lint-checked.sh"
      - "/tools/runtime/**/*"
    options:
      cache: local
      runFromWorkspaceRoot: true
  bench:
    tags: ["bench", "plan"]
    command: "bash tools/perf/matrix/run_mobile_footprint_matrix.sh --plan-only --quick --platform android"
    inputs:
      - "/src/extensions/generated/sdk/extensions.json"
      - "/src/shared/fixtures/**/*"
      - "**/*"
      - project: "extension-runtime-contract"
      - "/tools/perf/**/*"
      - "/benchmarks/**/*"
      - "/release-please-config.json"
      - "/src/**/targets/**/*.toml"
    options:
      cache: true
      runFromWorkspaceRoot: true
      runInCI: false
  regression:
    tags: ["regression", "runtime"]
    command: "bash src/sdks/kotlin/tools/check-sdk.sh regression"
    inputs:
      - "/src/shared/fixtures/**/*"
      - "**/*"
      - project: "extension-runtime-contract"
      - "/src/sdks/react-native/tools/android-smoke-artifacts.sh"
      - "/tools/policy/run-gradle-lint-checked.sh"
      - "/tools/runtime/**/*"
    options:
      cache: local
      runFromWorkspaceRoot: true
      runInCI: false
  coverage:
    tags: ["coverage", "quality"]
    command: "tools/coverage/run-product oliphaunt-kotlin"
    inputs:
      - "/coverage/baseline.toml"
      - "/src/shared/fixtures/**/*"
      - "**/*"
      - project: "extension-runtime-contract"
      - "/tools/coverage/**/*"
    outputs:
      - "/target/coverage/oliphaunt-kotlin/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  bench-run:
    tags: ["bench", "measured"]
    command: "bash tools/perf/matrix/run_mobile_footprint_matrix.sh --platform android"
    inputs:
      - "/src/shared/fixtures/**/*"
      - "**/*"
      - project: "extension-runtime-contract"
      - "/tools/perf/**/*"
      - "/benchmarks/**/*"
      - "/release-please-config.json"
      - "/src/**/targets/**/*.toml"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
