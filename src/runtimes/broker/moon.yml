$schema: "https://moonrepo.dev/schemas/project.json"

id: "oliphaunt-broker"
language: "rust"
layer: "library"
stack: "systems"
tags: ["runtime", "broker", "native", "postgres", "release-product"]
dependsOn:
  - id: "oliphaunt-rust"
    scope: "build"
  - "liboliphaunt-native"

project:
  title: "Oliphaunt Broker"
  description: "Process-isolated broker helper runtime used by Rust and TypeScript SDKs."
  owner: "oliphaunt"
  release:
    component: "oliphaunt-broker"
    packagePath: "src/runtimes/broker"
    artifactTargets:
      preset: "broker-helper"
      targets:
        - "linux-arm64-gnu"
        - "linux-x64-gnu"
        - "macos-arm64"
        - "windows-x64-msvc"

owners:
  defaultOwner: "@oliphaunt/broker"

fileGroups:
  code:
    - "**/*"
    - "!**/*.md"
    - "!moon.yml"
    - "!release.toml"

tasks:
  build:
    tags: ["build", "requires-rust"]
    command: "cargo build -p oliphaunt-broker --locked"
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-broker/build"
    inputs:
      - "@group(cargo-workspace)"
      - "@group(code)"
      - project: "oliphaunt-rust"
        group: "code"
    outputs:
      - "/target/moon/oliphaunt-broker/build/debug/oliphaunt-broker*"
    options:
      cache: true
      runFromWorkspaceRoot: true

  compile:
    tags: ["quality", "static", "requires-rust"]
    command: "cargo check -p oliphaunt-broker --locked"
    env:
      CARGO_TARGET_DIR: "target"
    inputs:
      - "@group(cargo-workspace)"
      - "@group(code)"
      - project: "oliphaunt-rust"
        group: "code"
    options:
      cache: true
      runFromWorkspaceRoot: true

  unit:
    tags: ["quality", "unit", "requires-rust"]
    command: "cargo test -p oliphaunt-broker --locked"
    env:
      CARGO_TARGET_DIR: "target"
    inputs:
      - "@group(cargo-workspace)"
      - "@group(code)"
      - project: "oliphaunt-rust"
        group: "code"
    options:
      cache: true
      runFromWorkspaceRoot: true

  qualify:
    tags: ["release"]
    command: "true"
    deps:
      - "oliphaunt-broker:compile"
      - "oliphaunt-broker:unit"
    inputs: []
    options:
      cache: true
      runFromWorkspaceRoot: true

  rust-format-check:
    tags: ["quality", "static", "format", "requires-rust"]
    command: "cargo fmt -p oliphaunt-broker --check"
    inputs: ["/src/runtimes/broker/**/*.rs","/src/runtimes/broker/Cargo.toml","/clippy.toml","@group(cargo-workspace)"]
    options:
      runFromWorkspaceRoot: true
  rust-lint:
    tags: ["quality", "static", "requires-rust"]
    command: "cargo clippy -p oliphaunt-broker --all-targets --locked -- -D warnings"
    env:
      CARGO_TARGET_DIR: "target"
    inputs: ["/src/runtimes/broker/**/*.rs","/src/runtimes/broker/Cargo.toml","/clippy.toml","@group(cargo-workspace)"]
    options:
      runFromWorkspaceRoot: true

  dependency-license-audit:
    tags: ["policy", "assertion", "quality", "static", "requires-rust"]
    command: "bash src/runtimes/broker/tools/audit-dependency-licenses.sh"
    inputs:
      - "@group(cargo-workspace)"
      - "/benchmarks/**/Cargo.toml"
      - "/examples/**/Cargo.toml"
      - "/src/**/Cargo.toml"
      - "/tools/**/Cargo.toml"
      - "/src/runtimes/broker/dependency-licenses.json"
      - "/src/runtimes/broker/dependency-license-blobs/**/*"
      - "/src/runtimes/broker/tools/broker-dependency-license-contract.mts"
      - "/src/runtimes/broker/tools/audit-dependency-licenses.sh"
      - "/src/shared/artifact-packaging/release-directory-safety.mts"
    options:
      cache: false
      runFromWorkspaceRoot: true


  build-release-assets:
    tags: ["release", "artifact", "in-place-finalizer-input", "ci-broker-runtime"]
    command: "bash src/runtimes/broker/tools/package-broker-assets.sh"
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-broker/build-release-assets"
      OLIPHAUNT_RELEASE_ASSET_PARTIAL: "1"
    inputs:
      - "@group(legal-files)"
      - "@group(cargo-workspace)"
      - "@group(code)"
      - project: "oliphaunt-rust"
        group: "code"
      - "/src/runtimes/broker/tools/build-linux-broker-baseline.sh"
      - "/src/runtimes/broker/tools/broker-dependency-license-contract.mts"
      - "/src/shared/artifact-packaging/check-linux-consumer-baseline.sh"
      - "/src/shared/artifact-packaging/linux-abi-baseline.test.mts"
      - "/src/runtimes/broker/tools/package-broker-assets.sh"
      - "/src/runtimes/broker/tools/check-release-assets.mts"
      - "/src/shared/product-metadata/platform-compatibility-policy.mts"
      - "/src/shared/product-metadata/platform-compatibility-policy.test.mts"
      - "/src/shared/artifact-packaging/platform-binary-contract.mts"
      - "/src/shared/artifact-packaging/strip-native-binaries.sh"
      - "/src/shared/artifact-packaging/platform-binary-contract.test.mts"
      - "/src/shared/artifact-packaging/release-asset-validation.mts"
      - "/src/shared/extension-runtime-contract/extension-target-profiles.mts"
      - "/src/shared/product-metadata/release-artifact-targets.mts"
      - "@group(release-archive-contract)"
      - "/src/shared/product-metadata/artifact-target-matrix.mts"
      - "/release-please-config.json"
    outputs:
      - "/target/oliphaunt-broker/release-assets/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true


  finalize-release-assets:
    tags: ["release", "artifact-package", "in-place-finalizer", "ci-broker-release-assets"]
    command: "tools/dev/bun.sh src/runtimes/broker/tools/check-release-assets.mts --aggregate"
    deps:
      - "oliphaunt-broker:build-release-assets"
    inputs:
      - "@group(legal-files)"
      - "@group(cargo-workspace)"
      - "@group(code)"
      - project: "oliphaunt-rust"
        group: "code"
      - "/src/shared/product-metadata/artifact-target-matrix.mts"
      - "/src/runtimes/broker/tools/broker-dependency-license-contract.mts"
      - "/src/runtimes/broker/tools/build-linux-broker-baseline.sh"
      - "/src/runtimes/broker/tools/check-release-assets.mts"
      - "/src/shared/artifact-packaging/check-linux-consumer-baseline.sh"
      - "/src/shared/artifact-packaging/finalize-helper-assets.mts"
      - "/src/shared/artifact-packaging/linux-abi-baseline.test.mts"
      - "/src/runtimes/broker/tools/package-broker-assets.sh"
      - "/src/shared/product-metadata/platform-compatibility-policy.mts"
      - "/src/shared/product-metadata/platform-compatibility-policy.test.mts"
      - "/src/shared/artifact-packaging/platform-binary-contract.mts"
      - "/src/shared/artifact-packaging/strip-native-binaries.sh"
      - "/src/shared/artifact-packaging/platform-binary-contract.test.mts"
      - "/src/shared/artifact-packaging/release-asset-validation.mts"
      - "/src/shared/extension-runtime-contract/extension-target-profiles.mts"
      - "/src/shared/product-metadata/release-artifact-targets.mts"
      - "@group(release-archive-contract)"
      - "/src/shared/artifact-packaging/write-checksum-manifest.mts"
      - "/release-please-config.json"
      - "/target/oliphaunt-broker/release-assets/**/*"
    outputs:
      - "/target/oliphaunt-broker/release-assets/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true


  packaging-unit:
    tags: ["quality", "unit", "requires-rust"]
    script: |
      set -eu
      for test_file in src/runtimes/broker/tools/broker-dependency-license-contract.test.mts; do
        bash tools/dev/bun.sh test --timeout=30000 "$test_file"
      done
    inputs:
      - "@group(release-target-contract)"
      - "@group(package-test-metadata)"
      - "@group(code)"
      - "/tools/test/**/*"
      - "/tools/dev/bun.sh"
      - "/src/shared/artifact-packaging/*.{mts,sh}"
      - "/src/shared/product-metadata/*.{mjs,mts}"
    options:
      cache: true
      runFromWorkspaceRoot: true
