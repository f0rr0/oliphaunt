$schema: "https://moonrepo.dev/schemas/project.json"

id: "extensions"
language: "unknown"
layer: "configuration"
stack: "systems"
tags: ["javascript-quality", "extensions", "catalog", "assets"]
dependsOn:
  - id: "postgres18"
    scope: "build"
  - id: "extension-runtime-contract"
    scope: "build"
  - id: "third-party-native"
    scope: "build"
  - id: "third-party-shared"
    scope: "build"

project:
  title: "Extension Catalog"
  description: "Exact SQL extension catalog, build plans, and generated tables."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

fileGroups:
  sdk-metadata:
    - "generated/sdk/**/*"
  model:
    - "catalog/**/*"
    - "contrib/**/*"
    - "evidence/**/*"
    - "external/**/*"
    - "generated/**/*"
    - "schemas/**/*"
    - "tools/**/*"
  build:
    - "catalog/**/*"
    - "contrib/**/*"
    - "external/**/*"
    - "generated/**/*"
    - "schemas/**/*"
    - "tools/**/*"
    - "!**/*.md"
    - "!external/**/VERSION"
    - "!external/**/release.toml"
    - "!generated/docs"
    - "!generated/docs/**"
  package:
    - "catalog/**/*"
    - "contrib/**/*"
    - "external/**/*"
    - "generated/**/*"
    - "schemas/**/*"
    - "tools/**/*"
    - "!generated/docs"
    - "!generated/docs/**"

tasks:
  lint:
    tags: ["quality", "static"]
    command: "bash src/extensions/tools/check-extension-model.sh --check"
    inputs:
      - "@group(legal-files)"
      - project: "postgres18"
        group: "source"
      - "@group(model)"
      - project: "extension-runtime-contract"
        group: "contract"
      - "/src/shared/fixtures/extensions/**/*"
      - project: "third-party-native"
        group: "sources"
      - project: "third-party-shared"
        group: "sources"
      - "/src/sdks/rust/src/generated/extensions.rs"
      - "/src/sdks/js/src/generated/extensions.ts"
      - "/src/sdks/kotlin/oliphaunt/src/commonMain/kotlin/dev/oliphaunt/GeneratedExtensions.kt"
      - "/src/sdks/react-native/src/generated/extensions.ts"
      - "/examples/react-native-expo/src/generated/extension-smoke.ts"
      - "/src/runtimes/liboliphaunt/licenses/openssl-3.5.6-LICENSE.txt"
      - "/src/runtimes/liboliphaunt/licenses/postgresql-18.4-COPYRIGHT"
      - "/src/sdks/kotlin/oliphaunt-android-gradle-plugin/src/main/resources/dev/oliphaunt/android/extension-legal-catalog.json"
      - "/src/sources/tools/source-fetch-core.mts"
      - "/src/extensions/tools/extension-upstream-licenses.mts"
      - "@group(release-archive-contract)"
      - "/src/shared/product-metadata/query.mts"
      - "@group(release-target-contract)"
      - "/src/shared/product-metadata/platform-compatibility-policy.test.mts"
      - "/src/shared/product-metadata/release-graph.mts"
    options:
      cache: true
      runFromWorkspaceRoot: true
  unit:
    tags: ["quality", "unit"]
    command: "bash tools/dev/bun.sh test '--path-ignore-patterns=target/**' src/extensions/tools/native-component-contract.test.mts src/extensions/tools/extension-model.test.mts"
    inputs:
      - "catalog/native-components.toml"
      - "catalog/extensions.source.json"
      - "tools/native-component-contract.mts"
      - "tools/native-component-contract.test.mts"
      - "tools/extension-model.test.mts"
      - "tools/extension-evidence.mts"
      - "tools/extension-projections.mts"
      - "@group(model)"
      - "/src/shared/fixtures/extensions/**/*"
      - "/src/sources/third-party/{shared,native}/**/*.toml"
      - "/src/runtimes/liboliphaunt/native/portable-uuid/**/*"
      - project: "extension-runtime-contract"
        group: "contract"
    options:
      cache: true
      runFromWorkspaceRoot: true

  packaging-unit:
    tags: ["quality", "unit"]
    command: "bash tools/dev/bun.sh test --timeout=30000 src/extensions/tools/extension-upstream-licenses.test.mts src/extensions/tools/android-extension-legal-catalog.test.mts"
    inputs:
      - "external/**/upstream-license-data.json"
      - "external/**/upstream-licenses/**/*"
      - "generated/sdk/extensions.json"
      - "/src/sdks/kotlin/oliphaunt-android-gradle-plugin/src/main/resources/dev/oliphaunt/android/extension-legal-catalog.json"
      - "/src/runtimes/liboliphaunt/licenses/*"
      - "@group(legal-files)"
      - "@group(release-target-contract)"
      - "@group(package-test-metadata)"
      - "**/*.{mjs,mts}"
      - "/tools/test/**/*"
      - "/tools/dev/bun.sh"
      - "/src/shared/artifact-packaging/*.{mts,sh}"
      - "/src/shared/product-metadata/*.{mjs,mts}"
    options:
      cache: true
      runFromWorkspaceRoot: true
