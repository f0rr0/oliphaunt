$schema: "https://moonrepo.dev/schemas/project.json"

id: "extension-pgmq"
language: "unknown"
layer: "configuration"
stack: "systems"
tags: ["extensions", "external", "qualification-candidate"]
dependsOn:
  - "extension-runtime-contract"
  - id: "liboliphaunt-native"
    scope: "build"
  - id: "liboliphaunt-wasix"
    scope: "build"

tasks:
  check:
    tags: ["quality", "static"]
    command: "bun src/extensions/tools/check-extension-tree.mjs src/extensions/external/pgmq"
    deps:
      - "extension-runtime-contract:check"
    inputs:
      - "/src/extensions/external/pgmq/**/*"
      - "/src/extensions/tools/check-extension-tree.mjs"
      - "/src/shared/extension-runtime-contract/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
