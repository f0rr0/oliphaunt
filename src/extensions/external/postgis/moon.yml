$schema: "https://moonrepo.dev/schemas/project.json"

id: "oliphaunt-extension-postgis"
language: "unknown"
layer: "library"
stack: "systems"
tags: ["extensions", "external", "postgis", "release-product"]
dependsOn:
  - "extension-runtime-contract"
  - id: "liboliphaunt-native"
    scope: "build"
  - id: "liboliphaunt-wasix"
    scope: "build"

project:
  release:
    component: "oliphaunt-extension-postgis"
    packagePath: "src/extensions/external/postgis"

tasks:
  assemble-release:
    tags: ["release", "artifact-package"]
    command: "bash tools/dev/bun.sh tools/release/build-extension-ci-artifacts.mjs oliphaunt-extension-postgis --require-native --require-wasix"
    inputs:
      - "/.release-please-manifest.json"
      - "/release-please-config.json"
      - "/src/extensions/external/postgis/**/*"
      - "/src/extensions/generated/wasix/extensions.json"
      - "/tools/release/build-extension-ci-artifacts.mjs"
      - "/tools/release/extension-runtime-asset-contract.mjs"
      - "/tools/release/release-artifact-targets.mjs"
      - "/tools/release/release-graph.mjs"
      - "/target/extensions/native/release-assets/**/*"
      - "/target/extensions/wasix/release-assets/**/*"
    outputs:
      - "/target/extension-artifacts/oliphaunt-extension-postgis/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
