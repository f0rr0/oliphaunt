$schema: "https://moonrepo.dev/schemas/project.json"

id: "source-inputs"
language: "unknown"
layer: "configuration"
stack: "systems"
tags: ["javascript-quality", "sources"]

project:
  title: "Source Inputs"
  description: "Neutral source checkout materialization for PostgreSQL, runtime dependencies, toolchains, and extension-owned sources."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  unit:
    tags: ["quality", "unit"]
    script: |
      set -e
      bash src/sources/tools/fetch-sources.sh production-all --validate-only
      bun test src/sources/tools/source-fetch-core.test.mts src/sources/tools/source-fetch-scopes.test.mts
      bash src/postgres/versions/18/fetch-source.test.sh
    inputs:
      - "/src/postgres/versions/18/**/*"
      - "/src/sources/third-party/**/*.toml"
      - "/src/extensions/external/**/source.toml"
      - "/src/extensions/external/**/dependencies/**/source.toml"
      - "/src/extensions/external/*/upstream-license-data.json"
      - "tools/**/*"
      - "/src/shared/artifact-packaging/portable-archive.mts"
      - "/tools/test/{zip,tar}-fixture.mts"
    options:
      cache: true
      runFromWorkspaceRoot: true
  fetch-all:
    tags: ["source", "fetch"]
    command: "bash src/sources/tools/fetch-sources.sh production-all --force"
    inputs:
      - "/src/sources/third-party/**/*.toml"
      - "/src/extensions/external/**/source.toml"
      - "/src/extensions/external/**/dependencies/**/source.toml"
      - "/src/extensions/external/*/upstream-license-data.json"
      - "tools/**/*"
      - "!tools/**/*.test.*"
      - "!tools/verify-source-tree.mts"
      - "/tools/dev/curl-platform-flags.sh"
      - "/src/extensions/tools/extension-upstream-licenses.mts"
      - "@group(release-archive-contract)"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  source-fetch-native-runtime:
    tags: ["source", "fetch"]
    command: "bash src/sources/tools/fetch-sources.sh native-runtime --force"
    inputs:
      - "/src/sources/third-party/shared/*.toml"
      - "/src/sources/third-party/native/*.toml"
      - "/src/extensions/external/**/source.toml"
      - "/src/extensions/external/**/dependencies/**/source.toml"
      - "/src/extensions/external/*/upstream-license-data.json"
      - "tools/**/*"
      - "!tools/**/*.test.*"
      - "!tools/verify-source-tree.mts"
      - "/tools/dev/curl-platform-flags.sh"
      - "@group(release-archive-contract)"
    options:
      cache: false
      internal: true
      runFromWorkspaceRoot: true
  source-fetch-wasix-runtime:
    tags: ["source", "fetch"]
    command: "bash src/sources/tools/fetch-sources.sh wasix-runtime --force"
    inputs:
      - "/src/sources/third-party/shared/*.toml"
      - "/src/extensions/external/**/source.toml"
      - "/src/extensions/external/**/dependencies/**/source.toml"
      - "/src/extensions/external/*/upstream-license-data.json"
      - "tools/**/*"
      - "!tools/**/*.test.*"
      - "!tools/verify-source-tree.mts"
      - "/tools/dev/curl-platform-flags.sh"
      - "@group(release-archive-contract)"
    options:
      cache: false
      internal: true
      runFromWorkspaceRoot: true
  source-fetch-wasix-postmaster-runtime:
    tags: ["source", "fetch"]
    command: "bash src/sources/tools/fetch-sources.sh wasix-postmaster-runtime --force"
    inputs:
      - "/src/sources/third-party/shared/*.toml"
      - "/src/sources/third-party/wasix-postmaster/*.toml"
      - "tools/**/*"
      - "!tools/**/*.test.*"
      - "!tools/verify-source-tree.mts"
      - "/tools/dev/curl-platform-flags.sh"
    options:
      cache: false
      internal: true
      runFromWorkspaceRoot: true
  source-fetch-extensions:
    tags: ["source", "fetch"]
    command: "bash src/sources/tools/fetch-sources.sh extensions --force"
    inputs:
      - "/src/extensions/external/**/source.toml"
      - "/src/extensions/external/**/dependencies/**/source.toml"
      - "/src/extensions/external/*/upstream-license-data.json"
      - "tools/**/*"
      - "!tools/**/*.test.*"
      - "!tools/verify-source-tree.mts"
      - "/tools/dev/curl-platform-flags.sh"
      - "/src/extensions/tools/extension-upstream-licenses.mts"
      - "@group(release-archive-contract)"
    options:
      cache: false
      runFromWorkspaceRoot: true
