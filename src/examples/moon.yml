$schema: "https://moonrepo.dev/schemas/project.json"

id: "integration-examples"
language: "typescript"
layer: "application"
stack: "frontend"
tags: ["javascript-quality", "examples", "integration"]
dependsOn:
  - id: "extension-packages"
    scope: "build"
  - id: "extensions"
    scope: "build"
  - "liboliphaunt-native"
  - "oliphaunt-broker"
  - "oliphaunt-js"
  - "oliphaunt-kotlin"
  - "oliphaunt-node-direct"
  - "oliphaunt-react-native"
  - "oliphaunt-swift"
  - "oliphaunt-wasix-ts"
  - "release-tools"

project:
  title: "Integration Examples"
  description: "Cross-product examples and installed-app validation entrypoints."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  browser-wasix-typecheck:
    tags: ["quality", "static", "browser", "wasix"]
    command: "bun run --cwd src/examples/wasix/browser typecheck"
    deps:
      - "oliphaunt-query-ts:build"
    inputs:
      - "wasix/browser/**/*"
      - project: "oliphaunt-wasix-ts"
        group: "code"
      - "@group(bun-workspace)"
    options:
      cache: true
      runFromWorkspaceRoot: true

  test:
    tags: ["quality", "unit"]
    script: |
      set -e
      bash src/examples/tools/stage-tauri-webdriver-app.test.sh
      bash src/examples/tools/run-tauri-webdriver-smoke.test.sh
      bash tools/dev/bun.sh test src/examples/native/react-native-expo/tools/smoke-pass-receipt.test.mts src/examples/native/react-native-expo/tools/mobile-extension-proof.test.mts
    inputs:
      - "/tools/dev/bun.sh"
      - "**/*"
      - "@group(bun-workspace)"
      - "!/src/examples/**/node_modules"
      - "!/src/examples/**/node_modules/**"
    options:
      cache: true
      runFromWorkspaceRoot: true
  react-native-android-build:
    tags: ["mobile", "build", "android", "ci-mobile-build-android"]
    script: |
      export OLIPHAUNT_EXPO_EXTENSION_ARTIFACT_ROOT="${OLIPHAUNT_EXPO_EXTENSION_ARTIFACT_ROOT:-$PWD/target/mobile-extension-artifacts}"
      exec bun run --cwd src/examples/native/react-native-expo mobile-build:android
    deps:
      - "oliphaunt-query-ts:package"
      - "database-resources:build-native-android-icu"
      - "database-resources:package-icu"
      - "extension-packages:package-mobile"
      - "liboliphaunt-native:package-runtime-android-x86_64"
      - "liboliphaunt-native:finalize-runtime-android-abi"
      - "oliphaunt-kotlin:package"
      - "oliphaunt-react-native:package"
    inputs:
      - "native/react-native-expo/**/*"
      - project: "oliphaunt-kotlin"
        group: "code"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/target/mobile-extension-artifacts/**/*"
      - "/target/sdk-artifacts/oliphaunt-kotlin/**/*"
      - "/target/sdk-artifacts/oliphaunt-react-native/**/*"
      - "/src/native/runtime/packaging/**/*"
    outputs:
      - "/target/mobile-build/react-native/android/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
  react-native-android-e2e:
    tags: ["mobile", "e2e", "android"]
    command: "bun run --cwd src/examples/native/react-native-expo mobile-e2e:android"
    deps:
      - "integration-examples:react-native-android-build"
    inputs:
      - "native/react-native-expo/src/**/*"
      - "native/react-native-expo/maestro/**/*"
      - "native/react-native-expo/package.json"
      - project: "oliphaunt-react-native"
        group: "code"
      - "/tools/dev/maestro.toml"
      - "/tools/dev/setup-maestro.sh"
      - "/target/mobile-build/react-native/android/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: skip
  react-native-android-drill:
    tags: ["mobile", "drill", "android"]
    command: "bun run --cwd src/examples/native/react-native-expo mobile-drill:android"
    inputs:
      - "native/react-native-expo/**/*"
      - project: "oliphaunt-kotlin"
        group: "code"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/src/native/runtime/packaging/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  react-native-ios-build:
    tags: ["mobile", "build", "ios", "ci-mobile-build-ios"]
    script: |
      export OLIPHAUNT_EXPO_EXTENSION_ARTIFACT_ROOT="${OLIPHAUNT_EXPO_EXTENSION_ARTIFACT_ROOT:-$PWD/target/mobile-extension-artifacts}"
      exec bun run --cwd src/examples/native/react-native-expo mobile-build:ios
    deps:
      - "oliphaunt-query-ts:package"
      - "database-resources:build-native-ios-icu"
      - "database-resources:package-icu"
      - "extension-packages:package-mobile"
      - "liboliphaunt-native:package-runtime-ios-xcframework"
      - "oliphaunt-react-native:package"
      - "oliphaunt-swift:package"
    inputs:
      - "native/react-native-expo/**/*"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "oliphaunt-swift"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/target/mobile-extension-artifacts/**/*"
      - "/target/sdk-artifacts/oliphaunt-react-native/**/*"
      - "/target/sdk-artifacts/oliphaunt-swift/**/*"
      - "/src/native/runtime/packaging/**/*"
    outputs:
      - "/target/mobile-build/react-native/ios/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
  react-native-ios-e2e:
    tags: ["mobile", "e2e", "ios"]
    command: "bun run --cwd src/examples/native/react-native-expo mobile-e2e:ios"
    deps:
      - "integration-examples:react-native-ios-build"
    inputs:
      - "native/react-native-expo/src/**/*"
      - "native/react-native-expo/maestro/**/*"
      - "native/react-native-expo/package.json"
      - project: "oliphaunt-react-native"
        group: "code"
      - "/tools/dev/maestro.toml"
      - "/tools/dev/setup-maestro.sh"
      - "/target/mobile-build/react-native/ios/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: skip
  react-native-ios-drill:
    tags: ["mobile", "drill", "ios"]
    command: "bun run --cwd src/examples/native/react-native-expo mobile-drill:ios"
    inputs:
      - "native/react-native-expo/**/*"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "oliphaunt-swift"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/src/native/runtime/packaging/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
