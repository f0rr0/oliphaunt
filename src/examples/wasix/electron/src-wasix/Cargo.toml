[package]
name = "oliphaunt-electron-wasix-sidecar"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
oliphaunt-pgwire-server = { version = "0.1.0", path = "../../../../wasix/pgwire-server", features = ["extensions"] }
anyhow = "1"
oliphaunt-wasix = { version = "=0.2.0", path = "../../../../wasix/sdks/rust", features = [
  "extension-hstore",
  "extension-pg-trgm",
  "extension-unaccent",
] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }

[dev-dependencies]
oliphaunt-wasix = { version = "=0.2.0", path = "../../../../wasix/sdks/rust", features = ["tools"] }
oliphaunt-wasix-tools = { version = "=0.2.1", path = "../../../../wasix/postgres-tools/crates/tools" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
liboliphaunt-wasix-aot-x86_64-unknown-linux-gnu = { version = "=0.2.0", path = "../../../../wasix/runtime/crates/aot/x86_64-unknown-linux-gnu" }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dev-dependencies]
oliphaunt-wasix-tools-aot-x86_64-unknown-linux-gnu = { version = "=0.2.1", path = "../../../../wasix/postgres-tools/crates/aot/x86_64-unknown-linux-gnu" }
