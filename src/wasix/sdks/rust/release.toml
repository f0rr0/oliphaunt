id = "oliphaunt-wasix-rust"
owner = "@oliphaunt/wasix-rust"
kind = "sdk"
publish_targets = ["crates-io", "github-release"]
registry_packages = [
  "crates:oliphaunt-wasix",
  "crates:oliphaunt-wasmer",
  "crates:oliphaunt-wasmer-wasix",
  "crates:oliphaunt-wasmer-wasix-types",
  "crates:oliphaunt-wasmer-journal",
  "crates:oliphaunt-wasmer-v8-windows-x64-msvc",
]
release_artifacts = ["cargo-crate", "windows-v8-relink"]
exact_extension_runtime = "liboliphaunt-wasix"

[compatibility_versions.runtime]
public_support = false
source_product = "liboliphaunt-wasix"
path = "src/wasix/sdks/rust/Cargo.toml"
parser = "toml:package.metadata.oliphaunt.runtime-version"

[compatibility_versions.tools]
public_support = false
source_product = "postgres-tools-wasix"
path = "src/wasix/sdks/rust/Cargo.toml"
parser = "toml:package.metadata.oliphaunt.tools-version"

[compatibility_versions.icu]
public_support = false
source_product = "database-resources"
path = "src/wasix/sdks/rust/Cargo.toml"
parser = "toml:package.metadata.oliphaunt.icu-version"

[compatibility_versions.oliphaunt-wasix-rust-query]
public_support = false
source_product = "oliphaunt-query"
path = "src/wasix/sdks/rust/Cargo.toml"
parser = "toml:dependencies.oliphaunt-query.version"
