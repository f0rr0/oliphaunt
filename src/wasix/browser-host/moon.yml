$schema: "https://moonrepo.dev/schemas/project.json"

id: "wasix-browser-host"
language: "rust"
layer: "library"
stack: "frontend"

tasks:
  test:
    tags: ["quality", "unit"]
    command: "bun test src/wasix/browser-host/clock.test.mts"
    inputs: ["clock.test.mts", "adapter/clock.rs", "patches/0045-wasmer-wasix-correct-browser-clock-domains.patch"]
    options:
      runFromWorkspaceRoot: true
  build:
    tags: ["artifact", "build", "requires-rust"]
    command: "bash src/wasix/browser-host/build-sdk.sh"
    env:
      WASM_PACK_VERSION: "0.15.0"
    inputs:
      - "**/*"
      - "/tools/dev/node-info.mts"
      - "/tools/dev/curl-platform-flags.sh"
      - "/tools/dev/acquisition.sh"
      - "/src/third-party/tools/{fetch-sources.sh,source-fetch-core.mts,source-archive.mts}"
      - "/src/wasix/runtime/protocol-contract/contract.json"
      - "/src/wasix/runtime/protocol-contract/generate.mjs"
      - "/src/wasix/runtime/assets/build/wasix_shim/oliphaunt_wasix_protocol_contract.generated.h"
      - "/src/wasix/sdks/rust/src/oliphaunt/protocol_limits_generated.rs"
      - "/src/wasix/sdks/ts/src/protocol-limits.generated.ts"
      - "@group(cargo-workspace)"
    outputs:
      - "/target/oliphaunt-wasix-ts/host/wasmer-sdk/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
