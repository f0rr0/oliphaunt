[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
aot-serializer = [
  "dep:wasmer",
  "dep:wasmer-types",
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.9"
walkdir = "2"
wasmer = { version = "=7.5.0", default-features = false, optional = true }
wasmer-types = { version = "=7.5.0", optional = true }
wasmparser = "0.261.0"
zstd = "0.13"

[target.'cfg(not(windows))'.dependencies]
wasmer = { version = "=7.5.0", default-features = false, optional = true, features = [
  "sys", "llvm", "wasmer-artifact-create",
] }

[target.'cfg(windows)'.dependencies]
wasmer = { version = "=7.5.0", default-features = false, optional = true, features = ["v8"] }
