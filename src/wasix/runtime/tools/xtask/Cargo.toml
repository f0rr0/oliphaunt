[package]
name = "xtask"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license.workspace = true
publish = false

[features]
default = []
aot-serializer = [
  "dep:wasmer",
  "wasmer/llvm",
  "wasmer/wasmer-artifact-create",
  "dep:wasmer-types",
]

[dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
toml = "0.9"
walkdir = "2"
wasmer = { version = "=7.5.0", default-features = false, features = [
  "sys",
], optional = true }
wasmer-types = { version = "=7.5.0", optional = true }
wasmparser = "0.261.0"
zstd = "0.13"
