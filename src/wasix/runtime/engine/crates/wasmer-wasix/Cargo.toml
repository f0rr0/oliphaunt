[package]
edition = "2024"
rust-version = "1.96"
name = "oliphaunt-wasmer-wasix"
version = "0.3.1"
authors = ["Wasmer Engineering Team <engineering@wasmer.io>"]
build = false
exclude = ["tests/wasm_tests/*/**"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "WASI and WASIX implementation library for Wasmer WebAssembly runtime"
homepage = "https://wasmer.io/"
readme = "upstream/README.md"
keywords = [
    "wasm",
    "webassembly",
    "wasi",
    "sandbox",
    "ABI",
]
categories = [
    "wasm",
    "os",
]
license = "MIT"
repository = "https://github.com/wasmerio/wasmer"

[package.metadata.docs.rs]
features = [
    "wasmer/sys",
    "wasmer/cranelift",
    "sys-default",
]
rustc-args = [
    "--cfg",
    "docsrs",
]

[features]
compiler = []
ctrlc = ["tokio/signal"]
default = ["sys-default"]
disable-all-logging = [
    "tracing/release_max_level_off",
    "tracing/max_level_off",
]
enable-serde = [
    "wasmer-wasix-types/enable-serde",
    "wasmer/enable-serde",
]
extra-logging = []
host-fs = ["virtual-fs/host-fs"]
host-reqwest = ["reqwest"]
host-threads = []
host-vnet = ["virtual-net/host-net"]
journal = [
    "tokio/fs",
    "wasmer-journal/log-file",
]
js = [
    "virtual-fs/js",
    "getrandom/wasm_js",
    "chrono",
    "js-sys",
    "wasm-bindgen",
    "wasm-bindgen-futures",
    "web-sys",
    "wasmer/js-default",
    "wasmer/wasm-types-polyfill",
    "wasmer/wat",
    "wasmer/js-serializable-module",
]
js-default = ["js"]
llvm = ["wasmer/llvm"]
logging = ["tracing/log"]
remote-vnet = ["virtual-net/remote"]
singlepass = ["wasmer/singlepass"]
sys = [
    "webc/mmap",
    "time",
    "virtual-mio/sys",
    "logging",
    "host-fs",
    "journal",
    "sys-poll",
    "sys-thread",
    "host-vnet",
    "host-threads",
    "host-reqwest",
    "ctrlc",
    "wasmer/wat",
    "wasmer/js-serializable-module",
    "wasmer/sys",
    "wasmer/headless",
]
sys-default = ["sys"]
sys-minimal = [
    "wasmer/sys",
    "sys-thread",
    "tokio/fs",
]
sys-poll = []
sys-thread = [
    "tokio/rt",
    "tokio/time",
    "tokio/rt-multi-thread",
    "rusty_pool",
]
test-js = [
    "js",
    "wasmer/wat",
]
time = ["tokio/time"]
v8 = ["wasmer/v8"]

[lib]
name = "wasmer_wasix"
path = "upstream/src/lib.rs"

[dependencies.anyhow]
version = "1.0"

[dependencies.async-trait]
version = "0.1.68"

[dependencies.base64]
version = "0.23.0"

[dependencies.bincode]
version = "=2.0.1"

[dependencies.blake3]
version = "1.0"

[dependencies.bus]
version = "2.4.1"

[dependencies.bytecheck]
version = "0.8.2"

[dependencies.bytes]
version = "1.11.1"

[dependencies.chrono]
version = "0.4.38"
features = [
    "wasmbind",
    "std",
    "clock",
]
optional = true
default-features = false

[dependencies.cooked-waker]
version = "5"

[dependencies.crossbeam-channel]
version = "0.5.15"

[dependencies.dashmap]
version = "6.1.0"

[dependencies.derive_more]
version = "2.0.1"
features = [
    "debug",
    "display",
]

[dependencies.flate2]
version = "1.0.34"

[dependencies.fnv]
version = "1.0.3"

[dependencies.fs_extra]
version = "1.3.0"

[dependencies.futures]
version = "0.3.30"

[dependencies.getrandom]
version = "0.4.1"

[dependencies.heapless]
version = "0.9.2"

[dependencies.hex]
version = "0.4"

[dependencies.http]
version = "1.4.0"

[dependencies.http-body-util]
version = "0.1.1"
optional = true

[dependencies.hyper]
version = "1.8.1"
features = ["server"]
optional = true

[dependencies.hyper-util]
version = "0.1.5"
features = [
    "server",
    "server-graceful",
    "tokio",
    "service",
    "client",
]
optional = true

[dependencies.itertools]
version = "0.15"

[dependencies.js-sys]
version = "0.3.77"
optional = true

[dependencies.libtest-mimic]
version = "0.8.2"

[dependencies.linked_hash_set]
version = "0.1.6"

[dependencies.lz4_flex]
version = "0.14.0"

[dependencies.num_enum]
version = "0.7.3"

[dependencies.once_cell]
version = "1.17.1"

[dependencies.petgraph]
version = "0.8.3"

[dependencies.pin-project]
version = "1.0.12"

[dependencies.pin-utils]
version = "0.1.0"

[dependencies.rand]
version = "0.10.1"

[dependencies.rayon]
version = "1.7.0"
optional = true

[dependencies.rkyv]
version = "0.8.13"
features = [
    "indexmap-2",
    "bytes-1",
]

[dependencies.rusty_pool]
version = "1.0.0"
optional = true

[dependencies.semver]
version = "1.0"

[dependencies.serde]
version = "1"
features = ["derive"]
default-features = false

[dependencies.serde_derive]
version = "1"

[dependencies.serde_json]
version = "1"

[dependencies.serde_yaml]
version = "0.9.34"

[dependencies.sha2]
version = "0.11.0"

[dependencies.shared-buffer]
version = "0.1.4"

[dependencies.tempfile]
version = "3.6.0"

[dependencies.thiserror]
version = "2.0.17"

[dependencies.tokio]
version = "1.39.0"
features = [
    "sync",
    "macros",
    "time",
    "rt",
]
default-features = false

[dependencies.tokio-stream]
version = "0.1"
features = ["sync"]

[dependencies.toml]
version = "1.1.0"
features = ["preserve_order"]

[dependencies.tower]
version = "0.5.2"
features = [
    "make",
    "util",
]
optional = true

[dependencies.tower-http]
version = "0.7.0"
features = [
    "trace",
    "util",
    "catch-panic",
    "cors",
]
optional = true

[dependencies.tracing]
version = "0.1"
default-features = false

[dependencies.url]
version = "2.5"

[dependencies.urlencoding]
version = "2"

[dependencies.virtual-fs]
version = "0.705.0"
features = ["webc-fs"]
default-features = false

[dependencies.virtual-mio]
version = "0.705.0"
default-features = false

[dependencies.virtual-net]
version = "0.705.0"
features = ["rkyv"]
default-features = false

[dependencies.waker-fn]
version = "1.1"

[dependencies.walkdir]
version = "2.3.2"

[dependencies.wasm-bindgen]
version = "0.2.120"
optional = true

[dependencies.wasm-bindgen-futures]
version = "0.4.70"
optional = true

[dependencies.wasm-encoder]
version = "0.259.0"
features = ["std"]
default-features = false

[dependencies.wasmer]
package = "oliphaunt-wasmer"
path = "../wasmer"
version = "*"
features = ["experimental-async"]
default-features = false

[dependencies.wasmer-config]
version = "0.705.0"

[dependencies.wasmer-journal]
package = "oliphaunt-wasmer-journal"
path = "../wasmer-journal"
version = "*"
default-features = false

[dependencies.wasmer-package]
version = "0.705.0"

[dependencies.wasmer-types]
version = "=7.5.0"
default-features = false

[dependencies.wasmer-wasix-types]
package = "oliphaunt-wasmer-wasix-types"
path = "../wasmer-wasix-types"
version = "*"
features = ["enable-serde"]

[dependencies.wasmparser]
version = "0.259.0"
features = [
    "validate",
    "features",
    "simd",
]
default-features = false

[dependencies.wcgi]
version = "0.3.0"
optional = true

[dependencies.wcgi-host]
version = "0.3.0"
optional = true

[dependencies.web-sys]
version = "0.3.64"
features = [
    "Request",
    "RequestInit",
    "Window",
    "WorkerGlobalScope",
    "RequestMode",
    "Response",
    "Headers",
]
optional = true

[dependencies.webc]
version = "=12.0.1"
features = [
    "v2",
    "v3",
]
default-features = false

[dependencies.xxhash-rust]
version = "0.8.10"
features = ["xxh64"]
default-features = false

[target.'cfg(all(unix, not(target_os="ios")))'.dependencies.termios]
version = "0.3"

[target.'cfg(any(target_arch = "riscv64", target_arch = "loongarch64"))'.dependencies.reqwest]
version = "0.13.0"
features = [
    "native-tls",
    "json",
    "stream",
    "socks",
    "blocking",
]
optional = true
default-features = false

[target.'cfg(not(any(target_arch = "riscv64", target_arch = "loongarch64")))'.dependencies.reqwest]
version = "0.13.0"
features = [
    "rustls",
    "json",
    "stream",
    "socks",
    "blocking",
]
optional = true
default-features = false

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.terminal_size]
version = "0.4.3"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.zstd]
version = "0.14.0"

[target.'cfg(target_arch = "wasm32")'.dependencies.getrandom03]
version = "0.3.4"
features = ["wasm_js"]
package = "getrandom"

[target."cfg(unix)".dependencies.libc]
version = "0.2.178"
default-features = false

[target."cfg(windows)".dependencies.windows-sys]
version = "0.61.2"
features = ["Win32_System_SystemInformation"]
default-features = false
