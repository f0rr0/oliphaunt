[package]
name = "oliphaunt-node-direct"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
liboliphaunt-native-bindings = { path = "../rust-bindings" }
napi = { version = "=3.14.0", default-features = false, features = ["napi8"] }
napi-derive = { version = "=3.6.10", default-features = false, features = ["strict", "type-def"] }

[build-dependencies]
napi-build = "=2.6.0"
