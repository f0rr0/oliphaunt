id = "oliphaunt-kotlin"
owner = "@oliphaunt/sdk-android"
kind = "sdk"
publish_targets = ["maven-central"]
registry_packages = [
  "maven:dev.oliphaunt:oliphaunt-android",
  "maven:dev.oliphaunt:oliphaunt-android-gradle-plugin",
  "maven:dev.oliphaunt.android:dev.oliphaunt.android.gradle.plugin",
]
release_artifacts = [
  "gradle-module-metadata",
  "android-adapter-aar",
  "android-consumer-gradle-plugin",
  "android-consumer-gradle-plugin-marker",
  "maven-publication",
  "runtime-assets-external",
]
embedded_cargo_manifests = ["src/native/mobile-bindings/Cargo.toml"]
exact_extension_runtime = "liboliphaunt-native"

[compatibility_versions.oliphaunt-kotlin-liboliphaunt]
public_support = false
source_product = "liboliphaunt-native"
path = "src/native/sdks/kotlin/oliphaunt-android-gradle-plugin/src/main/resources/dev/oliphaunt/android/liboliphaunt.version"
parser = "raw"
