[package]
name = "oliphaunt"
version = "0.3.1"
edition = "2024"
rust-version = "1.93"
description = "Native-first Rust SDK surface for embedded PostgreSQL through liboliphaunt."
readme = "README.md"
repository.workspace = true
homepage.workspace = true
license = "MIT"
exclude = [
  ".gitignore",
  "crates/oliphaunt-build/**",
  "moon.yml",
  "release.toml",
  "tools/**",
]
links = "oliphaunt_artifact_relay"
build = "build.rs"

[lib]
name = "oliphaunt"
path = "src/lib.rs"

[features]
default = ["desktop"]
desktop = ["dep:oliphaunt-broker", "dep:getrandom"]
mobile-bindings = ["dep:oliphaunt-broker", "dep:libc"]

[package.metadata.oliphaunt]
broker-helper = "oliphaunt-broker"
broker-version = "0.3.0"
native-version = "0.3.1"

[dependencies]
oliphaunt-broker = { path = "../../broker", version = "0.3.0", optional = true }
liboliphaunt-native-bindings = { version = "0.2.0", path = "../../rust-bindings" }
oliphaunt-query = { version = "0.1.1", path = "../../../query/rust" }
getrandom = { version = "0.3", optional = true }
libc = { version = "0.2", optional = true }

[build-dependencies]
oliphaunt-build = { version = "0.3.1", path = "crates/oliphaunt-build" }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
