$schema: "https://moonrepo.dev/schemas/project.json"
id: "oliphaunt-mobile-bindings"
language: "rust"
tags: ["cargo-package"]
layer: "library"
stack: "systems"
dependsOn:
  - "oliphaunt-rust"
  - "liboliphaunt-native-bindings"
  - id: "oliphaunt-query"
    scope: "build"
fileGroups:
  cargo-sources:
    - "uniffi.toml"
    - "tools/generate.sh"
tasks:
  test:
    tags: ["quality", "unit", "requires-rust"]
    script: |
      set -e
      cargo test -p oliphaunt --no-default-features --features mobile-bindings --lib --locked
      cargo test -p oliphaunt-mobile-bindings --lib --locked
    deps: [{target: "cargo-sources", cacheStrategy: hash}]
    inputs: ["@group(cargo-workspace)", "src/**/*", "/src/native/sdks/rust/src/**/*", "/src/native/broker/src/**/*"]
    options:
      runFromWorkspaceRoot: true
  test-native:
    tags: ["ci-native-consumers", "platform-linux-x64-gnu", "integration", "runtime", "requires-rust"]
    script: |
      set -e
      bash src/native/sdks/tests/with-runtime.sh cargo nextest run -p oliphaunt --no-default-features --features mobile-bindings --test mobile_broker --locked --no-tests=fail --test-threads=1
    deps: ["liboliphaunt-native:package-runtime-desktop-target", "~:cargo-sources"]
    inputs: ["/src/native/sdks/tests/with-runtime.sh", "/src/native/runtime/tools/runtime-preflight.sh", "@group(cargo-workspace)", "src/**/*", "/src/native/sdks/rust/src/**/*", "/src/native/sdks/rust/tests/mobile_broker.rs", "/src/native/broker/src/**/*"]
    options:
      runFromWorkspaceRoot: true
      cache: false
  dependency-license-audit:
    tags: ["quality", "static", "requires-rust"]
    command: "bash tools/packaging/audit-rust-dependency-licenses.sh src/native/mobile-bindings/tools/dependency-license-contract.mts oliphaunt-mobile-bindings"
    inputs:
      - "dependency-licenses.json"
      - "dependency-license-blobs/**/*"
      - "tools/dependency-license-contract.mts"
      - "/Cargo.lock"
      - "/**/Cargo.toml"
      - "/tools/packaging/audit-rust-dependency-licenses.sh"
      - "/tools/packaging/rust-dependency-license-contract.mts"
      - "/tools/packaging/release-directory-safety.mts"
    options:
      runFromWorkspaceRoot: true

  format:
    command: "cargo fmt"
    options:
      cache: false
      runInCI: false
  format-check:
    tags: ["quality", "static", "format", "requires-rust"]
    command: "cargo fmt --check"
    inputs: ["src/**/*", "build.rs", "Cargo.toml"]
  lint:
    deps:
      - target: cargo-sources
        cacheStrategy: hash
    tags: ["quality", "static", "requires-rust"]
    command: "cargo clippy --locked --all-targets -- -D warnings"
    inputs: ["src/**/*", "build.rs", "Cargo.toml", "/Cargo.lock", "/Cargo.toml"]
  build:
    deps:
      - target: cargo-sources
        cacheStrategy: hash
    tags: ["build", "requires-rust"]
    command: "cargo build --locked --lib"
    # Consumers also use Cargo's native libraries, not only generated declarations.
    # Cargo owns incremental caching until all consumed artifacts are restorable.
    options:
      cache: false
    inputs:
      - "src/**/*"
      - "build.rs"
      - "Cargo.toml"
      - "@group(cargo-workspace)"
      - project: "oliphaunt-query"
        group: "sources"
  generate:
    tags: ["build", "requires-rust"]
    command: "bash tools/generate.sh"
    options:
      cache: false
    deps: [{target: "cargo-sources", cacheStrategy: hash}]
    inputs: ["src/**/*", "tools/generate.sh", "uniffi.toml", "Cargo.toml", "/Cargo.lock", "/Cargo.toml"]
    outputs: ["/target/mobile-bindings/generated/**/*"]
