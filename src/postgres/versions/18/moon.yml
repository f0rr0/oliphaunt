$schema: "https://moonrepo.dev/schemas/project.json"

id: "postgres18"
language: "unknown"
layer: "configuration"
stack: "systems"
tags: ["postgres", "source", "pg18"]

project:
  title: "PostgreSQL 18 Source"
  description: "Shared PostgreSQL 18.4 source pin and checksum."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

fileGroups:
  source:
    - "source.toml"
  regression:
    - "embedded_schedule"
    - "run-regression.sh"
    - "/src/runtimes/liboliphaunt/wasix-postmaster/bin/build-native-client-tools.sh"
    - "/src/runtimes/liboliphaunt/wasix-postmaster/bin/prepare-baseline.sh"
    - "/src/runtimes/liboliphaunt/wasix-postmaster/lib/common.sh"

tasks:
  regression-tools:
    command: "bash src/runtimes/liboliphaunt/wasix-postmaster/bin/build-native-client-tools.sh"
    inputs:
      - "@group(source)"
      - "@group(regression)"
      - "fetch-source.sh"
    options:
      cache: false
      runFromWorkspaceRoot: true
  unit:
    tags: ["quality", "unit"]
    command: "bash src/postgres/versions/18/run-regression.test.sh"
    inputs:
      - "@group(regression)"
      - "run-regression.test.sh"
    options:
      cache: true
      runFromWorkspaceRoot: true
