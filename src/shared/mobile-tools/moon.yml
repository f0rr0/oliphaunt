$schema: "https://moonrepo.dev/schemas/project.json"
id: "mobile-tools"
language: "bash"
layer: "tool"
stack: "infrastructure"
tags: ["javascript-quality"]
tasks:
  unit:
    tags: ["quality", "unit"]
    script: |
      set -eu
      for test in src/shared/mobile-tools/*.test.sh; do
        bash "$test"
      done
    inputs:
      - "**/*"
      - "/tools/dev/bun.sh"
      - "/tools/dev/node-info.mts"
      - "/tools/dev/extract-pinned-zip.*"
      - "/tools/test/zip-fixture.mts"
      - "/src/shared/artifact-packaging/portable-archive.mts"
      - "/src/sources/toolchains/android-sdk.toml"
      - "/src/sources/toolchains/maestro.toml"
      - "/.github/actions/setup-android/**"
      - "/.github/actions/setup-maestro/**"
    options:
      runFromWorkspaceRoot: true
