$schema: "https://moonrepo.dev/schemas/project.json"

id: "shared-js-core"
language: "typescript"
layer: "library"
stack: "frontend"
tags: ["shared", "typescript", "sdk"]

project:
  title: "Shared JavaScript Core"
  description: "Private workspace package for the canonical TypeScript query and protocol helpers."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/sdk-js"
  paths:
    "**/*.ts": ["@oliphaunt/sdk-js", "@oliphaunt/sdk-react-native"]
    "tools/**": ["@oliphaunt/sdk-js", "@oliphaunt/sdk-react-native"]

tasks:
  check:
    tags: ["quality", "static"]
    command: "pnpm --dir src/shared/js-core typecheck"
    inputs:
      - "/src/shared/js-core/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
    options:
      cache: true
      runFromWorkspaceRoot: true
  build-module:
    tags: ["build", "typescript"]
    command: "pnpm --dir src/shared/js-core exec tsc -p tsconfig.build.module.json"
    deps:
      - "shared-js-core:check"
    inputs:
      - "/src/shared/js-core/package.json"
      - "/src/shared/js-core/src/**/*.ts"
      - "/src/shared/js-core/tsconfig*.json"
      - "/pnpm-lock.yaml"
    outputs:
      - "/src/shared/js-core/dist/module/*.d.ts"
      - "/src/shared/js-core/dist/module/*.js"
    options:
      cache: true
      runFromWorkspaceRoot: true
  build-commonjs:
    tags: ["build", "typescript"]
    command: "pnpm --dir src/shared/js-core exec tsc -p tsconfig.build.commonjs.json"
    deps:
      - "shared-js-core:check"
    inputs:
      - "/src/shared/js-core/package.json"
      - "/src/shared/js-core/src/**/*.ts"
      - "/src/shared/js-core/tsconfig*.json"
      - "/pnpm-lock.yaml"
    outputs:
      - "/src/shared/js-core/dist/commonjs/*.d.ts"
      - "/src/shared/js-core/dist/commonjs/*.js"
    options:
      cache: true
      runFromWorkspaceRoot: true
  build:
    tags: ["build", "typescript", "aggregate"]
    command: "true"
    deps:
      - "shared-js-core:build-module"
      - "shared-js-core:build-commonjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  test:
    tags: ["quality", "unit"]
    command: "tools/dev/bun.sh x vitest run src/shared/js-core/test/query.test.ts"
    inputs:
      - "/src/shared/js-core/**/*"
      - "/src/shared/fixtures/protocol/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
