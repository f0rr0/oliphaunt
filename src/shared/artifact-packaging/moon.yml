$schema: "https://moonrepo.dev/schemas/project.json"

id: "artifact-packaging"
language: "typescript"
layer: "library"
stack: "systems"
tags: ["javascript-quality", "shared", "artifacts", "packaging"]

project:
  title: "Artifact Packaging"
  description: "Deterministic archive creation, reading, and safe staging shared by product packagers."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

fileGroups:
  source:
    - "*.{mjs,mts}"
    - "!*.test.{mjs,mts}"

tasks:
  test:
    tags: ["quality", "unit", "requires-rust"]
    script: |
      set -e
      node --test src/shared/artifact-packaging/archive-directory.test.mts src/shared/artifact-packaging/portable-archive.test.mts
      bun test --timeout=30000 ./src/shared/artifact-packaging
      bash src/shared/artifact-packaging/strip-native-binaries.test.sh
    inputs:
      - "@group(release-target-contract)"
      - "@group(package-test-metadata)"
      - "@group(legal-files)"
      - "/src/extensions/tools/extension-upstream-licenses.mts"
      - "/src/extensions/external/**/upstream-license-data.json"
      - "/src/shared/js-core/tools/stage-package.mts"
      - "/src/runtimes/liboliphaunt/licenses/*"
      - "/src/runtimes/liboliphaunt/{native,wasix}/THIRD_PARTY_NOTICES.md"
      - "/src/sources/third-party/shared/{icu,openssl}.toml"
      - "**/*.mts"
      - "**/*.sh"
      - "/src/shared/cluster-seed-contract/*.mts"
      - "/tools/test/**/*"
      - "/src/shared/product-metadata/**/*.mts"
      - "/src/runtimes/liboliphaunt/native/tools/native-runtime-payload-policy.json"
    options:
      cache: true
      runFromWorkspaceRoot: true
