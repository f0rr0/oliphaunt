$schema: "https://moonrepo.dev/schemas/project.json"

id: "oliphaunt-wasix-rust"
language: "rust"
layer: "library"
stack: "systems"
tags: ["binding", "wasix", "rust", "postgres", "sdk", "release-product"]
dependsOn:
  - "liboliphaunt-wasix"
  - "shared-rust-query-core"

project:
  title: "Oliphaunt Rust WASIX"
  description: "Rust binding over the liboliphaunt WASIX runtime."
  owner: "oliphaunt"
  release:
    component: "oliphaunt-wasix-rust"
    packagePath: "src/bindings/wasix-rust/crates/oliphaunt-wasix"

owners:
  defaultOwner: "@oliphaunt/wasix-rust"
  paths:
    "**/*.rs": ["@oliphaunt/wasix-rust"]
    "crates/oliphaunt-wasix/**": ["@oliphaunt/wasix-rust"]
    "tools/**": ["@oliphaunt/wasix-rust"]

tasks:
  compile:
    tags: ["quality", "static", "requires-rust"]
    command: "cargo check -p oliphaunt-wasix --locked"
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-wasix-rust/check"
    inputs:
      - "@group(cargo-workspace)"
      - project: "shared-rust-query-core"
      - "**/*"
      - "/src/runtimes/liboliphaunt/wasix/crates/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true

  unit:
    tags: ["quality", "unit", "requires-rust"]
    command: "bash src/bindings/wasix-rust/tools/check-unit.sh"
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-wasix-rust/test"
    inputs:
      - "@group(cargo-workspace)"
      - "/src/shared/fixtures/**/*"
      - project: "shared-rust-query-core"
      - "**/*"
      - "/src/runtimes/liboliphaunt/wasix/crates/**/*"
      - "/tools/test/cargo-test-filter.sh"
    options:
      cache: true
      runFromWorkspaceRoot: true

  package:
    tags: ["package"]
    command: "bash src/bindings/wasix-rust/tools/check-package.sh"
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-wasix-rust/package"
    inputs:
      - "@group(cargo-workspace)"
      - "**/*"
      - "/src/shared/fixtures/extensions/**/*"
      - "/src/shared/fixtures/postgres/**/*"
      - "/src/shared/fixtures/protocol/query-response-cases.json"
      - "/src/shared/fixtures/protocol/structured-sql-cases.json"
      - "/src/shared/fixtures/storage/database-root.json"
      - "/src/shared/fixtures/storage/physical-archive-wasix-v1.properties"
      - "/src/shared/fixtures/storage/physical-backup-wal-range-v1.properties"
      - project: "shared-rust-query-core"
      - "/src/runtimes/liboliphaunt/wasix/crates/**/*"
      - "/src/sources/toolchains/wasix.toml"
      - "/src/bindings/wasix-rust/tools/check-package.sh"
    outputs:
      - "/target/oliphaunt-wasix-rust/package/oliphaunt-wasix.package-files.txt"
    options:
      cache: true
      runFromWorkspaceRoot: true

  package-artifacts:
    tags: ["release", "artifact-package", "ci-wasix-rust-package"]
    command: "tools/dev/bun.sh tools/release/build-cargo-sdk-ci-artifacts.mjs oliphaunt-wasix-rust"
    deps:
      - "oliphaunt-wasix-rust:package"
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-wasix-rust/package-artifacts"
    inputs:
      - "@group(legal-files)"
      - "@group(cargo-workspace)"
      - "**/*"
      - "/src/shared/fixtures/extensions/**/*"
      - "/src/shared/fixtures/postgres/**/*"
      - "/src/shared/fixtures/protocol/query-response-cases.json"
      - "/src/shared/fixtures/protocol/structured-sql-cases.json"
      - "/src/shared/fixtures/storage/database-root.json"
      - "/src/shared/fixtures/storage/physical-archive-wasix-v1.properties"
      - "/src/shared/fixtures/storage/physical-backup-wal-range-v1.properties"
      - project: "shared-rust-query-core"
      - "/src/runtimes/liboliphaunt/icu/**/*"
      - "/src/runtimes/liboliphaunt/wasix/crates/**/*"
      - "/src/sources/toolchains/wasix.toml"
      - "/src/bindings/wasix-rust/tools/check-package.sh"
      - "/tools/dev/capture-command-output.mjs"
      - "/tools/dev/moon-command.mjs"
      - "/tools/release/build-cargo-sdk-ci-artifacts.mjs"
      - "/tools/release/build-sdk-ci-artifacts.mjs"
      - "/tools/release/sdk-artifacts/shared.mjs"
      - "/tools/release/sdk-artifacts/wasix-rust.mjs"
      - "/tools/release/check-cargo-package-test-closure.mjs"
      - "/tools/release/extension-upstream-licenses.mjs"
      - "/tools/release/ios-carrier-manifest.mjs"
      - "/tools/release/check-staged-artifacts.mjs"
      - "/tools/release/extension-runtime-asset-contract.mjs"
      - "/tools/release/package_oliphaunt_wasix_sdk_crate.mjs"
      - "@group(release-target-contract)"
      - "/tools/release/release-cli-utils.mjs"
      - "/tools/release/release-graph.mjs"
      - "@group(release-archive-contract)"
      - "@group(source-sdk-packaging)"
      - "/tools/release/wasix-cargo-toolchain-policy.mjs"
      - "/tools/policy/source-fetch-core.mjs"
    outputs:
      - "/target/sdk-artifacts/oliphaunt-wasix-rust/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true

  qualify:
    tags: ["release", "package"]
    command: "bash src/bindings/wasix-rust/tools/check-release.sh"
    deps:
      - "liboliphaunt-wasix:runtime-aot"
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-wasix-rust/release-check"
    inputs:
      - "@group(cargo-workspace)"
      - "**/*"
      - "/src/extensions/**/*"
      - "!/src/extensions/generated/docs"
      - "!/src/extensions/generated/docs/**"
      - "!/src/extensions/evidence"
      - "!/src/extensions/evidence/**"
      - "/src/shared/fixtures/extensions/**/*"
      - "/src/shared/fixtures/postgres/**/*"
      - "/src/shared/fixtures/protocol/query-response-cases.json"
      - "/src/shared/fixtures/protocol/structured-sql-cases.json"
      - "/src/shared/fixtures/storage/database-root.json"
      - "/src/shared/fixtures/storage/physical-archive-wasix-v1.properties"
      - "/src/shared/fixtures/storage/physical-backup-wal-range-v1.properties"
      - project: "shared-rust-query-core"
      - "/src/runtimes/liboliphaunt/wasix/crates/**/*"
      - "/src/sources/toolchains/wasix.toml"
      - "/src/bindings/wasix-rust/tools/check-package.sh"
      - "/src/bindings/wasix-rust/tools/check-release.sh"
      - "/tools/dev/bun.sh"
      - "/tools/release/**/*"
      - "/tools/test/cargo-test-filter.sh"
      - "/target/oliphaunt-wasix/assets/**/*"
      - "/target/oliphaunt-wasix/aot/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true

  coverage:
    tags: ["coverage", "quality"]
    command: "tools/coverage/run-product oliphaunt-wasix-rust"
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-wasix-rust/coverage"
    inputs:
      - "/.config/nextest.toml"
      - "@group(cargo-workspace)"
      - "/coverage/baseline.toml"
      - "/src/shared/fixtures/**/*"
      - project: "shared-rust-query-core"
      - "**/*"
      - "/src/runtimes/liboliphaunt/wasix/crates/**/*"
      - "/tools/coverage/**/*"
    outputs:
      - "/target/coverage/oliphaunt-wasix-rust/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
