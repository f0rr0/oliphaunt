$schema: "https://moonrepo.dev/schemas/project.json"

id: "oliphaunt-wasix-rust"
language: "rust"
layer: "library"
stack: "systems"
tags: ["binding", "wasix", "rust", "postgres", "sdk", "release-product"]
dependsOn:
  - id: "shared-test-fixtures"
    scope: "development"
  - "liboliphaunt-wasix"
  - "shared-rust-query-core"

project:
  title: "Oliphaunt Rust WASIX"
  description: "Rust binding over the liboliphaunt WASIX runtime."
  owner: "oliphaunt"
  release:
    component: "oliphaunt-wasix-rust"
    packagePath: "src/bindings/wasix-rust/crates/oliphaunt-wasix"

owners:
  defaultOwner: "@oliphaunt/wasix-rust"
  paths:
    "**/*.rs": ["@oliphaunt/wasix-rust"]
    "crates/oliphaunt-wasix/**": ["@oliphaunt/wasix-rust"]
    "tools/**": ["@oliphaunt/wasix-rust"]

fileGroups:
  code:
    - "**/*"
    - "!**/*.md"
    - "!moon.yml"
    - "!release.toml"

tasks:
  compile:
    tags: ["quality", "static", "requires-rust"]
    command: "cargo check -p oliphaunt-wasix --locked"
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-wasix-rust/check"
    inputs:
      - "@group(cargo-workspace)"
      - project: "shared-rust-query-core"
        group: "sources"
      - "@group(code)"
      - project: "liboliphaunt-wasix"
        group: "crates"
    options:
      cache: true
      runFromWorkspaceRoot: true

  unit:
    tags: ["quality", "unit", "requires-rust"]
    script: |
      set -e
      cargo test -p oliphaunt-wasix --doc --locked
      cargo test -p oliphaunt-wasix --doc --locked --features tools
      cargo nextest run -p oliphaunt-wasix --locked --profile ci --no-default-features --lib --no-tests=fail --test-threads=1
      cargo nextest run -p oliphaunt-wasix --locked --profile ci --no-default-features --features extensions,tools,extension-vector --test public_api --no-tests=fail --test-threads=1
      cargo test -p oliphaunt-wasix --locked --no-default-features --features extensions --test runtime_smoke --test client_compat --no-run
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-wasix-rust/test"
    inputs:
      - "@group(cargo-workspace)"
      - "@group(rust-test-config)"
      - project: "shared-test-fixtures"
        group: "fixtures"
      - project: "shared-rust-query-core"
        group: "sources"
      - "@group(code)"
      - project: "liboliphaunt-wasix"
        group: "crates"
    options:
      cache: true
      runFromWorkspaceRoot: true

  package:
    tags: ["package"]
    script: |
      set -e
      rm -rf target/oliphaunt-wasix-rust/package
      node src/bindings/wasix-rust/tools/package-source.mjs target/oliphaunt-wasix-rust/package/source
      cargo package --manifest-path target/oliphaunt-wasix-rust/package/source/Cargo.toml --allow-dirty --no-verify
      cargo package --manifest-path target/oliphaunt-wasix-rust/package/source/Cargo.toml --allow-dirty --list > target/oliphaunt-wasix-rust/package/oliphaunt-wasix.package-files.txt
    env:
      CARGO_TARGET_DIR: "target/moon/oliphaunt-wasix-rust/package"
    inputs:
      - "@group(cargo-workspace)"
      - "**/*"
      - project: "shared-test-fixtures"
        group: "fixtures"
      - project: "shared-rust-query-core"
        group: "sources"
      - project: "liboliphaunt-wasix"
        group: "crates"
      - "/src/sources/toolchains/wasix.toml"
      - "/src/bindings/wasix-rust/tools/package-source.mjs"
    outputs:
      - "/target/oliphaunt-wasix-rust/package/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true

  qualify:
    tags: ["release", "package"]
    command: "true"
    deps:
      - "oliphaunt-wasix-rust:compile"
      - "oliphaunt-wasix-rust:unit"
      - "oliphaunt-wasix-rust:package"
    inputs: []
    options:
      cache: true
      runFromWorkspaceRoot: true
