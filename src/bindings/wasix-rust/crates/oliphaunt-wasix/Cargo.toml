[package]
name = "oliphaunt-wasix"
version = "0.2.0"
edition = "2024"
rust-version = "1.93"
description = "Embedded PostgreSQL 18 for Rust with synchronous and asynchronous APIs."
readme = "README.md"
repository = "https://github.com/f0rr0/oliphaunt"
homepage = "https://oliphaunt.dev"
documentation = "https://docs.rs/oliphaunt-wasix"
keywords = ["postgres", "oliphaunt", "wasm", "database", "embedded"]
categories = ["database-implementations", "wasm", "development-tools::testing"]
license = "MIT"
links = "oliphaunt_artifact_wasix_relay"
build = "build.rs"
exclude = [
  "Cargo.toml.orig",
  "release.toml",
]

[package.metadata.oliphaunt]
runtime-version = "0.2.0"

[features]
default = ["extensions"]
__internal-napi = []
extensions = []
__internal-tools = []
tools = [
  "__internal-tools",
  "dep:oliphaunt-wasix-tools",
  "dep:oliphaunt-wasix-tools-aot-aarch64-apple-darwin",
  "dep:oliphaunt-wasix-tools-aot-aarch64-unknown-linux-gnu",
  "dep:oliphaunt-wasix-tools-aot-x86_64-pc-windows-msvc",
  "dep:oliphaunt-wasix-tools-aot-x86_64-unknown-linux-gnu",
]

[package.metadata.oliphaunt-wasix.assets]
postgres-version = "18.4"
postgres-source-url = "https://ftp.postgresql.org/pub/source/v18.4/postgresql-18.4.tar.bz2"
postgres-source-sha256 = "81a81ec695fb0c7901407defaa1d2f7973617154cf27ba74e3a7ab8e64436094"
postgres-patch-count = "41"
oliphaunt-npm-version-checked = "0.4.5"
runtime-archive-sha256 = "5f0bf0c84af3313e479a62358edb3872452e42ab8ae827781c025b34c820277b"
oliphaunt-wasix-sha256 = "fced1f11b12bd3d8849b76bd6ad52623ab3540b0bf52cffd60b7c5c893687d2a"
cluster-seed-standard-archive-sha256 = "5036966275469d39b665d99ccd59d208fe6e77bcb250909369f46afd907b7577"
cluster-seed-icu-archive-sha256 = "5036966275469d39b665d99ccd59d208fe6e77bcb250909369f46afd907b7577"
initdb-wasix-sha256 = "c2438dd844943811da9de5dd5c2786c7b2cb1b03df41d8b71108dce1d632758b"

[dependencies]
oliphaunt-resources = { version = "0.2.0", path = "../../../../sdks/rust/crates/oliphaunt-resources" }
anyhow = "1"
async-trait = "0.1"
cap-fs-ext = "4"
cap-std = "4"
tar = "0.4"
zstd = { version = "0.13", default-features = false }
directories = "6"
tracing = "0.1"
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
sha2 = "0.10"
dunce = "1"
filetime = "0.2"
liboliphaunt-wasix-portable = { version = "*", path = "../../../../runtimes/liboliphaunt/wasix/crates/assets", features = ["extension-amcheck", "extension-auto-explain", "extension-bloom", "extension-btree-gin", "extension-btree-gist", "extension-citext", "extension-cube", "extension-dict-int", "extension-dict-xsyn", "extension-earthdistance", "extension-file-fdw", "extension-fuzzystrmatch", "extension-hstore", "extension-intarray", "extension-isn", "extension-lo", "extension-ltree", "extension-pageinspect", "extension-pg-buffercache", "extension-pg-freespacemap", "extension-pg-surgery", "extension-pg-trgm", "extension-pg-visibility", "extension-pg-walinspect", "extension-pgcrypto", "extension-seg", "extension-tablefunc", "extension-tcn", "extension-tsm-system-rows", "extension-tsm-system-time", "extension-unaccent", "extension-uuid-ossp"] }
oliphaunt-wasix-tools = { version = "*", path = "../../../../runtimes/liboliphaunt/wasix/crates/tools", optional = true }
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "sync"] }
wasmer = { version = "=7.2.1", default-features = false, features = [
  "sys",
  "headless",
  "compiler",
  "wasmer-artifact-load",
] }
# Wasmer-WASIX 0.x crates use compatible ranges for packages in their own
# release family. Keep the complete family constrained here so a fresh
# consumer cannot silently mix a later patch generation with the runtime and
# AOT artifacts built against this exact toolchain.
wasmer-config = { version = "=0.702.1", default-features = false }
wasmer-journal = { version = "=0.702.1", default-features = false }
wasmer-package = { version = "=0.702.1", default-features = false }
wasmer-types = "=7.2.1"
wasmer-wasix = { version = "=0.702.1", default-features = false, features = [
  "sys-minimal",
  "sys-poll",
  "host-vnet",
  "time",
] }
wasmer-wasix-types = { version = "=0.702.1", default-features = false }
virtual-fs = { version = "=0.702.1", default-features = false }
virtual-mio = { version = "=0.702.1", default-features = false }
virtual-net = { version = "=0.702.1", default-features = false }
webc = "=12.0.0"

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
liboliphaunt-wasix-aot-aarch64-apple-darwin = { version = "*", path = "../../../../runtimes/liboliphaunt/wasix/crates/aot/aarch64-apple-darwin" }
oliphaunt-wasix-tools-aot-aarch64-apple-darwin = { version = "*", path = "../../../../runtimes/liboliphaunt/wasix/crates/tools-aot/aarch64-apple-darwin", optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64", target_env = "gnu"))'.dependencies]
liboliphaunt-wasix-aot-x86_64-unknown-linux-gnu = { version = "*", path = "../../../../runtimes/liboliphaunt/wasix/crates/aot/x86_64-unknown-linux-gnu" }
oliphaunt-wasix-tools-aot-x86_64-unknown-linux-gnu = { version = "*", path = "../../../../runtimes/liboliphaunt/wasix/crates/tools-aot/x86_64-unknown-linux-gnu", optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "aarch64", target_env = "gnu"))'.dependencies]
liboliphaunt-wasix-aot-aarch64-unknown-linux-gnu = { version = "*", path = "../../../../runtimes/liboliphaunt/wasix/crates/aot/aarch64-unknown-linux-gnu" }
oliphaunt-wasix-tools-aot-aarch64-unknown-linux-gnu = { version = "*", path = "../../../../runtimes/liboliphaunt/wasix/crates/tools-aot/aarch64-unknown-linux-gnu", optional = true }

[target.'cfg(all(target_os = "windows", target_arch = "x86_64", target_env = "msvc"))'.dependencies]
liboliphaunt-wasix-aot-x86_64-pc-windows-msvc = { version = "*", path = "../../../../runtimes/liboliphaunt/wasix/crates/aot/x86_64-pc-windows-msvc" }
oliphaunt-wasix-tools-aot-x86_64-pc-windows-msvc = { version = "*", path = "../../../../runtimes/liboliphaunt/wasix/crates/tools-aot/x86_64-pc-windows-msvc", optional = true }

[dev-dependencies]
sqlx = { version = "0.8", default-features = false, features = [
  "postgres",
  "runtime-tokio",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-postgres = "0.7"

[[bin]]
name = "oliphaunt-wasix-dump"
path = "src/bin/oliphaunt_wasix_dump.rs"
required-features = ["tools"]

[[bin]]
name = "oliphaunt-wasix-proxy"
path = "src/bin/oliphaunt_wasix_proxy.rs"
