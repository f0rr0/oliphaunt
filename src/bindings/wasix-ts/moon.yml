$schema: "https://moonrepo.dev/schemas/project.json"

id: "oliphaunt-wasix-ts"
language: "typescript"
layer: "library"
stack: "frontend"
tags: ["binding", "wasix", "wasm", "typescript", "browser", "node", "bun", "deno", "sdk", "release-product"]
dependsOn:
  - id: "cluster-seed-contract"
    scope: "development"
  - id: "shared-test-fixtures"
    scope: "development"
  - "liboliphaunt-wasix"
  - "oliphaunt-wasix-napi"
  - "shared-js-core"

project:
  title: "Oliphaunt WASIX TypeScript binding"
  description: "Universal WASIX TypeScript binding with browser and native host placements."
  owner: "oliphaunt"
  release:
    component: "oliphaunt-wasix-ts"
    packagePath: "src/bindings/wasix-ts"

owners:
  defaultOwner: "@oliphaunt/sdk-js"

fileGroups:
  code:
    - "**/*"
    - "!**/*.md"
    - "!moon.yml"
    - "!release.toml"

tasks:
  compile:
    tags: ["quality", "static"]
    command: "pnpm --dir src/bindings/wasix-ts typecheck"
    inputs:
      - "@group(pnpm-workspace)"
      - project: "shared-js-core"
        group: "sources"
      - "@group(code)"
    options:
      cache: true
      runFromWorkspaceRoot: true

  unit:
    tags: ["quality", "unit"]
    command: "pnpm --dir src/bindings/wasix-ts test"
    inputs:
      - "@group(pnpm-workspace)"
      - project: "shared-js-core"
        group: "sources"
      - project: "shared-test-fixtures"
        group: "fixtures"
      - project: "cluster-seed-contract"
        group: "contract"
      - "@group(code)"
    options:
      cache: true
      runFromWorkspaceRoot: true

  browser-host:
    tags: ["artifact", "build", "requires-rust"]
    command: "bash src/bindings/wasix-ts/host/build-sdk.sh"
    inputs:
      - "host/**/*"
    outputs:
      - "/target/oliphaunt-wasix-ts/host/wasmer-sdk/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true

  package:
    tags: ["package"]
    script: |
      set -e
      pnpm --dir src/bindings/wasix-ts build
      node src/bindings/wasix-ts/tools/stage-host.mjs
      node src/bindings/wasix-ts/tools/package.mjs target/oliphaunt-wasix-ts/package
    deps:
      - "oliphaunt-wasix-ts:browser-host"
    inputs:
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - project: "shared-js-core"
        group: "sources"
      - "**/*"
    outputs:
      - "/target/oliphaunt-wasix-ts/package/**/*"
      - "/src/bindings/wasix-ts/lib/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true

  qualify:
    tags: ["release", "package"]
    command: "true"
    deps:
      - "oliphaunt-wasix-ts:compile"
      - "oliphaunt-wasix-ts:unit"
      - "oliphaunt-wasix-ts:package"
    inputs: []
    options:
      cache: true
      runFromWorkspaceRoot: true
