$schema: "https://moonrepo.dev/schemas/project.json"

id: "oliphaunt-wasix-ts"
language: "typescript"
layer: "library"
stack: "frontend"
tags: ["binding", "wasix", "wasm", "typescript", "browser", "node", "bun", "deno", "sdk", "release-product"]
dependsOn:
  - "liboliphaunt-wasix"
  - "oliphaunt-wasix-napi"
  - "shared-js-core"

project:
  title: "Oliphaunt WASIX TypeScript binding"
  description: "Universal WASIX TypeScript binding with Rust actor, direct, Worker, and listener placements on hosts and Wasmer-JS in browsers."
  owner: "oliphaunt"
  release:
    component: "oliphaunt-wasix-ts"
    packagePath: "src/bindings/wasix-ts"

owners:
  defaultOwner: "@oliphaunt/sdk-js"
  paths:
    "**/*.ts": ["@oliphaunt/sdk-js"]

tasks:
  compile:
    tags: ["quality", "static"]
    command: "pnpm --dir src/bindings/wasix-ts typecheck"
    inputs:
      - "@group(pnpm-workspace)"
      - project: "shared-js-core"
      - "**/*"
      - "/examples/browser-wasix/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  unit:
    tags: ["quality", "unit"]
    command: "pnpm --dir src/bindings/wasix-ts test"
    inputs:
      - "@group(pnpm-workspace)"
      - project: "shared-js-core"
      - "/src/shared/fixtures/postgres/server-listen.json"
      - "/src/shared/fixtures/protocol/query-response-cases.json"
      - "/src/shared/fixtures/storage/database-root.json"
      - "/src/shared/fixtures/storage/physical-archive-wasix-v1.properties"
      - "/src/shared/fixtures/storage/physical-backup-wal-range-v1.properties"
      - "/src/shared/cluster-seed-contract/fixtures/**/*"
      - "**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  tools-compile:
    tags: ["quality", "static"]
    command: "pnpm --dir src/bindings/wasix-ts/tools-package typecheck"
    inputs:
      - "@group(pnpm-workspace)"
      - "/src/bindings/wasix-ts/tools-package/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  tools-unit:
    tags: ["quality", "unit"]
    command: "pnpm --dir src/bindings/wasix-ts/tools-package test"
    inputs:
      - "@group(pnpm-workspace)"
      - "/src/bindings/wasix-ts/tools-package/**/*"
      - "/src/shared/fixtures/postgres/logical-tools.json"
    options:
      cache: true
      runFromWorkspaceRoot: true
  tools-package:
    tags: ["package"]
    command: "pnpm --dir src/bindings/wasix-ts/tools-package build"
    inputs:
      - "@group(pnpm-workspace)"
      - "/src/bindings/wasix-ts/tools-package/**/*"
    outputs:
      - "/src/bindings/wasix-ts/tools-package/lib/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  coverage:
    tags: ["coverage", "quality"]
    command: "tools/coverage/run-product oliphaunt-wasix-ts"
    inputs:
      - "/coverage/baseline.toml"
      - "/src/shared/fixtures/**/*"
      - project: "shared-js-core"
      - "@group(pnpm-workspace)"
      - "**/*"
      - "/tools/coverage/**/*"
    outputs:
      - "/target/coverage/oliphaunt-wasix-ts/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  package:
    tags: ["package"]
    command: "pnpm --dir src/bindings/wasix-ts package:check"
    deps:
      - "oliphaunt-wasix-ts:tools-package"
    inputs:
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "**/*"
      - "@group(release-archive-contract)"
      - "/tools/release/wasix-runtime-npm-*.mjs"
      - "/tools/release/wasix-typescript-package.mjs"
    outputs:
      - "/src/bindings/wasix-ts/lib/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  smoke-node:
    tags: ["quality", "smoke", "node"]
    command: "node src/bindings/wasix-ts/tools/smoke-node.mjs --runtime node"
    deps:
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "**/*"
      - project: "liboliphaunt-wasix"
      - "@group(release-archive-contract)"
      - "/tools/release/wasix-runtime-npm-*.mjs"
      - "/tools/release/wasix-typescript-package.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
  smoke-bun:
    tags: ["quality", "smoke", "bun"]
    command: "node src/bindings/wasix-ts/tools/smoke-node.mjs --runtime bun"
    deps:
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "/.prototools"
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "**/*"
      - project: "liboliphaunt-wasix"
      - "@group(release-archive-contract)"
      - "/tools/release/wasix-runtime-npm-*.mjs"
      - "/tools/release/wasix-typescript-package.mjs"
      - "/src/sources/toolchains/bun.toml"
      - "/tools/dev/bun.sh"
      - "/tools/dev/install-pinned-js-runtime.sh"
    options:
      cache: false
      runFromWorkspaceRoot: true
  smoke-deno:
    tags: ["quality", "smoke", "deno"]
    command: "node src/bindings/wasix-ts/tools/smoke-node.mjs --runtime deno"
    deps:
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "/.prototools"
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "**/*"
      - project: "liboliphaunt-wasix"
      - "@group(release-archive-contract)"
      - "/tools/release/wasix-runtime-npm-*.mjs"
      - "/tools/release/wasix-typescript-package.mjs"
      - "/src/sources/toolchains/deno.toml"
      - "/tools/dev/deno.sh"
      - "/tools/dev/install-pinned-js-runtime.sh"
    options:
      cache: false
      runFromWorkspaceRoot: true
  tools-smoke-node:
    tags: ["quality", "smoke", "node"]
    command: "node src/bindings/wasix-ts/tools-package/tools/smoke-host.mjs --runtime node"
    deps:
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "**/*"
      - "/src/shared/fixtures/postgres/**/*"
      - "/src/runtimes/liboliphaunt/wasix/tools-npm/**/*"
      - "/target/oliphaunt-wasix/assets/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
  tools-smoke-browser:
    tags: ["quality", "smoke", "browser"]
    command: "node src/bindings/wasix-ts/tools/smoke-browser.mjs"
    deps:
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "/examples/browser-wasix/**/*"
      - "**/*"
      - project: "liboliphaunt-wasix"
      - "/target/oliphaunt-wasix/assets/**/*"
      - "/tools/perf/wasix-browser/plan.mjs"
      - "/tools/perf/wasix-node/installed-closure.mjs"
      - "/tools/perf/wasix-node/plan.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
  tools-smoke-bun:
    tags: ["quality", "smoke", "bun"]
    command: "tools/dev/bun.sh src/bindings/wasix-ts/tools-package/tools/smoke-host.mjs --runtime bun"
    deps:
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "/.prototools"
      - "**/*"
      - "/src/shared/fixtures/postgres/**/*"
      - "/src/runtimes/liboliphaunt/wasix/tools-npm/**/*"
      - "/src/sources/toolchains/bun.toml"
      - "/target/oliphaunt-wasix/assets/**/*"
      - "/tools/dev/bun.sh"
    options:
      cache: false
      runFromWorkspaceRoot: true
  tools-smoke-deno:
    tags: ["quality", "smoke", "deno"]
    command: "tools/dev/deno.sh run --allow-all src/bindings/wasix-ts/tools-package/tools/smoke-host.mjs --runtime deno"
    deps:
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "/.prototools"
      - "**/*"
      - "/src/shared/fixtures/postgres/**/*"
      - "/src/runtimes/liboliphaunt/wasix/tools-npm/**/*"
      - "/src/sources/toolchains/deno.toml"
      - "/target/oliphaunt-wasix/assets/**/*"
      - "/tools/dev/deno.sh"
    options:
      cache: false
      runFromWorkspaceRoot: true
  package-smoke-node:
    tags: ["quality", "smoke", "package", "node"]
    command: "node src/bindings/wasix-ts/tools/smoke-node.mjs --runtime node --package-only"
    deps:
      - "oliphaunt-wasix-ts:package"
    inputs:
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "**/*"
      - "@group(release-archive-contract)"
      - "/tools/release/wasix-runtime-npm-*.mjs"
      - "/tools/release/wasix-typescript-package.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  package-smoke-bun:
    tags: ["quality", "smoke", "package", "bun"]
    command: "node src/bindings/wasix-ts/tools/smoke-node.mjs --runtime bun --package-only"
    deps:
      - "oliphaunt-wasix-ts:package"
    inputs:
      - "/.prototools"
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "**/*"
      - "@group(release-archive-contract)"
      - "/tools/release/wasix-runtime-npm-*.mjs"
      - "/tools/release/wasix-typescript-package.mjs"
      - "/src/sources/toolchains/bun.toml"
      - "/tools/dev/bun.sh"
      - "/tools/dev/install-pinned-js-runtime.sh"
    options:
      cache: true
      runFromWorkspaceRoot: true
  package-smoke-deno:
    tags: ["quality", "smoke", "package", "deno"]
    command: "node src/bindings/wasix-ts/tools/smoke-node.mjs --runtime deno --package-only"
    deps:
      - "oliphaunt-wasix-ts:package"
    inputs:
      - "/.prototools"
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "**/*"
      - "@group(release-archive-contract)"
      - "/tools/release/wasix-runtime-npm-*.mjs"
      - "/tools/release/wasix-typescript-package.mjs"
      - "/src/sources/toolchains/deno.toml"
      - "/tools/dev/deno.sh"
      - "/tools/dev/install-pinned-js-runtime.sh"
    options:
      cache: true
      runFromWorkspaceRoot: true
  bench:
    tags: ["bench", "plan"]
    script: |
      node --test tools/perf/wasix-browser/plan.test.mjs
      node --test tools/perf/wasix-node/plan.test.mjs
      node --check tools/perf/wasix-browser/plan.mjs
      node --check tools/perf/wasix-node/engine-runner.mjs
      node --check tools/perf/wasix-node/benchmark.mjs
      node --check tools/perf/wasix-node/pglite-node-worker.mjs
      node --check src/bindings/wasix-ts/tools/pgwire-client.mjs
      node --check tools/perf/wasix-node/rss-sampler-worker.mjs
      node --check tools/perf/wasix-node/streaming-quick.mjs
      node tools/perf/wasix-node/benchmark.mjs --validate
    inputs:
      - "@group(pnpm-workspace)"
      - "/benchmarks/wasix/node-pglite-memory-v2.json"
      - "/benchmarks/wasix/browser-pglite-memory-v2.json"
      - "/src/bindings/wasix-ts/host/**/*"
      - "/src/bindings/wasix-ts/package.json"
      - "/src/bindings/wasix-ts/tools/packed-node-fixture.mjs"
      - "/src/bindings/wasix-ts/tools/pgwire-client.mjs"
      - "/tools/perf/wasix-node/*.mjs"
      - "/tools/perf/wasix-node/package.json"
      - "/tools/perf/wasix-browser/*.mjs"
      - "@group(release-archive-contract)"
      - "/tools/release/wasix-typescript-package.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  bench-run:
    tags: ["bench", "measured", "local-only"]
    script: |
      pnpm --dir src/bindings/wasix-ts package:build
      node tools/perf/wasix-node/benchmark.mjs --run
    deps:
      - "oliphaunt-wasix-ts:bench"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "/benchmarks/wasix/node-pglite-memory-v2.json"
      - "**/*"
      - project: "liboliphaunt-wasix"
      - "/tools/perf/wasix-node/*.mjs"
      - "/tools/perf/wasix-node/package.json"
      - "@group(release-archive-contract)"
      - "/tools/release/wasix-typescript-package.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  bench-browser:
    tags: ["bench", "measured", "browser", "local-only"]
    script: |
      pnpm --dir src/bindings/wasix-ts package:build
      node src/bindings/wasix-ts/tools/smoke-browser.mjs --benchmark
    deps:
      - "oliphaunt-wasix-ts:bench"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "/benchmarks/wasix/browser-pglite-memory-v2.json"
      - "**/*"
      - project: "liboliphaunt-wasix"
      - "/tools/perf/wasix-browser/*.mjs"
      - "/tools/perf/wasix-node/installed-closure.mjs"
      - "/tools/perf/wasix-node/plan.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  package-artifacts:
    tags: ["release", "artifact-package", "ci-wasix-ts-sdk-package"]
    script: |
      tools/dev/bun.sh tools/release/build-sdk-ci-artifacts.mjs oliphaunt-wasix-ts
      node src/bindings/wasix-ts/tools/smoke-browser.mjs --package-only
    deps:
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "/examples/browser-wasix/**/*"
      - "**/*"
      - project: "liboliphaunt-wasix"
      - "/src/shared/fixtures/postgres/logical-tools.json"
      - "/src/shared/fixtures/postgres/logical-tools-seed.sql"
      - "/src/shared/fixtures/postgres/logical-tools-verify.sql"
      - "/src/shared/fixtures/storage/database-root.json"
      - "/tools/dev/capture-command-output.mjs"
      - "/tools/perf/wasix-browser/plan.mjs"
      - "/tools/perf/wasix-node/installed-closure.mjs"
      - "/tools/perf/wasix-node/plan.mjs"
      - "/tools/release/build-sdk-ci-artifacts.mjs"
      - "/tools/release/check-staged-artifacts.mjs"
      - "@group(release-archive-contract)"
      - "/tools/release/sdk-artifacts/npm.mjs"
      - "/tools/release/sdk-artifacts/shared.mjs"
      - "/tools/release/sdk-artifacts/wasix-ts.mjs"
      - "/tools/release/sdk-artifacts/wasix-tools-ts.mjs"
      - "/tools/release/wasix-tools-typescript-package.mjs"
      - "/tools/release/wasix-runtime-npm-*.mjs"
      - "/tools/release/wasix-typescript-package.mjs"
    outputs:
      - "/target/sdk-artifacts/oliphaunt-wasix-ts/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true
  smoke:
    tags: ["quality", "smoke", "local-only"]
    command: "pnpm --dir src/bindings/wasix-ts smoke:browser"
    deps:
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "@group(pnpm-workspace)"
      - "**/*"
      - project: "liboliphaunt-wasix"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  smoke-pg-uuidv7:
    tags: ["quality", "smoke", "extension", "local-only"]
    command: "pnpm --dir src/bindings/wasix-ts smoke:browser:pg-uuidv7"
    deps:
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "@group(pnpm-workspace)"
      - "**/*"
      - project: "liboliphaunt-wasix"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  smoke-postgis-worker:
    tags: ["quality", "smoke", "extension", "browser", "worker"]
    command: "pnpm --dir src/bindings/wasix-ts smoke:browser:postgis-worker"
    deps:
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "@group(pnpm-workspace)"
      - "**/*"
      - "/src/extensions/external/postgis/**/*"
      - project: "liboliphaunt-wasix"
    options:
      cache: false
      runFromWorkspaceRoot: true
