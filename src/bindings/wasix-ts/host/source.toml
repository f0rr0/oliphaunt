[wasmer-wasix]
# The source commit referenced by the upstream 0.10.0 npm release identifies
# itself as @wasmer/sdk 0.8.0 and carries a coherent Wasmer 6.1 / wasmer-wasix
# 0.601 dependency family. wasmer-wasix 0.702.1 requires Wasmer
# 7.2.1 plus matching virtual-fs/net, config, package, backend, WebC, and
# wasm-bindgen APIs; it is not a single-crate update for this upstream JS host.
name = "wasmer-wasix"
version = "0.601.0"
url = "https://static.crates.io/crates/wasmer-wasix/wasmer-wasix-0.601.0.crate"
sha256 = "a9a804fcfbdbbfe5b2d6fb30e741e22a21e88e964dedfea9e609f13a52823bfe"

