# wasm-bindgen APIs; it is not a single-crate update for this upstream JS host.
name = "wasmer-wasix"
version = "0.601.0"
url = "https://static.crates.io/crates/wasmer-wasix/wasmer-wasix-0.601.0.crate"
sha256 = "a9a804fcfbdbbfe5b2d6fb30e741e22a21e88e964dedfea9e609f13a52823bfe"

[patches]
series = [
  "0001-wasmer-js-run-configured-wasix-process.patch",
  "0002-wasmer-wasix-add-0702-compatibility-imports.patch",
  "0003-wasmer-js-install-browser-runtime-devices.patch",
  "0004-wasmer-wasix-recover-stdio-pgwire-errors.patch",
  "0005-wasmer-js-use-object-wasm-init.patch",
]
