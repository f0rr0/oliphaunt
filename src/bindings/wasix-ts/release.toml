id = "oliphaunt-wasix-ts"
owner = "@oliphaunt/sdk-js"
kind = "sdk"
publish_targets = ["npm"]
registry_packages = ["npm:@oliphaunt/wasix"]
release_artifacts = ["npm-package", "browser-worker", "node-worker-threads"]

[compatibility_versions.oliphaunt-wasix-ts-runtime]
source_product = "liboliphaunt-wasix"
path = "src/bindings/wasix-ts/package.json"
parser = "json:oliphaunt.runtimeVersion"
