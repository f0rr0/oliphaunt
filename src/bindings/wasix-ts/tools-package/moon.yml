$schema: "https://moonrepo.dev/schemas/project.json"

id: "oliphaunt-wasix-tools-ts"
language: "typescript"
layer: "library"
stack: "frontend"
tags: ["javascript-quality", "binding", "wasix", "typescript", "tools", "package"]
dependsOn:
  - id: "liboliphaunt-wasix"
    scope: "production"
  - id: "shared-test-fixtures"
    scope: "development"

project:
  title: "Oliphaunt WASIX TypeScript tools"
  description: "TypeScript pg_dump and psql facade for the WASIX runtime."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/sdk-js"

fileGroups:
  code:
    - "**/*"
    - "!**/*.md"
    - "!moon.yml"

tasks:
  compile:
    tags: ["quality", "static"]
    command: "pnpm --dir src/bindings/wasix-ts/tools-package typecheck"
    inputs:
      - "@group(pnpm-workspace)"
      - "@group(code)"
    options:
      cache: true
      runFromWorkspaceRoot: true

  unit:
    tags: ["quality", "unit"]
    command: "pnpm --dir src/bindings/wasix-ts/tools-package test"
    inputs:
      - "@group(pnpm-workspace)"
      - "@group(code)"
      - project: "shared-test-fixtures"
        group: "fixtures"
    options:
      cache: true
      runFromWorkspaceRoot: true

  package:
    tags: ["package"]
    script: |
      set -e
      pnpm --dir src/bindings/wasix-ts/tools-package build
      node src/bindings/wasix-ts/tools-package/tools/package.mts target/oliphaunt-wasix-tools-ts/package
      mkdir -p target/oliphaunt-wasix-tools-ts/package/packages
      cd target/oliphaunt-wasix-tools-ts/package
      pnpm --silent pack --pack-destination packages
    inputs:
      - "@group(legal-files)"
      - "@group(pnpm-workspace)"
      - "**/*"
      - "/src/bindings/wasix-ts/package.json"
    outputs:
      - "/target/oliphaunt-wasix-tools-ts/package/**/*"
    options:
      cache: true
      runFromWorkspaceRoot: true

  qualify:
    tags: ["release", "package"]
    command: "true"
    deps:
      - "oliphaunt-wasix-tools-ts:compile"
      - "oliphaunt-wasix-tools-ts:unit"
      - "oliphaunt-wasix-tools-ts:package"
    inputs: []
    options:
      cache: true
      runFromWorkspaceRoot: true

  packaging-unit:
    tags: ["quality", "unit"]
    script: |
      set -eu
      for test_file in src/bindings/wasix-ts/tools-package/tools/wasix-tools-typescript-package.test.mts; do
        bash tools/dev/bun.sh test --timeout=30000 "$test_file"
      done
    inputs:
      - "@group(release-target-contract)"
      - "@group(package-test-metadata)"
      - "**/*.{mjs,mts}"
      - "/tools/test/**/*"
      - "/tools/dev/bun.sh"
      - "/src/shared/artifact-packaging/*.{mts,sh}"
      - "/src/shared/product-metadata/*.{mjs,mts}"
    options:
      cache: true
      runFromWorkspaceRoot: true
