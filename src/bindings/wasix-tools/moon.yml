$schema: "https://moonrepo.dev/schemas/project.json"

id: "oliphaunt-wasix-tools-ts"
language: "typescript"
layer: "library"
stack: "frontend"
tags: ["binding", "wasix", "typescript", "sdk"]
dependsOn:
  - "oliphaunt-wasix-ts"

project:
  title: "Oliphaunt WASIX PostgreSQL tools"
  description: "Optional direct pg_dump and psql facade for the WASIX TypeScript SDK."
  owner: "oliphaunt"

tasks:
  check:
    tags: ["quality", "static"]
    command: "pnpm --dir src/bindings/wasix-tools typecheck"
    deps: ["oliphaunt-wasix-ts:check"]
    inputs:
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
      - "/src/bindings/wasix-tools/**/*"
    options:
      runFromWorkspaceRoot: true
  test:
    tags: ["quality", "unit"]
    command: "pnpm --dir src/bindings/wasix-tools test"
    deps: ["oliphaunt-wasix-ts:test"]
    inputs:
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
      - "/src/bindings/wasix-tools/**/*"
      - "/src/shared/fixtures/postgres/logical-tools.json"
      - "/tools/test/run-js-tests.mjs"
    options:
      runFromWorkspaceRoot: true
  package:
    tags: ["package"]
    command: "pnpm --dir src/bindings/wasix-tools build"
    deps: ["oliphaunt-wasix-tools-ts:check", "oliphaunt-wasix-tools-ts:test"]
    inputs:
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
      - "/src/bindings/wasix-tools/**/*"
      - "/tools/dev/clean-package-lib.mjs"
    outputs: ["/src/bindings/wasix-tools/lib/**/*"]
    options:
      runFromWorkspaceRoot: true
  smoke-node:
    tags: ["quality", "smoke", "node"]
    command: "node src/bindings/wasix-tools/tools/smoke-host.mjs --runtime node"
    deps:
      - "oliphaunt-wasix-tools-ts:package"
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "/src/bindings/wasix-tools/**/*"
      - "/src/bindings/wasix-ts/**/*"
      - "/src/shared/fixtures/postgres/**/*"
      - "/src/runtimes/liboliphaunt/wasix/tools-npm/**/*"
      - "/target/oliphaunt-wasix/assets/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
  smoke-browser:
    tags: ["quality", "smoke", "browser"]
    command: "node src/bindings/wasix-ts/tools/smoke-browser.mjs"
    deps:
      - "oliphaunt-wasix-tools-ts:package"
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "/.release-please-manifest.json"
      - "/examples/browser-wasix/**/*"
      - "/src/bindings/wasix-tools/**/*"
      - "/src/bindings/wasix-ts/**/*"
      - "/src/runtimes/liboliphaunt/wasix/**/*"
      - "/target/oliphaunt-wasix/assets/**/*"
      - "/tools/perf/wasix-browser/plan.mjs"
      - "/tools/perf/wasix-node/installed-closure.mjs"
      - "/tools/perf/wasix-node/plan.mjs"
    options:
      cache: false
      runFromWorkspaceRoot: true
  smoke-bun:
    tags: ["quality", "smoke", "bun"]
    command: "tools/dev/bun.sh src/bindings/wasix-tools/tools/smoke-host.mjs --runtime bun"
    deps:
      - "oliphaunt-wasix-tools-ts:package"
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "/.prototools"
      - "/src/bindings/wasix-tools/**/*"
      - "/src/bindings/wasix-ts/**/*"
      - "/src/shared/fixtures/postgres/**/*"
      - "/src/runtimes/liboliphaunt/wasix/tools-npm/**/*"
      - "/src/sources/toolchains/bun.toml"
      - "/target/oliphaunt-wasix/assets/**/*"
      - "/tools/dev/bun.sh"
    options:
      cache: false
      runFromWorkspaceRoot: true
  smoke-deno:
    tags: ["quality", "smoke", "deno"]
    command: "tools/dev/deno.sh run --allow-all src/bindings/wasix-tools/tools/smoke-host.mjs --runtime deno"
    deps:
      - "oliphaunt-wasix-tools-ts:package"
      - "oliphaunt-wasix-ts:package"
      - "liboliphaunt-wasix:runtime-portable"
    inputs:
      - "/.prototools"
      - "/src/bindings/wasix-tools/**/*"
      - "/src/bindings/wasix-ts/**/*"
      - "/src/shared/fixtures/postgres/**/*"
      - "/src/runtimes/liboliphaunt/wasix/tools-npm/**/*"
      - "/src/sources/toolchains/deno.toml"
      - "/target/oliphaunt-wasix/assets/**/*"
      - "/tools/dev/deno.sh"
    options:
      cache: false
      runFromWorkspaceRoot: true
