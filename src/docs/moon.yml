$schema: "https://moonrepo.dev/schemas/project.json"

id: "docs"
language: "typescript"
layer: "application"
stack: "frontend"
tags: ["javascript-quality", "docs", "fumadocs", "next", "public"]
dependsOn:
  - id: "extensions"
    scope: "build"

project:
  title: "Oliphaunt Docs"
  description: "Developer guides, SDK references, and release versions."
  owner: "oliphaunt"

tasks:
  dev:
    command: "bun run dev"
    options:
      cache: false
      runInCI: false
  check:
    command: "bun run check"
    inputs:
      - "**/*"
      - "/src/extensions/generated/extensions.catalog.json"
      - "/src/extensions/generated/sdk/extensions.json"
      - "/src/extensions/generated/wasix/extensions.json"
      - "/src/extensions/generated/mobile/static-registry.json"
      - "/src/extensions/contracts/extension-target-profiles.{mts,toml}"
      - "/release-please-config.json"
      - "/.release-please-manifest.json"
      - "/tools/release/platform-compatibility-policy.mts"
      - "/bun.lock"
    options:
      cache: false
      mutex: "docs-generated-files"
      runInCI: false
  test:
    command: "bun run test"
    inputs:
      - "/tools/dev/bun.sh"
      - "package.json"
      - "tools/published-products*"
      - "tools/request-refresh*"
      - "tools/verify-live*"
      - "tools/extension-catalog.test.mts"
      - "tools/generate-content.mts"
      - "/src/extensions/contracts/extension-target-profiles.{mts,toml}"
      - "/tools/release/platform-compatibility-policy.mts"
      - "/bun.lock"
  build:
    command: "bun run build"
    inputs:
      - "**/*"
      - "/src/extensions/generated/extensions.catalog.json"
      - "/src/extensions/generated/sdk/extensions.json"
      - "/src/extensions/generated/wasix/extensions.json"
      - "/src/extensions/generated/mobile/static-registry.json"
      - "/src/extensions/contracts/extension-target-profiles.{mts,toml}"
      - "/release-please-config.json"
      - "/.release-please-manifest.json"
      - "/tools/release/platform-compatibility-policy.mts"
      - "/bun.lock"
    outputs:
      - "/target/docs/build/**/*"
      - "/target/docs/generated/routes.json"
    options:
      # Published release metadata must refresh even when source inputs are unchanged.
      cache: false
      mutex: "docs-generated-files"
  test-package:
    command: "bun run smoke"
    deps:
      - target: "docs:build"
        cacheStrategy: "outputs"
    inputs:
      - "/target/docs/build/**/*"
      - "/target/docs/generated/routes.json"
      - "tools/smoke-built-site.mts"
    options:
      cache: false
      mutex: "docs-generated-files"
