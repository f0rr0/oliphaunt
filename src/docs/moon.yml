$schema: "https://moonrepo.dev/schemas/project.json"

id: "docs"
language: "typescript"
layer: "application"
stack: "frontend"
tags: ["docs", "fumadocs", "next", "public"]
dependsOn:
  - id: "extensions"
    scope: "build"

project:
  title: "Oliphaunt Docs"
  description: "Public documentation site, generated SDK matrices, tested snippets, and release-readiness docs gates."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/docs"
  paths:
    "**/*.md": ["@oliphaunt/docs"]
    "**/*.ts": ["@oliphaunt/docs"]
    "**/*.tsx": ["@oliphaunt/docs"]
    "docs-manifest.toml": ["@oliphaunt/docs"]

tasks:
  dev:
    tags: ["dev"]
    command: "pnpm --dir src/docs run dev"
    inputs:
      - "/docs/**/*"
      - "/.release-please-manifest.json"
      - "/release-please-config.json"
      - "/src/**/release.toml"
      - "**/*"
      - project: "extensions"
        group: "model"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  check:
    tags: ["quality", "static"]
    command: "pnpm --dir src/docs run check"
    inputs:
      - "/README.md"
      - "/.release-please-manifest.json"
      - "/docs/**/*"
      - "/release-please-config.json"
      - "/src/**/README.md"
      - "/src/**/typedoc.json"
      - "/src/sdks/**/package.json"
      - "/src/bindings/**/package.json"
      - "/src/sdks/**/Cargo.toml"
      - "/src/bindings/**/Cargo.toml"
      - "/src/sdks/**/Package.swift"
      - "/src/sdks/**/build.gradle.kts"
      - "/src/runtimes/liboliphaunt/native/include/oliphaunt.h"
      - "/src/sdks/rust/src/**/*"
      - "/src/sdks/swift/Sources/**/*"
      - "/src/sdks/kotlin/oliphaunt/src/commonMain/**/*"
      - "/src/sdks/kotlin/oliphaunt/src/androidMain/**/*.kt"
      - "/src/sdks/kotlin/oliphaunt-android-gradle-plugin/src/main/java/**/*"
      - "/src/sdks/js/src/**/*"
      - "/src/sdks/react-native/src/**/*"
      - "/src/bindings/wasix-rust/crates/oliphaunt-wasix/src/**/*"
      - "/src/bindings/wasix-ts/src/**/*"
      - "/src/**/release.toml"
      - "**/*"
      - project: "extensions"
        group: "model"
      - "@group(pnpm-workspace)"
    options:
      cache: true
      runFromWorkspaceRoot: true
  build:
    tags: ["build", "package"]
    command: "pnpm --dir src/docs run build"
    inputs:
      - "/docs/**/*"
      - "/.release-please-manifest.json"
      - "/release-please-config.json"
      - "/src/**/README.md"
      - "/src/**/typedoc.json"
      - "/src/sdks/**/package.json"
      - "/src/bindings/**/package.json"
      - "/src/sdks/**/Cargo.toml"
      - "/src/bindings/**/Cargo.toml"
      - "/src/sdks/**/Package.swift"
      - "/src/sdks/**/build.gradle.kts"
      - "/src/runtimes/liboliphaunt/native/include/oliphaunt.h"
      - "/src/sdks/rust/src/**/*"
      - "/src/sdks/swift/Sources/**/*"
      - "/src/sdks/kotlin/oliphaunt/src/commonMain/**/*"
      - "/src/sdks/kotlin/oliphaunt/src/androidMain/**/*.kt"
      - "/src/sdks/kotlin/oliphaunt-android-gradle-plugin/src/main/java/**/*"
      - "/src/sdks/js/src/**/*"
      - "/src/sdks/react-native/src/**/*"
      - "/src/bindings/wasix-rust/crates/oliphaunt-wasix/src/**/*"
      - "/src/bindings/wasix-ts/src/**/*"
      - "/src/**/release.toml"
      - "**/*"
      - project: "extensions"
        group: "model"
      - "@group(pnpm-workspace)"
    outputs:
      - "/target/docs/build/**/*"
    options:
      cache: local
      runFromWorkspaceRoot: true
  smoke:
    tags: ["runtime", "smoke"]
    command: "pnpm --dir src/docs run smoke"
    deps:
      - target: "docs:build"
        cacheStrategy: "outputs"
    inputs:
      - "/target/docs/build/**/*"
      - "/target/docs/static/**/*"
      - "/src/docs/tools/smoke-built-site.mjs"
    options:
      cache: local
      runFromWorkspaceRoot: true
  qualify:
    tags: ["release", "package"]
    command: "pnpm --dir src/docs run release-check"
    deps:
      - target: "docs:build"
        cacheStrategy: "outputs"
    inputs:
      - "/README.md"
      - "/.release-please-manifest.json"
      - "/docs/**/*"
      - "/release-please-config.json"
      - "/src/**/CHANGELOG.md"
      - "/src/**/README.md"
      - "/src/**/typedoc.json"
      - "/src/sdks/**/package.json"
      - "/src/bindings/**/package.json"
      - "/src/sdks/**/Cargo.toml"
      - "/src/bindings/**/Cargo.toml"
      - "/src/sdks/**/Package.swift"
      - "/src/sdks/**/build.gradle.kts"
      - "/src/runtimes/liboliphaunt/native/include/oliphaunt.h"
      - "/src/sdks/rust/src/**/*"
      - "/src/sdks/swift/Sources/**/*"
      - "/src/sdks/kotlin/oliphaunt/src/commonMain/**/*"
      - "/src/sdks/kotlin/oliphaunt/src/androidMain/**/*.kt"
      - "/src/sdks/kotlin/oliphaunt-android-gradle-plugin/src/main/java/**/*"
      - "/src/sdks/js/src/**/*"
      - "/src/sdks/react-native/src/**/*"
      - "/src/bindings/wasix-rust/crates/oliphaunt-wasix/src/**/*"
      - "/src/bindings/wasix-ts/src/**/*"
      - "/src/**/release.toml"
      - "**/*"
      - project: "extensions"
        group: "model"
      - "@group(pnpm-workspace)"
    options:
      cache: local
      runFromWorkspaceRoot: true
