[workspace]
members = [
  "src/native/node-addon",
  "src/native/rust-bindings",
  "src/native/mobile-bindings",
  "src/query/rust",
  "src/wasix/sdks/rust",
  "src/wasix/node-addon",
  "src/wasix/pgwire-server",
  "src/native/sdks/rust/crates/oliphaunt-build",
  "src/native/sdks/rust",
  "src/native/postgres-tools/crates/tools",
  "src/native/broker",
  "src/database-resources/icu/cargo",
  "src/database-resources/seeds/wasix",
  "src/wasix/runtime/crates/assets",
  "src/wasix/postgres-tools/crates/tools",
  "src/wasix/runtime/crates/aot/aarch64-apple-darwin",
  "src/wasix/runtime/crates/aot/x86_64-unknown-linux-gnu",
  "src/wasix/runtime/crates/aot/aarch64-unknown-linux-gnu",
  "src/wasix/runtime/crates/aot/x86_64-pc-windows-msvc",
  "src/wasix/postgres-tools/crates/aot/aarch64-apple-darwin",
  "src/wasix/postgres-tools/crates/aot/x86_64-unknown-linux-gnu",
  "src/wasix/postgres-tools/crates/aot/aarch64-unknown-linux-gnu",
  "src/wasix/postgres-tools/crates/aot/x86_64-pc-windows-msvc",
  "src/benchmarks/perf/runner",
  "src/extensions/tests/native",
  "src/native/runtime/packaging",
  "src/native/postgres-tools/tests",
  "src/wasix/runtime/tools/xtask",
  "src/wasix/runtime/tools/v8-serializer",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
repository = "https://github.com/f0rr0/oliphaunt"
homepage = "https://oliphaunt.dev"
license = "MIT"

[workspace.dependencies]
# These adapters exchange Rust types/state with the SDK they adopt.
liboliphaunt-native-bindings = { path = "src/native/rust-bindings", version = "0.2.0" }
oliphaunt-wasix = { path = "src/wasix/sdks/rust", version = "0.3.2" }
wasmer = { package = "oliphaunt-wasmer", version = "=0.3.2", default-features = false }

[profile.release]
strip = "symbols"
