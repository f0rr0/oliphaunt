  "runtimes/liboliphaunt-wasix/crates/aot/x86_64-pc-windows-msvc",
  "postgres-tools/wasix/crates/aot/aarch64-apple-darwin",
  "postgres-tools/wasix/crates/aot/x86_64-unknown-linux-gnu",
  "postgres-tools/wasix/crates/aot/aarch64-unknown-linux-gnu",
  "postgres-tools/wasix/crates/aot/x86_64-pc-windows-msvc",
