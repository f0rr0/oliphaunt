  "sdks/rust/mobile-bindings",
  "sdks/rust-query",
  "sdks/rust-wasix",
  "sdks/rust/sdk/crates/oliphaunt-build",
  "sdks/rust/sdk",
  "postgres-tools/native/crates/tools",
  "broker",
  "pgwire-server",
  "database-resources/icu/cargo",
  "database-resources/seeds/wasix",
  "runtimes/liboliphaunt-wasix/crates/assets",
  "postgres-tools/wasix/crates/tools",
  "runtimes/liboliphaunt-wasix/crates/aot/aarch64-apple-darwin",
  "runtimes/liboliphaunt-wasix/crates/aot/x86_64-unknown-linux-gnu",
