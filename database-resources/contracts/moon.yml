$schema: "https://moonrepo.dev/schemas/project.json"

id: "cluster-seed-contract"
language: "typescript"
layer: "configuration"
stack: "systems"
tags: ["javascript-quality", "postgres", "contract", "runtime"]

project:
  title: "Cluster Seed Contract"
  description: "Canonical standard/ICU seed and portable ICU-data identity contract."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

fileGroups:
  contract:
    - "**/*"
    - "!moon.yml"
    - "!*.test.mts"

tasks:
  test:
    tags: ["quality", "unit"]
    command: "bun test ./database-resources/contracts"
    inputs: ["**/*"]
    options:
      runFromWorkspaceRoot: true
