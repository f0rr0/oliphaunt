[package]
name = "oliphaunt-wasix-seed-producer"
version = "0.0.0"
edition = "2024"
rust-version = "1.93"
license.workspace = true
publish = false

[[bin]]
name = "oliphaunt-wasix-seed-producer"
path = "src/main.rs"
required-features = ["cluster-seed-runner"]

[features]
default = []
cluster-seed-runner = ["dep:wasmer", "dep:wasmer-wasix", "dep:tokio", "dep:webc", "dep:serde", "dep:serde_json", "dep:async-trait"]

[dependencies]
anyhow = "1"
async-trait = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tokio = { version = "1", features = ["rt-multi-thread"], optional = true }
wasmer = { version = "=7.2.1", default-features = false, features = ["sys", "llvm"], optional = true }
wasmer-wasix = { version = "=0.702.1", default-features = false, features = ["sys-minimal", "sys-poll", "sys-thread", "time", "host-fs"], optional = true }
webc = { version = "=12.0.0", optional = true }
