$schema: "https://moonrepo.dev/schemas/project.json"

id: "integration-examples"
language: "typescript"
layer: "application"
stack: "frontend"
tags: ["examples", "integration"]

project:
  title: "Integration Examples"
  description: "Cross-product examples and installed-app validation entrypoints."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  check:
    tags: ["quality", "static"]
    command: "bash tools/dev/bun.sh examples/tools/check-examples.mjs"
    inputs:
      - "/Cargo.lock"
      - "/Cargo.toml"
      - "/examples/**/*"
      - "/package.json"
      - "/pnpm-lock.yaml"
      - "/pnpm-workspace.yaml"
      - "/release-please-config.json"
      - "!/examples/**/node_modules"
      - "!/examples/**/node_modules/**"
      - "/src/runtimes/liboliphaunt/native/VERSION"
      - "/src/runtimes/liboliphaunt/native/tools-npm/package.json"
      - "/src/sdks/js/package.json"
      - "/src/sources/toolchains/wasix.toml"
      - "/src/bindings/wasix-rust/moon.yml"
      - "/src/bindings/wasix-rust/crates/oliphaunt-wasix/Cargo.toml"
      - "/src/sdks/react-native/moon.yml"
      - "/src/**/examples/**/*"
      - "/src/extensions/contrib/carriers.toml"
      - "/.release-please-manifest.json"
      - "/src/sdks/react-native/tools/mobile-e2e.sh"
      - "/src/sdks/react-native/tools/expo-android-runner.sh"
      - "/src/sdks/react-native/tools/expo-ios-runner.sh"
      - "/examples/tools/check-examples.mjs"
      - "/examples/tools/check-examples.sh"
      - "/tools/release/example-cargo-policy.mjs"
      - "/tools/release/publication-catalog.mjs"
      - "/tools/release/contrib-carriers.mjs"
      - "/tools/release/release-graph.mjs"
      - "/tools/release/wasix-cargo-toolchain-policy.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
