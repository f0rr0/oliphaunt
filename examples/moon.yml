$schema: "https://moonrepo.dev/schemas/project.json"

id: "integration-examples"
language: "typescript"
layer: "application"
stack: "frontend"
tags: ["examples", "integration"]
dependsOn:
  - id: "extensions"
    scope: "build"
  - "liboliphaunt-native"
  - "oliphaunt-broker"
  - "oliphaunt-js"
  - "oliphaunt-kotlin"
  - "oliphaunt-node-direct"
  - "oliphaunt-react-native"
  - "oliphaunt-swift"
  - "oliphaunt-wasix-ts"
  - "release-tools"

project:
  title: "Integration Examples"
  description: "Cross-product examples and installed-app validation entrypoints."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  js-sdk-smoke:
    tags: ["runtime", "smoke", "node", "bun", "deno"]
    command: "sh tools/smoke-js-sdk.sh"
    deps:
      - "liboliphaunt-native:release-runtime"
      - "oliphaunt-broker:build"
      - "release-tools:node-direct-runtime"
    inputs:
      - project: "oliphaunt-js"
        group: "code"
      - "/src/runtimes/liboliphaunt/native/tools/runtime-preflight.sh"
      - "tools/smoke-js-sdk.sh"
    options:
      cache: local
      runFromWorkspaceRoot: true
      runInCI: false

  browser-wasix-compile:
    tags: ["quality", "static", "browser", "wasix"]
    command: "pnpm --dir examples/browser-wasix typecheck"
    inputs:
      - "browser-wasix/**/*"
      - project: "oliphaunt-wasix-ts"
        group: "code"
      - "@group(pnpm-workspace)"
    options:
      cache: true
      runFromWorkspaceRoot: true

  check:
    tags: ["quality", "static"]
    command: "bun examples/tools/check-examples.mjs"
    inputs:
      - "**/*"
      - "@group(pnpm-workspace)"
      - "!/examples/**/node_modules"
      - "!/examples/**/node_modules/**"
      - "/src/**/examples/**/*"
      - "/examples/tools/check-examples.mjs"
    options:
      cache: true
      runFromWorkspaceRoot: true
  react-native-android-build:
    tags: ["mobile", "build", "android", "ci-mobile-build-android"]
    command: "pnpm --dir examples/react-native-expo run mobile-build:android"
    deps:
      - "release-tools:kotlin-sdk-package"
      - "release-tools:react-native-sdk-package"
    inputs:
      - "react-native-expo/**/*"
      - project: "oliphaunt-kotlin"
        group: "code"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/target/extension-artifacts/**/*"
      - "/target/sdk-artifacts/oliphaunt-kotlin/**/*"
      - "/target/sdk-artifacts/oliphaunt-react-native/**/*"
      - "/tools/native-packaging/**/*"
    outputs:
      - "/target/mobile-build/react-native/android/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
  react-native-android-e2e:
    tags: ["mobile", "e2e", "android"]
    command: "pnpm --dir examples/react-native-expo run mobile-e2e:android"
    deps:
      - "integration-examples:react-native-android-build"
    inputs:
      - "react-native-expo/src/**/*"
      - "react-native-expo/maestro/**/*"
      - "react-native-expo/package.json"
      - project: "oliphaunt-react-native"
        group: "code"
      - "/src/sources/toolchains/android-emulator-runner.toml"
      - "/src/sources/toolchains/maestro.toml"
      - "/tools/dev/setup-maestro.sh"
      - "/target/mobile-build/react-native/android/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: skip
  react-native-android-drill:
    tags: ["mobile", "drill", "android"]
    command: "pnpm --dir examples/react-native-expo run mobile-drill:android"
    inputs:
      - "react-native-expo/**/*"
      - project: "oliphaunt-kotlin"
        group: "code"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/tools/native-packaging/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  react-native-ios-build:
    tags: ["mobile", "build", "ios", "ci-mobile-build-ios"]
    command: "pnpm --dir examples/react-native-expo run mobile-build:ios"
    deps:
      - "release-tools:react-native-sdk-package"
      - "release-tools:swift-sdk-package"
    inputs:
      - "react-native-expo/**/*"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "oliphaunt-swift"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/target/extension-artifacts/**/*"
      - "/target/sdk-artifacts/oliphaunt-react-native/**/*"
      - "/target/sdk-artifacts/oliphaunt-swift/**/*"
      - "/tools/native-packaging/**/*"
    outputs:
      - "/target/mobile-build/react-native/ios/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
  react-native-ios-e2e:
    tags: ["mobile", "e2e", "ios"]
    command: "pnpm --dir examples/react-native-expo run mobile-e2e:ios"
    deps:
      - "integration-examples:react-native-ios-build"
    inputs:
      - "react-native-expo/src/**/*"
      - "react-native-expo/maestro/**/*"
      - "react-native-expo/package.json"
      - project: "oliphaunt-react-native"
        group: "code"
      - "/src/sources/toolchains/maestro.toml"
      - "/tools/dev/setup-maestro.sh"
      - "/target/mobile-build/react-native/ios/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: skip
  react-native-ios-drill:
    tags: ["mobile", "drill", "ios"]
    command: "pnpm --dir examples/react-native-expo run mobile-drill:ios"
    inputs:
      - "react-native-expo/**/*"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "oliphaunt-swift"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/tools/native-packaging/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
