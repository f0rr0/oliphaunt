$schema: "https://moonrepo.dev/schemas/project.json"

id: "integration-examples"
language: "typescript"
layer: "application"
stack: "frontend"
tags: ["javascript-quality", "examples", "integration"]
dependsOn:
  - id: "extension-packages"
    scope: "build"
  - id: "extensions"
    scope: "build"
  - "liboliphaunt-native"
  - "oliphaunt-broker"
  - "oliphaunt-js"
  - "oliphaunt-kotlin"
  - "oliphaunt-node-direct"
  - "oliphaunt-react-native"
  - "oliphaunt-swift"
  - "oliphaunt-wasix-ts"
  - "release-tools"

project:
  title: "Integration Examples"
  description: "Cross-product examples and installed-app validation entrypoints."
  owner: "oliphaunt"

owners:
  defaultOwner: "@oliphaunt/core"
  paths:
    "**/*": ["@oliphaunt/core"]

tasks:
  js-sdk-smoke:
    tags: ["runtime", "smoke", "node", "bun", "deno"]
    command: "sh examples/tools/smoke-js-sdk.sh"
    deps:
      - "liboliphaunt-native:build-runtime-desktop-target"
      - "oliphaunt-broker:build"
      - "oliphaunt-node-direct:build-release-assets"
    inputs:
      - project: "oliphaunt-js"
        group: "code"
      - "/src/runtimes/liboliphaunt/native/tools/runtime-preflight.sh"
      - "tools/smoke-js-sdk.sh"
    options:
      cache: local
      runFromWorkspaceRoot: true
      runInCI: false

  browser-wasix-compile:
    tags: ["quality", "static", "browser", "wasix"]
    command: "pnpm --dir examples/browser-wasix typecheck"
    deps:
      - "shared-js-core:build"
    inputs:
      - "browser-wasix/**/*"
      - project: "oliphaunt-wasix-ts"
        group: "code"
      - "@group(pnpm-workspace)"
    options:
      cache: true
      runFromWorkspaceRoot: true

  check:
    tags: ["quality", "static"]
    script: |
      set -e
      bash examples/tools/stage-tauri-webdriver-app.test.sh
      bash examples/tools/run-tauri-webdriver-smoke.test.sh
      bun test examples/react-native-expo/tools/smoke-pass-receipt.test.mts examples/react-native-expo/tools/mobile-extension-proof.test.mts
    inputs:
      - "**/*"
      - "@group(pnpm-workspace)"
      - "!/examples/**/node_modules"
      - "!/examples/**/node_modules/**"
    options:
      cache: true
      runFromWorkspaceRoot: true
  react-native-android-build:
    tags: ["mobile", "build", "android", "ci-mobile-build-android"]
    script: |
      export OLIPHAUNT_EXPO_EXTENSION_ARTIFACT_ROOT="${OLIPHAUNT_EXPO_EXTENSION_ARTIFACT_ROOT:-$PWD/target/mobile-extension-artifacts}"
      exec pnpm --dir examples/react-native-expo run mobile-build:android
    deps:
      - "extension-packages:package-mobile"
      - "liboliphaunt-native:package-runtime-android-x86_64"
      - "oliphaunt-kotlin:release-package"
      - "oliphaunt-react-native:release-package"
    inputs:
      - "react-native-expo/**/*"
      - project: "oliphaunt-kotlin"
        group: "code"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/target/mobile-extension-artifacts/**/*"
      - "/target/sdk-artifacts/oliphaunt-kotlin/**/*"
      - "/target/sdk-artifacts/oliphaunt-react-native/**/*"
      - "/src/runtimes/liboliphaunt/native/packaging/**/*"
    outputs:
      - "/target/mobile-build/react-native/android/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
  react-native-android-e2e:
    tags: ["mobile", "e2e", "android"]
    command: "pnpm --dir examples/react-native-expo run mobile-e2e:android"
    deps:
      - "integration-examples:react-native-android-build"
    inputs:
      - "react-native-expo/src/**/*"
      - "react-native-expo/maestro/**/*"
      - "react-native-expo/package.json"
      - project: "oliphaunt-react-native"
        group: "code"
      - "/src/sources/toolchains/android-emulator-runner.toml"
      - "/src/sources/toolchains/maestro.toml"
      - "/src/shared/mobile-tools/setup-maestro.sh"
      - "/target/mobile-build/react-native/android/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: skip
  react-native-android-drill:
    tags: ["mobile", "drill", "android"]
    command: "pnpm --dir examples/react-native-expo run mobile-drill:android"
    inputs:
      - "react-native-expo/**/*"
      - project: "oliphaunt-kotlin"
        group: "code"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/src/runtimes/liboliphaunt/native/packaging/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
  react-native-ios-build:
    tags: ["mobile", "build", "ios", "ci-mobile-build-ios"]
    script: |
      export OLIPHAUNT_EXPO_EXTENSION_ARTIFACT_ROOT="${OLIPHAUNT_EXPO_EXTENSION_ARTIFACT_ROOT:-$PWD/target/mobile-extension-artifacts}"
      exec pnpm --dir examples/react-native-expo run mobile-build:ios
    deps:
      - "extension-packages:package-mobile"
      - "liboliphaunt-native:package-runtime-ios-xcframework"
      - "oliphaunt-react-native:release-package"
      - "oliphaunt-swift:release-package"
    inputs:
      - "react-native-expo/**/*"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "oliphaunt-swift"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/target/mobile-extension-artifacts/**/*"
      - "/target/sdk-artifacts/oliphaunt-react-native/**/*"
      - "/target/sdk-artifacts/oliphaunt-swift/**/*"
      - "/src/runtimes/liboliphaunt/native/packaging/**/*"
    outputs:
      - "/target/mobile-build/react-native/ios/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
  react-native-ios-e2e:
    tags: ["mobile", "e2e", "ios"]
    command: "pnpm --dir examples/react-native-expo run mobile-e2e:ios"
    deps:
      - "integration-examples:react-native-ios-build"
    inputs:
      - "react-native-expo/src/**/*"
      - "react-native-expo/maestro/**/*"
      - "react-native-expo/package.json"
      - project: "oliphaunt-react-native"
        group: "code"
      - "/src/sources/toolchains/maestro.toml"
      - "/src/shared/mobile-tools/setup-maestro.sh"
      - "/target/mobile-build/react-native/ios/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: skip
  react-native-ios-drill:
    tags: ["mobile", "drill", "ios"]
    command: "pnpm --dir examples/react-native-expo run mobile-drill:ios"
    inputs:
      - "react-native-expo/**/*"
      - project: "oliphaunt-react-native"
        group: "code"
      - project: "oliphaunt-swift"
        group: "code"
      - project: "extensions"
        group: "build"
      - "/src/runtimes/liboliphaunt/native/packaging/**/*"
    options:
      cache: false
      runFromWorkspaceRoot: true
      runInCI: false
