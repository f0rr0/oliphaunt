[package]
name = "oliphaunt-example-tauri"
version = "0.0.0"
description = "Tauri todo app backed by the Oliphaunt native Rust SDK"
edition = "2021"
publish = false

[workspace]

[lib]
name = "oliphaunt_example_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
oliphaunt = { version = "=0.2.0" }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
thiserror = "2"
