$schema: "https://moonrepo.dev/schemas/tasks.json"

fileGroups:
  cargo-workspace:
    - "/Cargo.lock"
    - "/Cargo.toml"
    - "/rust-toolchain.toml"
  rust-test-config:
    - "/.config/nextest.toml"
  pnpm-workspace:
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"
  legal-files:
    - "/LICENSE"
    - "/THIRD_PARTY_NOTICES.md"
  release-archive-contract:
    - "/tools/release/release-directory-safety.mjs"
    - "/src/shared/artifact-packaging/portable-archive.mjs"
    - "/tools/release/release-notices.mjs"
  release-target-contract:
    - "/tools/release/platform-compatibility-policy.mjs"
    - "/src/shared/extension-runtime-contract/extension-target-profiles.mjs"
    - "/src/shared/extension-runtime-contract/extension-target-profiles.toml"
    - "/tools/release/release-artifact-targets.mjs"
# Installed dependency trees are derived state. Task invalidation comes from
# tracked package manifests, workspace configuration, and lockfiles instead of
# pnpm's directory symlinks, which Moon cannot hash as files.
implicitInputs:
  # Changes to shared groups and universal inputs must invalidate their users.
  - "/.moon/tasks/inputs.yml"
  # Git and Moon use ignore policy while constructing repository and affected
  # inventories, so it is part of every task's interpreted input universe.
  - "/.gitignore"
  # Checkout normalization affects every source byte seen by every task.
  - "/.gitattributes"
  # Toolchain pin changes alter task execution even when project sources do not.
  - "/.prototools"
  - "!/node_modules"
  - "!/node_modules/**"
  - "!/examples/**/node_modules"
  - "!/examples/**/node_modules/**"
  - "!/src/**/node_modules"
  - "!/src/**/node_modules/**"
  - "!/tools/**/node_modules"
  - "!/tools/**/node_modules/**"
