$schema: "https://moonrepo.dev/schemas/tasks.json"

taskOptions:
  unixShell: "bash"
  windowsShell: "bash"

fileGroups:
  cargo-workspace:
    - "/Cargo.lock"
    - "/Cargo.toml"
    - "/rust-toolchain.toml"
  rust-test-config:
    - "/.config/nextest.toml"
  bun-workspace:
    - "/package.json"
    - "/bun.lock"
    - "/bunfig.toml"
  legal-files:
    - "/LICENSE"
    - "/THIRD_PARTY_NOTICES.md"
  upstream-licenses:
    - "/third-party/postgres/COPYRIGHT"
    - "/third-party/icu/LICENSE"
    - "/third-party/openssl/LICENSE.txt"
  release-archive-contract:
    - "/tools/packaging/release-directory-safety.mts"
    - "/tools/packaging/portable-archive.mts"
    - "/tools/packaging/release-notices.mts"
  package-test-metadata:
    - "/release-please-config.json"
    - "/.release-please-manifest.json"
    - "/**/release.toml"
    - "/**/moon.yml"
    - "/**/{VERSION,LIBOLIPHAUNT_VERSION,Cargo.toml,package.json,gradle.properties}"
    - "/**/targets/**/*.toml"
    - "/extensions/generated/extensions.catalog.json"
    - "/extensions/contrib/*.toml"
    - "/extensions/external/**/{recipe,source}.toml"
    - "/third-party/postgres/source.toml"
    - "/tools/release/release-graph.mts"
    - "/tools/release/release-history.mts"
    - "/extensions/artifacts/packages/tools/contrib-carriers.mts"
    - "/extensions/artifacts/packages/tools/extension-registry-packages.mts"
    - "/runtimes/liboliphaunt-wasix/tools/wasix-cargo-artifact-contract.mts"
  release-target-contract:
    - "/tools/release/platform-compatibility-policy.mts"
    - "/extensions/contracts/extension-target-profiles.mts"
    - "/extensions/contracts/extension-target-profiles.toml"
    - "/tools/release/release-artifact-targets.mts"
# Installed dependency trees are derived state. Task invalidation comes from
# tracked package manifests, workspace configuration, and lockfiles instead of
# Bun's directory symlinks, which Moon cannot hash as files.
implicitInputs:
  # Changes to shared groups and universal inputs must invalidate their users.
  - "/.moon/tasks/inputs.yml"
  # Git and Moon use ignore policy while constructing repository and affected
  # inventories, so it is part of every task's interpreted input universe.
  - "/.gitignore"
  # Checkout normalization affects every source byte seen by every task.
  - "/.gitattributes"
  # Toolchain pin changes alter task execution even when project sources do not.
  - "/.prototools"
  - "!/node_modules"
  - "!/node_modules/**"
  - "!/**/node_modules"
  - "!/**/node_modules/**"
