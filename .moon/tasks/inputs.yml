$schema: "https://moonrepo.dev/schemas/tasks.json"

fileGroups:
  cargo-workspace:
    - "/Cargo.lock"
    - "/Cargo.toml"
    - "/rust-toolchain.toml"
  rust-test-config:
    - "/.config/nextest.toml"
  pnpm-workspace:
    - "/package.json"
    - "/pnpm-lock.yaml"
    - "/pnpm-workspace.yaml"
  legal-files:
    - "/LICENSE"
    - "/THIRD_PARTY_NOTICES.md"
  release-archive-contract:
    - "/src/shared/artifact-packaging/release-directory-safety.mts"
    - "/src/shared/artifact-packaging/portable-archive.mts"
    - "/src/shared/artifact-packaging/release-notices.mts"
  package-test-metadata:
    - "/release-please-config.json"
    - "/.release-please-manifest.json"
    - "/src/**/release.toml"
    - "/src/**/moon.yml"
    - "/src/**/{VERSION,LIBOLIPHAUNT_VERSION,Cargo.toml,package.json,gradle.properties}"
    - "/src/**/targets/**/*.toml"
    - "/src/extensions/generated/extensions.catalog.json"
    - "/src/extensions/contrib/*.toml"
    - "/src/extensions/external/**/{recipe,source}.toml"
    - "/src/postgres/versions/18/source.toml"
    - "/src/shared/product-metadata/release-graph.mts"
    - "/src/shared/product-metadata/release-history.mts"
    - "/src/extensions/artifacts/packages/tools/contrib-carriers.mts"
    - "/src/extensions/artifacts/packages/tools/extension-registry-packages.mts"
    - "/src/runtimes/liboliphaunt/wasix/tools/wasix-cargo-artifact-contract.mts"
  release-target-contract:
    - "/src/shared/product-metadata/platform-compatibility-policy.mts"
    - "/src/shared/extension-runtime-contract/extension-target-profiles.mts"
    - "/src/shared/extension-runtime-contract/extension-target-profiles.toml"
    - "/src/shared/product-metadata/release-artifact-targets.mts"
# Installed dependency trees are derived state. Task invalidation comes from
# tracked package manifests, workspace configuration, and lockfiles instead of
# pnpm's directory symlinks, which Moon cannot hash as files.
implicitInputs:
  # Changes to shared groups and universal inputs must invalidate their users.
  - "/.moon/tasks/inputs.yml"
  # Git and Moon use ignore policy while constructing repository and affected
  # inventories, so it is part of every task's interpreted input universe.
  - "/.gitignore"
  # Checkout normalization affects every source byte seen by every task.
  - "/.gitattributes"
  # Toolchain pin changes alter task execution even when project sources do not.
  - "/.prototools"
  - "!/node_modules"
  - "!/node_modules/**"
  - "!/examples/**/node_modules"
  - "!/examples/**/node_modules/**"
  - "!/src/**/node_modules"
  - "!/src/**/node_modules/**"
  - "!/tools/**/node_modules"
  - "!/tools/**/node_modules/**"
